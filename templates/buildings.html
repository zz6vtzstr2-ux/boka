<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挂机建筑 · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back { color: #888; text-decoration: none; }
    .building { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .building h3 { margin: 0 0 8px 0; }
    .building .info { font-size: 14px; color: #aaa; margin-bottom: 8px; }
    .building .card-slot { display: inline-block; background: #0f3460; border-radius: 6px;
                           padding: 6px 12px; margin-right: 8px; font-size: 13px; }
    .building .empty { color: #666; font-style: italic; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-upgrade { background: #4ecca3; color: #1a1a2e; }
    .btn-upgrade:disabled { background: #444; color: #888; cursor: not-allowed; }
    .collect-bar { background: #0f3460; border-radius: 10px; padding: 16px; margin-bottom: 16px;
                   display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h2>挂机建筑</h2>
    <a href="/" class="back">返回主页</a>
  </header>

  <div class="collect-bar">
    <div>建材：{{ materials }}</div>
    <button class="btn btn-upgrade" onclick="collect()">收取产出</button>
  </div>

  {% for b in buildings %}
  <div class="building">
    <h3>{{ b.name }} · Lv.{{ b.level }}</h3>
    <div class="info">
      对应属性：{{ b.attr }} ·
      {% if b.card %}
        主将：<span class="card-slot">{{ b.card.name }}</span>
      {% else %}
        <span class="empty">未放置主将</span>
      {% endif %}
      {% if b.deputy %}
        副将：<span class="card-slot">{{ b.deputy.name }}</span>
      {% endif %}
    </div>
    <button class="btn btn-upgrade" onclick="upgradeBuilding({{ b.bid }})"
            {% if b.level >= 100 %}disabled{% endif %}>
      {% if b.level >= 100 %}已满级{% else %}升级（消耗 {{ (b.level + 1) * 10 }} 建材）{% endif %}
    </button>
  </div>
  {% endfor %}

  <script>
    async function collect() {
      const res = await fetch('/collect', {method: 'POST'});
      const data = await res.json();
      alert(`获得 ${data.gold} 金币 ${data.silver} 银币 ${data.copper} 铜币`);
    }

    async function upgradeBuilding(bid) {
      const res = await fetch('/upgrade_building', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({bid: bid})
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      location.reload();
    }
  </script>
</body>
</html>
