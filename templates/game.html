<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡游戏</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
      background-color: #f2f0e8;
      background-image: url('/static/images/主页背景.JPG');
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }
    .top-box {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8e0cc;
    }
    .title-block h1 {
      font-size: 28px;
      margin: 0;
      color: #2c3e50;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .title-block .en {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .user-block {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .user-block img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 2px solid #d8d0bc;
      background: #fff;
    }
    .user-block .nickname {
      font-size: 15px;
      font-weight: bold;
      color: #2c3e50;
    }
    .capsule {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid transparent;
    }
    .capsule-score {
      background: #2c6e5a;
      color: #fff;
      border-color: #235a4a;
    }
    .capsule-gold {
      background: #f5e6b8;
      color: #8a6d1f;
      border-color: #e0c97b;
    }
    .capsule-silver {
      background: #e8e8e8;
      color: #666;
      border-color: #c8c8c8;
    }
    .capsule-copper {
      background: #f0dcc8;
      color: #8a5a2b;
      border-color: #d8b090;
    }
    .coin {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-left: 2px;
    }
    .coin-gold { background: #d4a86b; border: 1px solid #b8952f; }
    .coin-silver { background: #a8a8a8; border: 1px solid #888; }
    .coin-copper { background: #b87b4a; border: 1px solid #8a5a2b; }
    .link-btn {
      background: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #e0d8c0;
      font-size: 14px;
      color: #555;
      text-decoration: none;
    }
    .link-btn:hover { background: #f5f0e0; }
    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e0d8c0;
      color: #2c6e5a;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: transform 0.15s;
      min-width: 80px;
    }
    .nav a:hover { transform: translateY(-2px); background: #f5f0e0; }
    .nav a .en {
      font-size: 10px;
      color: #999;
      font-weight: normal;
      letter-spacing: 1px;
      margin-top: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="top-box">
    <div class="header">
      <div class="title-block">
        <h1>欢迎搏卡青年</h1>
        <div class="en">Welcome Boka Juniors</div>
      </div>
      <div class="user-block">
        <img src="/static/avatars/{{ username }}.JPG" alt="">
        <span class="nickname">{{ nickname }}</span>
        <span class="capsule capsule-score">积分 {{ score }}</span>
        <span class="capsule capsule-gold">{{ gold }}<span class="coin coin-gold"></span></span>
        <span class="capsule capsule-silver">{{ silver }}<span class="coin coin-silver"></span></span>
        <span class="capsule capsule-copper">{{ copper }}<span class="coin coin-copper"></span></span>
        <a href="/profile" class="link-btn">我的资料</a>
        <a href="/logout" class="link-btn">退出登录</a>
      </div>
    </div>

    <div class="nav">
      <a href="/buildings">家园<span class="en">Home</span></a>
      <a href="/draw">抽卡<span class="en">Draw</span></a>
      <a href="/data">数据<span class="en">Stats</span></a>
      <a href="/collection">收藏<span class="en">Cards</span></a>
      <a href="/boka">搏卡<span class="en">Boka</span></a>
      <a href="/challenge">个人挑战<span class="en">Personal Challenge</span></a>
      <a href="/world_boss">世界Boss<span class="en">World Boss</span></a>
    </div>
  </div>
</body>
</html>
