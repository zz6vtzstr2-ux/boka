<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      top: 0;
      bottom: 0;
      width: calc((100% - 868px) / 2);
      background: #f7f5ee;
      z-index: 1;
    }
    body::before { left: 0; }
    body::after { right: 0; }

    .bg-image {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 868px;
      max-width: 100%;
      height: 100vh;
      background-image: url('/static/images/主页背景.jpg');
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .top-box {
      position: absolute;
      top: 61.8vh;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 32px);
      max-width: 868px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      z-index: 2;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e8e0cc;
    }
    .title-block h1 {
      font-size: 34px;
      margin: 0;
      color: #2c3e50;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .title-block .en {
      font-size: 13px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .user-block {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-block .user-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .user-block .user-link:hover { opacity: 0.8; }
    .user-block img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      border: 2px solid #d8d0bc;
      background: #fff;
    }
    .user-block .nickname {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }
    .capsule {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      background: #e8f0ec;
      color: #000;
      border: 1px solid #c8d8d0;
    }
    .capsule-money {
      gap: 12px;
    }
    .money-item {
      display: flex;
      align-items: center;
      gap: 3px;
      color: #000;
    }
    .coin {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
    .coin-gold { background: #f5d76e; border: 2px solid #d4a86b; }
    .coin-silver { background: #d8d8d8; border: 2px solid #a8a8a8; }
    .coin-copper { background: #d89b6e; border: 2px solid #b87b4a; }
    .link-btn {
      background: #fce8ec;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #e8c8d0;
      font-size: 15px;
      color: #b85a6a;
      text-decoration: none;
    }
    .link-btn:hover { background: #f8d8de; }
    .nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 强制 3 列 */
      gap: 10px; /* 按钮间距 */
      width: 100%;
    }
    .nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; 
      height: 50px;
      border-radius: 12px;
      text-decoration: none;
      background: #5bb8e8;
      border: 1px solid #4aa8d8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3);
      transition: transform 0.15s;
    }
    .nav a:hover { transform: translateY(-2px); background: #4aa8d8; }
    
    .nav a.short { letter-spacing: 8px; text-indent: 8px; }
    .nav a.medium { letter-spacing: 3px; text-indent: 3px; }
    .nav a.long { letter-spacing: 1px; text-indent: 1px; }
    /* ===== 邮箱入口 ===== */
    .mail-btn {
      position: relative;
      background: #fdf6d8;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #f0e0a0;
      font-size: 15px;
      color: #8a6d1f;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .mail-btn:hover { background: #f8ecc8; }
    .mail-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: #d9534f;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      line-height: 18px;
      text-align: center;
      display: none;
    }
    .mail-badge.show { display: inline-block; }

    /* ===== 邮箱弹窗 ===== */
    .mail-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 400;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .mail-modal.active { display: flex; }
    .mail-inner {
      background: #fffdf5;
      border-radius: 16px;
      padding: 18px;
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 4px double #f0e0a0;
    }
    .mail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #e8e0cc;
      margin-bottom: 12px;
    }
    .mail-head h3 {
      margin: 0;
      color: #8a6d1f;
      letter-spacing: 2px;
    }
    .mail-back {
      background: #fce8ec;
      border: 1px solid #e8c8d0;
      color: #b85a6a;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .mail-back:hover { background: #f8d8de; }
    .mail-close {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5bb8e8;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      margin-top: 14px;
    }

    .mail-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .mail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      border-bottom: 1px solid #e8e0cc;
      cursor: pointer;
      border-radius: 8px;
    }
    .mail-item:hover { background: #f9f5e8; }
    .mail-item .title {
      font-size: 15px;
      font-weight: bold;
      color: #4a4a4a;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mail-item .time {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
    }
    .mail-item .flag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      vertical-align: middle;
    }
    .flag-unclaimed { background: #f5d76e; color: #7a5a1a; }
    .flag-claimed   { background: #d8e8dc; color: #4a7a5a; }
    .mail-empty {
      text-align: center;
      color: #bbb;
      padding: 40px 0;
      font-size: 14px;
    }

    .mail-detail {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      padding: 4px 2px;
    }
    .mail-detail h4 {
      margin: 0 0 6px 0;
      color: #2c3e50;
      font-size: 17px;
      letter-spacing: 1px;
    }
    .mail-detail .detail-time {
      font-size: 12px;
      color: #999;
      margin-bottom: 14px;
    }
    .mail-detail .detail-body {
      font-size: 14px;
      color: #444;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 18px;
    }
    .mail-claim {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5cb85c;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 2px;
    }
    .mail-claim:hover:not(:disabled) { background: #4ea84e; }
    .mail-claim:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="top-box">
    <div class="header">
      <div class="title-block">
        <h1>欢迎搏卡青年</h1>
        <div class="en">Welcome Boka Juniors</div>
      </div>
      <div class="user-block" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
        
        <!-- 第一行：头像信息(左) + 邮箱(右) -->
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <a href="/profile" class="user-link">
              <img src="/static/avatars/{{ username }}.jpg" alt="" style="width: 48px; height: 48px; border-radius: 10px; border: 2px solid #d8d0bc; background: #fff;">
              <span class="nickname" style="font-size: 18px; font-weight: bold; color: #2c3e50;">{{ nickname }}</span>
            </a>
            <span class="capsule" style="padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; background: #e8f0ec; border: 1px solid #c8d8d0;">⚔️ {{ score }}</span>
          </div>

          <button class="mail-btn" id="mailBtn" onclick="openMail()" style="padding: 6px 12px; border-radius: 8px; font-size: 14px; background: #fdf6d8; border: 1px solid #f0e0a0; color: #8a6d1f; font-weight: bold; cursor: pointer; position: relative;">
            ✉ 邮箱
            <span class="mail-badge" id="mailBadge" style="position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #d9534f; color: #fff; font-size: 10px; font-weight: bold; line-height: 16px; text-align: center; display: none;">0</span>
          </button>
        </div>

        <!-- 第二行：退出(左) + 钱币(右) -->
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          
          <button onclick="showLogoutConfirm()" class="link-btn" style="padding: 6px 16px; border-radius: 8px; font-size: 14px; background: #fce8ec; border: 1px solid #e8c8d0; color: #b85a6a; cursor: pointer; font-family: inherit;">退出登录</button>

          <span class="capsule capsule-money" style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; background: #e8f0ec; border: 1px solid #c8d8d0;">
            <span class="money-item" style="display: flex; align-items: center; gap: 3px;">{{ gold }}<span class="coin coin-gold" style="width: 14px; height: 14px; border-radius: 50%; display: inline-block;"></span></span>
            <span class="money-item" style="display: flex; align-items: center; gap: 3px;">{{ silver }}<span class="coin coin-silver" style="width: 14px; height: 14px; border-radius: 50%; display: inline-block;"></span></span>
            <span class="money-item" style="display: flex; align-items: center; gap: 3px;">{{ copper }}<span class="coin coin-copper" style="width: 14px; height: 14px; border-radius: 50%; display: inline-block;"></span></span>
          </span>

        </div>

      </div>
    </div>

    <div class="nav">
      <a href="/buildings" class="short">家园</a>
      <a href="/draw" class="short">抽卡</a>
      <a href="/collection" class="short">收藏</a>
      <a href="/boka" class="short">搏卡</a>
      <a href="/challenge" class="medium">个人挑战</a>
      <a href="/world_boss" class="long">世界Boss</a>
      <a href="/data" class="short">数据</a>
    </div>
  </div>
  <!-- 邮箱弹窗 -->
  <div class="mail-modal" id="mailModal" onclick="if(event.target===this)closeMail()">
    <div class="mail-inner">
      <div class="mail-head" id="mailHead">
        <h3 id="mailHeadTitle">邮箱</h3>
        <button class="mail-back" id="mailBack" style="display:none;" onclick="showMailList()">← 返回列表</button>
      </div>

      <div class="mail-list" id="mailListView">
        <div class="mail-empty">加载中...</div>
      </div>

      <div class="mail-detail" id="mailDetailView" style="display:none;"></div>

      <button class="mail-close" onclick="closeMail()">关闭</button>
    </div>
  </div>

  <!-- 退出登录确认弹窗 -->
  <div id="logoutModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); z-index:9999; justify-content:center; align-items:center; padding:16px;">
    <div style="background:#fffdf5; border-radius:16px; padding:24px; max-width:320px; width:100%; border:4px double #f0e0a0; text-align:center;">
      <h3 style="margin:0 0 14px 0; color:#8a6d1f; font-size:20px; font-weight:bold;">确认退出</h3>
      <div style="font-size:15px; color:#555; margin-bottom:20px;">确定要退出当前账号吗？</div>
      <div style="display:flex; gap:10px;">
        <button onclick="closeLogoutConfirm()" style="flex:1; padding:12px; border-radius:12px; font-size:16px; font-weight:bold; font-family:inherit; background:#fff; color:#666; border:1px solid #d8d0bc; cursor:pointer;">取消</button>
        <button onclick="window.location.href='/logout'" style="flex:1; padding:12px; border-radius:12px; font-size:16px; font-weight:bold; font-family:inherit; background:#fce8ec; color:#b85a6a; border:1px solid #e8c8d0; cursor:pointer;">退出</button>
      </div>
    </div>
  </div>
  
  <script>
    let mailCache = [];

    async function refreshMailBadge() {
      try {
        const res = await fetch('/mail/list');
        const data = await res.json();
        if (data.error) return;
        mailCache = data.mails || [];
        const badge = document.getElementById('mailBadge');
        if (data.unclaimed > 0) {
          badge.textContent = data.unclaimed;
          badge.classList.add('show');
        } else {
          badge.classList.remove('show');
        }
      } catch (e) { /* 静默 */ }
    }

    function showLogoutConfirm() {
      document.getElementById('logoutModal').style.display = 'flex';
    }
    function closeLogoutConfirm() {
      document.getElementById('logoutModal').style.display = 'none';
    }
    
    function openMail() {
      document.getElementById('mailModal').classList.add('active');
      showMailList();
      loadMailList();
    }
    function closeMail() {
      document.getElementById('mailModal').classList.remove('active');
    }

    function showMailList() {
      document.getElementById('mailHeadTitle').textContent = '邮箱';
      document.getElementById('mailBack').style.display = 'none';
      document.getElementById('mailListView').style.display = 'block';
      document.getElementById('mailDetailView').style.display = 'none';
    }

    async function loadMailList() {
      const listEl = document.getElementById('mailListView');
      listEl.innerHTML = '<div class="mail-empty">加载中...</div>';
      const res = await fetch('/mail/list');
      const data = await res.json();
      if (data.error) {
        listEl.innerHTML = '<div class="mail-empty">加载失败</div>';
        return;
      }
      mailCache = data.mails || [];
      if (mailCache.length === 0) {
        listEl.innerHTML = '<div class="mail-empty">暂无邮件</div>';
        return;
      }
      listEl.innerHTML = '';
      mailCache.forEach(m => {
        const item = document.createElement('div');
        item.className = 'mail-item';
        let flag = '';
        if (m.gold > 0) {
          flag = m.is_claimed
            ? '<span class="flag flag-claimed">已领</span>'
            : '<span class="flag flag-unclaimed">可领</span>';
        }
        item.innerHTML = `
          <span class="title">${m.title}${flag}</span>
          <span class="time">${m.created_at}</span>
        `;
        item.onclick = () => openMailDetail(m.id);
        listEl.appendChild(item);
      });
    }

    async function openMailDetail(mid) {
      const m = mailCache.find(x => x.id === mid);
      if (!m) return;
      document.getElementById('mailHeadTitle').textContent = '邮件详情';
      document.getElementById('mailBack').style.display = 'inline-block';
      document.getElementById('mailListView').style.display = 'none';
      const detailEl = document.getElementById('mailDetailView');
      detailEl.style.display = 'block';

      let claimHtml = '';
      if (m.gold > 0) {
        if (m.is_claimed) {
          claimHtml = `<button class="mail-claim" disabled>已领取</button>`;
        } else {
          claimHtml = `<button class="mail-claim" onclick="claimMail(${m.id})">领取 ${m.gold} 金币</button>`;
        }
      }
      detailEl.innerHTML = `
        <h4>${m.title}</h4>
        <div class="detail-time">${m.created_at}</div>
        <div class="detail-body">${m.content || '（无正文）'}</div>
        ${claimHtml}
      `;

      // 标记已读
      if (!m.is_read) {
        fetch('/mail/read/' + mid, { method: 'POST' }).catch(() => {});
        m.is_read = true;
      }
    }

    async function claimMail(mid) {
      const res = await fetch('/mail/claim/' + mid, { method: 'POST' });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      alert('领取成功，获得 ' + data.gold + ' 金币');
      await refreshMailBadge();
      await loadMailList();
      openMailDetail(mid);
    }

    // 页面加载时拉一次红点
    refreshMailBadge();
  </script>
</body>
</html>
