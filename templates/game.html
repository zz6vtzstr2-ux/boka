<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡游戏</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
           background: #ffffff; color: #333; max-width: 700px; margin: 0 auto; padding: 16px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .top img { width: 56px; height: 56px; border-radius: 8px; background: #eee; }
    .info { display: flex; flex-direction: column; gap: 4px; }
    .stats { display: flex; gap: 12px; font-size: 14px; color: #555; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .row a, .row button { padding: 8px 14px; border-radius: 8px; border: none;
                          background: #4a90d9; color: white; text-decoration: none;
                          font-size: 14px; cursor: pointer; }
    .row .white { background: #f0f0f0; color: #4a90d9; }
  </style>
</head>
<body>
  <div class="top">
    <img src="/static/avatars/{{ username }}.jpg" alt="">
    <div class="info">
      <div style="font-size:16px;">{{ nickname }}</div>
      <div class="stats">
        <span>积分：{{ score }}</span>
        <span>金币：{{ gold }}</span>
      </div>
    </div>
  </div>

  <div class="row">
    <a href="/profile" class="white">我的资料</a>
    <a href="/logout" class="white">退出登录</a>
  </div>

  <div class="row">
    <a href="/buildings">家园</a>
    <a href="/draw">抽卡</a>
    <a href="/data">数据</a>
    <a href="/collection">收藏</a>
  </div>

  <div class="row">
    <a href="/boka">搏卡</a>
    <a href="/challenge">个人挑战</a>
    <a href="/world_boss">世界 Boss</a>
  </div>
</body>
</html>
