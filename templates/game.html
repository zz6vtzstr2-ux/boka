<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .user-bar { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .avatar { width: 48px; height: 48px; border-radius: 8px; background: #0f3460; }
    .money { display: flex; gap: 12px; font-size: 14px; }
    .money span { background: #16213e; padding: 4px 10px; border-radius: 6px; }
    .links { display: flex; gap: 8px; margin: 12px 0; }
    .links a, .actions a { display: inline-block; padding: 8px 14px; border-radius: 8px;
                           background: #4a90d9; color: white; text-decoration: none; font-size: 14px; }
    .actions { display: flex; gap: 8px; margin: 12px 0; }
    .actions a { background: #5b9bd5; }
    .refresh { background: #0f3460; color: #eee; border: none; padding: 8px 14px;
               border-radius: 8px; cursor: pointer; font-size: 14px; }
    .room-list { margin-top: 12px; }
    .room-card { background: #16213e; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .room-card .room-id { font-size: 16px; font-weight: bold; }
    .room-card .tags { margin: 6px 0; font-size: 13px; color: #aaa; }
    .room-card .tags span { margin-right: 10px; }
    .room-card .players { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .room-card .player { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .room-card .player img { width: 24px; height: 24px; border-radius: 4px; }
    .logout { color: #888; text-decoration: underline; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h2>欢迎来到搏卡游戏</h2>
    <a href="/logout" class="logout">退出登录</a>
  </header>

  <div class="user-bar">
    <img class="avatar" src="/static/avatars/{{ username }}.jpg" alt="">
    <div>
      <div>{{ username }}</div>
      <div class="money">
        <span>🪙 {{ gold }}</span>
        <span>🥈 {{ silver }}</span>
        <span>🥉 {{ copper }}</span>
      </div>
    </div>
  </div>

  <div class="links">
    <a href="/data">数据</a>
    <a href="/collection">个人收藏册</a>
    <a href="/class_collection">班级收藏册</a>
  </div>

  <div class="actions">
    <a href="/boka">创建搏卡房间</a>
    <a href="/challenge">个人挑战</a>
    <a href="/world_boss">世界Boss</a>
  </div>

  <h3>当前搏卡房间</h3>
  <button class="refresh" onclick="refreshRooms()">刷新</button>
  <div class="room-list" id="roomList"></div>

  <script>
    async function refreshRooms() {
      const res = await fetch('/boka/rooms');
      const data = await res.json();
      const list = document.getElementById('roomList');
      list.innerHTML = '';
      data.rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-card';
        div.innerHTML = `
          <div class="room-id">房间号 ${r.room_id}</div>
          <div class="tags">
            <span>${r.status}</span>
            <span>${r.count} 人</span>
            <span>房主：${r.owner}</span>
          </div>
          <div class="players">
            ${r.players.map(p => `<div class="player"><img src="${p.avatar}">${p.name}${p.is_owner ? '（房主）' : ''}</div>`).join('')}
          </div>
          <button class="refresh" onclick="joinRoom('${r.room_id}')">${r.joined ? '返回房间' : '加入房间'}</button>
        `;
        list.appendChild(div);
      });
    }

    function joinRoom(roomId) {
      window.location.href = '/boka/room/' + roomId;
    }

    refreshRooms();
  </script>
</body>
</html>
