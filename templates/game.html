<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .top img { width: 48px; height: 48px; border-radius: 8px; background: #0f3460; }
    .money { display: flex; gap: 8px; font-size: 13px; }
    .money span { background: #16213e; padding: 4px 8px; border-radius: 6px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .row a, .row button { padding: 8px 14px; border-radius: 8px; border: none;
                          background: #4a90d9; color: white; text-decoration: none;
                          font-size: 14px; cursor: pointer; }
    .row .white { background: white; color: #4a90d9; }
    .room-card { background: #16213e; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .room-card .room-id { font-size: 16px; font-weight: bold; }
    .room-card .tags { margin: 6px 0; font-size: 13px; color: #aaa; }
    .room-card .tags span { margin-right: 10px; }
    .room-card .players { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .room-card .player { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .room-card .player img { width: 24px; height: 24px; border-radius: 4px; }
    @media (min-width: 768px) {
      .row-mobile-split { display: flex; gap: 8px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="top">
    <img src="/static/avatars/{{ username }}.jpg" alt="">
    <div class="money">
      <span>🪙 {{ gold }}</span>
      <span>🥈 {{ silver }}</span>
      <span>🥉 {{ copper }}</span>
    </div>
  </div>

  <div class="row">
    <a href="/profile" class="white">我的资料</a>
    <a href="/logout" class="white">退出登录</a>
  </div>

  <div class="row">
    <a href="/">房间</a>
    <a href="/data">数据</a>
    <a href="/draw">抽卡</a>
    <a href="/buildings">家园</a>
  </div>

  <div class="row">
    <a href="/collection">个人收藏册</a>
    <a href="/class_collection">班级收藏册</a>
  </div>

  <div class="row">
    <a href="/boka">创建搏卡房间</a>
    <a href="/challenge">个人挑战</a>
    <a href="/world_boss">世界 Boss</a>
  </div>

  <h3>当前搏卡房间</h3>
  <button class="white" onclick="refreshRooms()">刷新</button>
  <div class="room-list" id="roomList"></div>

  <script>
    async function refreshRooms() {
      const res = await fetch('/boka/rooms');
      const data = await res.json();
      const list = document.getElementById('roomList');
      list.innerHTML = '';
      data.rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-card';
        div.innerHTML = `
          <div class="room-id">房间号 ${r.room_id}</div>
          <div class="tags">
            <span>${r.status}</span>
            <span>${r.count} 人</span>
            <span>房主：${r.owner}</span>
          </div>
          <div class="players">
            ${r.players.map(p => `<div class="player"><img src="${p.avatar}">${p.name}${p.is_owner ? '（房主）' : ''}</div>`).join('')}
          </div>
          <button class="white" onclick="joinRoom('${r.room_id}')">${r.joined ? '返回房间' : '加入房间'}</button>
        `;
        list.appendChild(div);
      });
    }

    function joinRoom(roomId) {
      window.location.href = '/boka/room/' + roomId;
    }

    refreshRooms();
  </script>
</body>
</html>
