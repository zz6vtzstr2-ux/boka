<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡游戏</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      top: 0;
      bottom: 0;
      width: calc((100% - 868px) / 2);
      background: #f7f5ee;
      z-index: 1;
    }
    body::before { left: 0; }
    body::after { right: 0; }

    .bg-image {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 868px;
      max-width: 100%;
      height: 100vh;
      background-image: url('/static/images/主页背景.jpg');
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .top-box {
      position: absolute;
      top: 61.8vh;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 32px);
      max-width: 868px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      z-index: 2;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e8e0cc;
    }
    .title-block h1 {
      font-size: 34px;
      margin: 0;
      color: #2c3e50;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .title-block .en {
      font-size: 13px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .user-block {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-block .user-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .user-block .user-link:hover { opacity: 0.8; }
    .user-block img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      border: 2px solid #d8d0bc;
      background: #fff;
    }
    .user-block .nickname {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }
    .capsule {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      background: #e8f0ec;
      color: #000;
      border: 1px solid #c8d8d0;
    }
    .capsule-money {
      gap: 12px;
    }
    .money-item {
      display: flex;
      align-items: center;
      gap: 3px;
      color: #000;
    }
    .coin {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
    .coin-gold { background: #f5d76e; border: 2px solid #d4a86b; }
    .coin-silver { background: #d8d8d8; border: 2px solid #a8a8a8; }
    .coin-copper { background: #d89b6e; border: 2px solid #b87b4a; }
    .link-btn {
      background: #fce8ec;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #e8c8d0;
      font-size: 15px;
      color: #b85a6a;
      text-decoration: none;
    }
    .link-btn:hover { background: #f8d8de; }
    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      background: #5bb8e8;
      border: 1px solid #4aa8d8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3);
      transition: transform 0.15s;
      min-width: 90px;
    }
    .nav a:hover { transform: translateY(-2px); background: #4aa8d8; }
    .nav a .en {
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      font-weight: normal;
      letter-spacing: 1px;
      margin-top: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="top-box">
    <div class="header">
      <div class="title-block">
        <h1>欢迎搏卡青年</h1>
        <div class="en">Welcome Boka Juniors</div>
      </div>
      <div class="user-block">
        <a href="/profile" class="user-link">
          <img src="/static/avatars/{{ username }}.jpg" alt="">
          <span class="nickname">{{ nickname }}</span>
        </a>
        <span class="capsule capsule-score">⚔️ {{ score }}</span>
        <span class="capsule capsule-money">
          <span class="money-item">{{ gold }}<span class="coin coin-gold"></span></span>
          <span class="money-item">{{ silver }}<span class="coin coin-silver"></span></span>
          <span class="money-item">{{ copper }}<span class="coin coin-copper"></span></span>
        </span>
        <a href="/logout" class="link-btn">退出登录</a>
      </div>
    </div>

    <div class="nav">
      <a href="/buildings">家园<span class="en">Home</span></a>
      <a href="/draw">抽卡<span class="en">Draw</span></a>
      <a href="/collection">收藏<span class="en">Cards</span></a>
      <a href="/boka">搏卡<span class="en">Boka</span></a>
      <a href="/challenge">个人挑战<span class="en">Challenge</span></a>
      <a href="/world_boss">世界Boss<span class="en">World Boss</span></a>
      <a href="/data">数据<span class="en">Stats</span></a>
    </div>
  </div>
</body>
</html>
