<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 16px 16px 40px 16px;
      min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .title-block .page-name {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 4px;
      text-indent: 4px;
    }
    .title-block .en {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .back-btn, .reset-btn {
      background: #fce8ec;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #e8c8d0;
      font-size: 15px;
      color: #b85a6a;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .back-btn:hover, .reset-btn:hover { background: #f8d8de; }
    .reset-btn { background: #f0f0f0; color: #666; border-color: #ddd; }
    .reset-btn:hover { background: #e0e0e0; }

    .panel {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .panel-title {
      display: inline-block;
      background: #fdf6d8;
      color: #8a6d1f;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #f0e0a0;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      text-indent: 3px;
    }
    .table-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .user-block {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid #e8e0cc;
    }
    .user-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      padding: 6px 10px;
      border-radius: 12px;
    }
    .user-link:hover { background: #f9f5e8; }
    .user-link img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 2px solid #d8d0bc;
      background: #fff;
    }
    .user-link .nickname {
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 1px;
    }
    .stats { display: flex; gap: 12px; }
    .stat-box {
      flex: 1;
      background: #f9f5e8;
      border: 1px solid #e0d8c0;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .stat-box .label {
      font-size: 13px; color: #888; margin-bottom: 6px; letter-spacing: 2px;
    }
    .stat-box .value {
      font-size: 24px; font-weight: bold; color: #b85a6a; letter-spacing: 1px;
    }

    /* ===== 卡桌 ===== */
    .table-card {
      background: transparent;
      border: none;
      padding: 0;
    }
    .table-status {
      font-size: 14px;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .table-status.waiting {
      background: #fdf6d8;
      color: #8a6d1f;
      border: 1px solid #f0e0a0;
    }
    .table-status.playing {
      background: #e8f0ec;
      color: #2c6e5a;
      border: 1px solid #c8d8d0;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn {
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 2px;
      transition: background 0.15s, transform 0.15s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled {
      background: #d8d8d8 !important;
      color: #fff !important;
      cursor: not-allowed;
      transform: none;
    }
    .btn-play { background: #5bb8e8; color: #fff; flex: 1; }
    .btn-play:hover:not(:disabled) { background: #4aa8d8; }
    .btn-ready { background: #5cb85c; color: #fff; flex: 1; }
    .btn-ready:hover:not(:disabled) { background: #4ea84e; }
    .btn-ready-cancel { background: #e8e0d8; color: #666; flex: 1; }
    .btn-ready-cancel:hover:not(:disabled) { background: #d8d0c8; }
    .btn-leave { background: #fce8ec; color: #b85a6a; border: 1px solid #e8c8d0; flex: 0 0 auto; }
    .btn-leave:hover:not(:disabled) { background: #f8d8de; }

    .btn-add-ai {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px dashed #b8a878;
      border-radius: 10px;
      background: #fdf6d8;
      color: #8a6d1f;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.15s;
    }
    .btn-add-ai:hover:not(:disabled) { background: #f8ecc8; }
    .btn-add-ai:disabled {
      background: #eee;
      color: #aaa;
      border-color: #ccc;
      cursor: not-allowed;
    }

    .btn-start {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5bb8e8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 4px;
      text-indent: 4px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .btn-start:hover:not(:disabled) { background: #4aa8d8; }
    .btn-start:disabled {
      background: #d8d8d8 !important;
      color: #fff !important;
      cursor: not-allowed;
    }

    .player-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #fdf6d8;
      border: 1px solid #f0e0a0;
      border-radius: 10px;
      margin-top: 6px;
    }
    .player-line img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 2px solid #d8d0bc;
      flex-shrink: 0;
      object-fit: cover;
      background: #fff;
    }
    .player-line .nickname {
      font-size: 14px;
      font-weight: bold;
      color: #2c3e50;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-line .tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
      line-height: 1.4;
    }
    .tag.ready {
      background: #e8f5e8; color: #4ea84e; border: 1px solid #c8e0c8;
    }
    .tag.not-ready {
      background: #f0f0f0; color: #999; border: 1px solid #ddd;
    }
    .tag.hand {
      background: #e8f0ec; color: #2c6e5a; border: 1px solid #c8d8d0;
    }
    .tag.ai {
      background: #f0e8d0; color: #8a6d1f; border: 1px solid #f0e0a0;
    }
    .player-line .spacer { flex: 1; }
    .btn-watch {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: #f0e8d0;
      color: #8a6d1f;
      border: 1px solid #f0e0a0;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-watch:hover { background: #e8dcc0; }

    .empty-hint {
      color: #999; font-size: 14px; text-align: center; padding: 20px 0;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 40px;
      background: rgba(44,110,90,0.95);
      color: #fff;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="page-name">搏卡</div>
        <div class="en">Boka</div>
      </div>
      <div class="header-actions">
        <button class="reset-btn" onclick="resetTable()">重置卡桌</button>
        <a href="/" class="back-btn">返回主页</a>
      </div>
    </div>

    <div class="panel">
      <div class="user-block">
        <a href="/player_profile" class="user-link">
          <img src="/static/avatars/{{ current_user.username }}.jpg" alt="">
          <span class="nickname">{{ current_user.nickname or current_user.username }}</span>
        </a>
      </div>
      <div class="stats">
        <div class="stat-box">
          <div class="label">场次</div>
          <div class="value">{{ games }}</div>
        </div>
        <div class="stat-box">
          <div class="label">积分</div>
          <div class="value">{{ score }}</div>
        </div>
        <div class="stat-box">
          <div class="label">排名</div>
          <div class="value">{{ rank }}</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="table-header-row">
        <div class="panel-title">卡桌</div>
        <div class="table-status waiting" id="tableStatus">加载中</div>
      </div>
      <div class="table-card" id="tableCard">
        <div class="empty-hint">加载中...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const myUsername = "{{ current_user.username }}";
    let lastStateJson = '';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function resetTable() {
      if (!confirm('强制重置卡桌？会中断当前对局，且删除所有 AI。')) return;
      const res = await fetch('/boka/reset_table', { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      lastStateJson = '';
      refreshState();
      showToast('卡桌已重置');
    }

    async function joinTable() {
      const res = await fetch('/boka/join', { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      lastStateJson = '';
      refreshState();
    }

    async function leaveTable() {
      if (!confirm('确定离开卡桌？')) return;
      const res = await fetch('/boka/leave', { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      lastStateJson = '';
      refreshState();
    }

    async function toggleReady() {
      const res = await fetch('/boka/ready', { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      lastStateJson = '';
      refreshState();
    }

    async function addAi() {
      const res = await fetch('/boka/add_ai', { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      lastStateJson = '';
      refreshState();
    }

    async function startGame() {
      const res = await fetch('/boka/start', { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      window.location.href = '/boka/room/TABLE1/battle';
    }

    function watchGame(username) {
      showToast('观战功能开发中');
    }

    function renderTable(state) {
      const card = document.getElementById('tableCard');
      const isPlaying = state.is_playing;
      const myInTable = state.my_in_table;
      const canJoin = state.can_join;
      const players = state.players || [];
      const me = players.find(p => p.username === myUsername);

      // 更新状态栏
      const statusText = isPlaying ? '搏卡中' : '准备中';
      const statusEl = document.getElementById('tableStatus');
      if (statusEl) {
        statusEl.textContent = statusText;
        statusEl.className = isPlaying ? 'table-status playing' : 'table-status waiting';
      }

      let html = '';

      // 第二行：来一局 / 准备 / 离开
      const canPlay = !myInTable && !isPlaying && canJoin;
      const playBtnCls = canPlay ? 'btn-play' : '';
      const playDisabled = canPlay ? '' : 'disabled';

      const canReady = myInTable && !isPlaying;
      const readyDisabled = canReady ? '' : 'disabled';
      const readyCls = (me && me.ready) ? 'btn-ready-cancel' : 'btn-ready';
      const readyText = (me && me.ready) ? '取消准备' : '准备';

      const canLeave = myInTable;
      const leaveDisabled = canLeave ? '' : 'disabled';

      html += `
        <div class="btn-row">
          <button class="btn ${playBtnCls}" ${playDisabled} onclick="joinTable()">来一局</button>
          <button class="btn ${readyCls}" ${readyDisabled} onclick="toggleReady()">${readyText}</button>
          <button class="btn btn-leave" ${leaveDisabled} onclick="leaveTable()">离开</button>
        </div>
      `;

      // 添加 AI 按钮（未搏卡中 + 卡池够）
      const canAddAi = !isPlaying && canJoin;
      html += `<button class="btn-add-ai" ${canAddAi ? '' : 'disabled'} onclick="addAi()">+ 添加 AI</button>`;

      // 开始！
      if (!isPlaying) {
        const allReady = players.length >= 2 && players.every(p => p.ready);
        const poolOk = (state.pool_capacity || 0) >= players.length * 3;
        const canStart = allReady && poolOk && players.length >= 2;
        html += `<button class="btn-start" ${canStart ? '' : 'disabled'} onclick="startGame()">开始！</button>`;
      }

      // 玩家列表
      if (players.length === 0) {
        html += `<div class="empty-hint">暂无玩家</div>`;
      } else {
        players.forEach(p => {
          const isMe = p.username === myUsername;
          let tagHtml;
          if (isPlaying) {
            tagHtml = `<span class="tag hand">搏卡中</span>`;
          } else {
            tagHtml = p.ready
              ? `<span class="tag ready">已准备</span>`
              : `<span class="tag not-ready">未准备</span>`;
          }
          const aiTag = p.is_ai ? `<span class="tag ai">AI</span>` : '';

          let watchHtml = '<span class="spacer"></span>';
          if (isPlaying && !isMe) {
            const myHand = me ? (me.hand_count < 0 ? 0 : me.hand_count) : 0;
            const iCanWatch = !myInTable || myHand === 0;
            if (iCanWatch) {
              watchHtml += `<button class="btn-watch" onclick="watchGame('${esc(p.username)}')">观战</button>`;
            }
          }

          html += `
            <div class="player-line">
              <img src="${esc(p.avatar)}" alt="">
              <span class="nickname">${esc(p.nickname)}${isMe ? '（我）' : ''}</span>
              ${aiTag}
              ${tagHtml}
              ${watchHtml}
            </div>
          `;
        });
      }

      card.innerHTML = html;
    }

    async function refreshState() {
      const res = await fetch('/boka/table_state');
      const data = await res.json();
      if (data.error) return;

      const cmp = JSON.stringify({
        status: data.status,
        is_playing: data.is_playing,
        players: data.players,
        ready_count: data.ready_count,
        count: data.count,
        my_in_table: data.my_in_table,
        pool_capacity: data.pool_capacity,
        can_join: data.can_join,
      });
      if (cmp === lastStateJson) return;
      lastStateJson = cmp;

      renderTable(data);

      if (data.is_playing && data.my_in_table) {
        window.location.href = '/boka/room/TABLE1/battle';
      }
    }

    refreshState();
    setInterval(refreshState, 2500);
  </script>
</body>
</html>
