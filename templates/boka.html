<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡 · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back { color: #888; text-decoration: none; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .btn-create { background: #4a90d9; color: white; }
    .btn-create:disabled { background: #444; color: #888; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h2>搏卡</h2>
    <a href="/" class="back">返回主页</a>
  </header>

  <p>搏卡使用班级收藏卡池，2-14 人实时对战。</p>
  <button class="btn btn-create" id="createBtn" onclick="createRoom()">创建搏卡房间</button>
  <div id="room"></div>

  <script>
    async function createRoom() {
      const res = await fetch('/boka/create', {method: 'POST'});
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      window.location.href = '/boka/room/' + data.room_id;
    }
  </script>
</body>
</html>
