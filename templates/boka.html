<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc; color: #333; margin: 0; padding: 16px 16px 90px 16px; min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    /* 顶部、卡片、数据等基础样式 */
    .header, .panel { background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px; padding: 16px 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .title-block .page-name { font-size: 28px; font-weight: bold; color: #2c3e50; letter-spacing: 4px; text-indent: 4px; }
    .title-block .en { font-size: 12px; color: #999; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
    .back-btn { background: #fce8ec; padding: 10px 20px; border-radius: 8px; border: 1px solid #e8c8d0; font-size: 15px; color: #b85a6a; text-decoration: none; white-space: nowrap; }
    
    .panel-title { display: inline-block; background: #fdf6d8; color: #8a6d1f; padding: 8px 20px; border-radius: 20px; border: 1px solid #f0e0a0; font-size: 18px; font-weight: bold; letter-spacing: 3px; margin-bottom: 16px; }
    
    .user-block { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e8e0cc; }
    .user-link { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .user-link .nickname { font-size: 22px; font-weight: bold; color: #2c3e50; letter-spacing: 1px; }
    .avatar-fallback { width: 64px; height: 64px; border-radius: 12px; border: 2px solid #d8d0bc; background: #d8d0bc; overflow: hidden; flex-shrink: 0; }
    .avatar-fallback img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-fallback.small { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #d8d0bc; }

    .stats-row { display: flex; gap: 12px; }
    .stat-box { flex: 1; background: #f9f5e8; border: 1px solid #e0d8c0; border-radius: 12px; padding: 12px; text-align: center; }
    .stat-box .lbl { font-size: 13px; color: #888; margin-bottom: 4px; }
    .stat-box .val { font-size: 22px; font-weight: bold; color: #b85a6a; }

    .btn-main { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; letter-spacing: 3px; cursor: pointer; font-family: inherit; transition: 0.15s; }
    .btn-blue { background: #5bb8e8; color: #fff; box-shadow: 0 2px 6px rgba(91,184,232,0.3); }
    .btn-blue:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    .btn-blue:disabled { background: #ccc !important; color: #fff !important; cursor: not-allowed; }

    /* 房间列表 */
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .list-header .panel-title { margin-bottom: 0; }
    .refresh-btn { background: transparent; border: none; color: #8a6d1f; font-size: 14px; font-weight: bold; cursor: pointer; padding: 6px 12px; border-radius: 8px; }
    .rooms-empty { text-align: center; color: #bbb; font-size: 15px; padding: 40px 8px; }

    .room-item { display: flex; flex-direction: column; padding: 16px; border: 1px solid #e0d8c0; border-radius: 16px; background: #fdfaf0; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #e8e0cc; }
    .room-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
    .room-code { font-family: monospace; font-size: 20px; font-weight: bold; color: #8a6d1f; letter-spacing: 2px; white-space: nowrap; }
    
    .room-status-tag { display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
    .status-waiting { color: #8a6d1f; background: #fdf6d8; border: 1px solid #f0e0a0; }
    .status-playing { color: #b85a6a; background: #fce8ec; border: 1px solid #e8c8d0; }

    /* 右侧操作区容器 */
    .room-actions { display: flex; gap: 8px; align-items: center; }
    
    /* 统一按钮基础 */
    .room-btn { border: none; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: bold; font-family: inherit; cursor: pointer; transition: transform 0.15s, background 0.15s; white-space: nowrap; }
    
    /* 绿色：加入房间 */
    .room-btn.btn-green { background: #5cb85c; color: #fff; box-shadow: 0 2px 6px rgba(92,184,92,0.3); }
    .room-btn.btn-green:hover { transform: translateY(-2px); background: #4ea84e; }
    
    /* 蓝色：返回房间/卡桌 */
    .room-btn.btn-blue { background: #5bb8e8; color: #fff; box-shadow: 0 2px 6px rgba(91,184,232,0.3); }
    .room-btn.btn-blue:hover { transform: translateY(-2px); background: #4aa8d8; }
    
    /* 橙色：观战 */
    .room-btn.btn-orange { background: #f5a623; color: #fff; box-shadow: 0 2px 6px rgba(245,166,35,0.3); }
    .room-btn.btn-orange:hover { transform: translateY(-2px); background: #e09820; }
    
    /* 灰色：不可点 */
    .room-btn.disabled { background: #e0e0e0 !important; color: #aaa !important; border: 1px solid #ccc !important; box-shadow: none !important; cursor: not-allowed; transform: none !important; }

    .room-players { display: flex; flex-direction: column; gap: 10px; }
    .room-player-row { display: flex; align-items: center; gap: 12px; }
    .player-info-text { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #2c3e50; }
    .player-info-text .me-tag { color: #b85a6a; font-size: 12px; font-weight: normal; }
    .owner-tag { color: #d89050; background: #fdf0e0; border: 1px solid #f0d0b0; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: bold; }

    /* Toast */
    .toast { position: fixed; right: 20px; bottom: 100px; background: rgba(44,110,90,0.95); color: #fff; padding: 12px 22px; border-radius: 14px; font-size: 15px; font-weight: bold; opacity: 0; transform: translateY(20px); transition: 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 480px) { .room-code { font-size: 16px; } .room-btn { padding: 6px 12px; font-size: 13px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="page-name">搏卡</div>
        <div class="en">Boka</div>
      </div>
      <a href="/" class="back-btn">返回主页</a>
    </div>

    <div class="panel">
      <div class="user-block">
        <a href="/player_profile" class="user-link">
          <div class="avatar-fallback">
            <img src="/static/avatars/{{ current_user.username }}.jpg" onerror="this.remove()" alt="">
          </div>
          <span class="nickname">{{ current_user.nickname or current_user.username }}</span>
        </a>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="lbl">场次</div><div class="val">{{ season_games }}</div></div>
        <div class="stat-box"><div class="lbl">积分</div><div class="val">{{ score }}</div></div>
        <div class="stat-box"><div class="lbl">排名</div><div class="val">{{ rank }}</div></div>
      </div>
    </div>

    <button class="btn-main btn-blue" onclick="createRoom()" {% if not can_create %}disabled{% endif %}>创建房间</button>

    <div class="panel" style="margin-top: 16px;">
      <div class="list-header">
        <div class="panel-title">房间列表</div>
        <button class="refresh-btn" onclick="loadRooms(true)">刷新</button>
      </div>
      <div id="roomList"><div class="rooms-empty">加载中...</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CAN_CREATE = {{ 'true' if can_create else 'false' }};
    const myUsername = "{{ current_user.username }}";
    let roomPollTimer = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    async function createRoom() {
      if (!CAN_CREATE) { showToast('班级收藏不足，无法创建房间'); return; }
      try {
        const res = await fetch('/boka/create', { method: 'POST' });
        const data = await res.json();
        if (data.error) { showToast(data.error); return; }
        window.location.href = '/boka/room/' + data.room_id;
      } catch (e) { showToast('创建失败'); }
    }

    function joinRoomById(roomId) { window.location.href = '/boka/room/' + roomId; }
    function spectateRoomById(roomId) { window.location.href = '/boka/room/' + roomId + '/battle'; }

    async function loadRooms(manual) {
      try {
        const res = await fetch('/boka/rooms');
        const data = await res.json();
        renderRooms(data.rooms || []);
      } catch (e) {
        if (manual) showToast('刷新失败');
      }
    }

    function avatarHtml(username) {
      return `<div class="avatar-fallback small"><img src="/static/avatars/${username}.jpg" onerror="this.remove()" alt=""></div>`;
    }

    function renderRooms(rooms) {
      const el = document.getElementById('roomList');
      if (!rooms.length) {
        el.innerHTML = '<div class="rooms-empty">暂无房间，点上方按钮创建一个</div>';
        return;
      }
      el.innerHTML = '';
      
      rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-item';

        const isPlaying = r.status === "游戏中";
        const statusText = isPlaying ? "搏卡中" : "准备中";
        const statusCls = isPlaying ? "status-playing" : "status-waiting";

        // ★ 严格根据表格渲染按钮
        let actionsHtml = '';
        
        if (!r.joined) {
          // 我不在这个房间
          if (isPlaying) {
            // 不在房间+搏卡中 -> 灰色加入房间 + 可用观战
            actionsHtml = `
              <button class="room-btn disabled" disabled>加入房间</button>
              <button class="room-btn btn-orange" onclick="event.stopPropagation(); spectateRoomById('${r.room_id}')">观战</button>
            `;
          } else {
            // 不在房间+准备/未准备 -> 加入房间 + 观战可用
            actionsHtml = `
              <button class="room-btn btn-green" onclick="event.stopPropagation(); joinRoomById('${r.room_id}')">加入房间</button>
              <button class="room-btn btn-orange" onclick="event.stopPropagation(); spectateRoomById('${r.room_id}')">观战</button>
            `;
          }
        } else {
          // 我在这个房间
          if (isPlaying) {
            // 在房间+搏卡中 -> 返回卡桌 (观战不允许，因为我已经在里面)
            actionsHtml = `
              <button class="room-btn btn-blue" onclick="event.stopPropagation(); joinRoomById('${r.room_id}')">返回卡桌</button>
            `;
          } else {
            // 在房间+准备/未准备 -> 返回房间 (观战不允许)
            actionsHtml = `
              <button class="room-btn btn-blue" onclick="event.stopPropagation(); joinRoomById('${r.room_id}')">返回房间</button>
            `;
          }
        }

        let playersHtml = '';
        (r.players || []).forEach(p => {
          const isOwner = p.username === r.owner;
          const isMe = p.username === myUsername;
          playersHtml += `
            <div class="room-player-row">
              ${avatarHtml(p.username)}
              <div class="player-info-text">
                ${p.name}${isMe ? '<span class="me-tag">（我）</span>' : ''}${isOwner ? '<span class="owner-tag">房主</span>' : ''}
              </div>
            </div>
          `;
        });

        div.innerHTML = `
          <div class="room-header">
            <div class="room-header-left">
              <div class="room-code">${r.room_id}</div>
              <div class="room-status-tag ${statusCls}">${statusText}</div>
            </div>
            <div class="room-actions">${actionsHtml}</div>
          </div>
          <div class="room-players">${playersHtml}</div>
        `;
        el.appendChild(div);
      });
    }

    function startRoomPolling() {
      if (roomPollTimer) clearInterval(roomPollTimer);
      roomPollTimer = setInterval(() => loadRooms(false), 4000);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (roomPollTimer) clearInterval(roomPollTimer); }
      else { loadRooms(false); startRoomPolling(); }
    });

    loadRooms(false);
    startRoomPolling();
  </script>
</body>
</html>
