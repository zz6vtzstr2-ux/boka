<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博卡 · 小浣熊水浒卡</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back { color: #888; text-decoration: none; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .btn-create { background: #e94560; color: white; }
  </style>
</head>
<body>
  <header>
    <h2>博卡</h2>
    <a href="/" class="back">返回主页</a>
  </header>

  <p>博卡使用班级收藏卡池，2-14 人实时对战。</p>
  <button class="btn btn-create" onclick="createRoom()">创建房间</button>
  <div id="room"></div>

  <script>
    async function createRoom() {
      const res = await fetch('/boka/create', {method: 'POST'});
      const data = await res.json();
      document.getElementById('room').innerHTML = `<h3>房间号：${data.room_id}</h3>
        <p>把这个房间号发给朋友，等他们加入。</p>`;
    }
  </script>
</body>
</html>
