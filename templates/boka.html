<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡 · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 16px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .back-btn { background: white; color: #4a90d9; padding: 8px 14px;
                border-radius: 8px; text-decoration: none; font-size: 14px; }
    .stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .stats div { background: #16213e; border-radius: 8px; padding: 12px; flex: 1;
                 text-align: center; font-size: 14px; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer;
           background: #4a90d9; color: white; font-size: 16px; }
    .room-list { margin-top: 16px; }
    .room-card { background: #16213e; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .room-card .room-id { font-size: 16px; font-weight: bold; }
    .room-card .tags { margin: 6px 0; font-size: 13px; color: #aaa; }
    .room-card .tags span { margin-right: 10px; }
    .room-card .players { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .room-card .player { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .room-card .player img { width: 24px; height: 24px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="page-name">搏卡</span>
    <a href="/" class="back-btn">返回主页</a>
  </div>

  <div class="stats">
    <div>场次：{{ games }}</div>
    <div>积分：{{ score }}</div>
    <div>排名：{{ rank }}</div>
  </div>

  <button class="btn" onclick="createRoom()">创建房间</button>

  <div class="room-list" id="roomList"></div>

  <script>
    async function createRoom() {
      const res = await fetch('/boka/create', {method: 'POST'});
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      window.location.href = '/boka/room/' + data.room_id;
    }

    async function refreshRooms() {
      const res = await fetch('/boka/rooms');
      const data = await res.json();
      const list = document.getElementById('roomList');
      list.innerHTML = '';
      data.rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-card';
        div.innerHTML = `
          <div class="room-id">房间号 ${r.room_id}</div>
          <div class="tags">
            <span>${r.status}</span>
            <span>${r.count} 人</span>
            <span>房主：${r.owner}</span>
          </div>
          <div class="players">
            ${r.players.map(p => `<div class="player"><img src="${p.avatar}">${p.name}${p.is_owner ? '（房主）' : ''}</div>`).join('')}
          </div>
          <button class="btn" onclick="joinRoom('${r.room_id}')">${r.joined ? '返回房间' : '加入房间'}</button>
        `;
        list.appendChild(div);
      });
    }

    function joinRoom(roomId) {
      window.location.href = '/boka/room/' + roomId;
    }

    refreshRooms();
  </script>
</body>
</html>
