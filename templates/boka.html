<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc; color: #333; margin: 0; padding: 16px 16px 90px 16px; min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    /* ===== 顶部标题 ===== */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px;
      padding: 16px 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px;
    }
    .title-block .page-name { font-size: 28px; font-weight: bold; color: #2c3e50; letter-spacing: 4px; text-indent: 4px; }
    .title-block .en { font-size: 12px; color: #999; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
    .back-btn { background: #fce8ec; padding: 10px 20px; border-radius: 8px; border: 1px solid #e8c8d0; font-size: 15px; color: #b85a6a; text-decoration: none; white-space: nowrap; }
    .back-btn:hover { background: #f8d8de; }

    /* ===== 通用卡片 ===== */
    .panel { background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .panel-title { display: inline-block; background: #fdf6d8; color: #8a6d1f; padding: 8px 20px; border-radius: 20px; border: 1px solid #f0e0a0; font-size: 18px; font-weight: bold; letter-spacing: 3px; text-indent: 3px; margin-bottom: 16px; }

    /* ===== 玩家信息 ===== */
    .user-block { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e8e0cc; }
    .user-link { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; padding: 6px 10px; border-radius: 12px; }
    .user-link:hover { background: #f9f5e8; }
    .user-link .nickname { font-size: 22px; font-weight: bold; color: #2c3e50; letter-spacing: 1px; }
    .avatar-fallback { width: 64px; height: 64px; border-radius: 12px; border: 2px solid #d8d0bc; background: #d8d0bc; overflow: hidden; flex-shrink: 0; }
    .avatar-fallback img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-fallback.small { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #d8d0bc; flex-shrink: 0; }

    /* 文字区域对齐 */
    .player-info-text { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #2c3e50; min-width: 100px; }
    .player-info-text .me-tag { color: #b85a6a; font-size: 12px; font-weight: normal; }
    .owner-tag { color: #d89050; background: #fdf0e0; border: 1px solid #f0d0b0; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: bold; }

    /* ===== 赛季数据 ===== */
    .stats-row { display: flex; gap: 12px; }
    .stat-box { flex: 1; background: #f9f5e8; border: 1px solid #e0d8c0; border-radius: 12px; padding: 12px; text-align: center; }
    .stat-box .lbl { font-size: 13px; color: #888; margin-bottom: 4px; letter-spacing: 2px; }
    .stat-box .val { font-size: 22px; font-weight: bold; color: #b85a6a; }

    /* ===== 创建房间按钮 ===== */
    .btn-main { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; letter-spacing: 3px; text-indent: 3px; cursor: pointer; font-family: inherit; transition: transform 0.15s, background 0.15s; }
    .btn-blue { background: #5bb8e8; color: #fff; box-shadow: 0 2px 6px rgba(91,184,232,0.3); }
    .btn-blue:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    .btn-blue:disabled { background: #ccc !important; color: #fff !important; cursor: not-allowed; box-shadow: none; transform: none; }

    /* ===== 房间列表 ===== */
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .list-header .panel-title { margin-bottom: 0; }
    .refresh-btn { background: transparent; border: none; color: #8a6d1f; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; padding: 6px 12px; border-radius: 8px; letter-spacing: 1px; }
    .refresh-btn:hover { background: #fdf6d8; }
    .rooms-empty { text-align: center; color: #bbb; font-size: 15px; padding: 40px 8px; letter-spacing: 1px; }

    /* 房间卡片 */
    .room-item { display: flex; flex-direction: column; padding: 16px; border: 1px solid #e0d8c0; border-radius: 16px; background: #fdfaf0; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .room-item:last-child { margin-bottom: 0; }
    .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #e8e0cc; }
    .room-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
    .room-code { font-family: monospace; font-size: 20px; font-weight: bold; color: #8a6d1f; letter-spacing: 2px; white-space: nowrap; }

    /* 状态标签基础样式 */
    .room-status-tag { display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; padding: 0 10px; height: 24px; border-radius: 12px; white-space: nowrap; box-sizing: border-box; }
    .status-waiting { color: #8a6d1f; background: #fdf6d8; border: 1px solid #f0e0a0; }
    .status-playing { color: #b85a6a; background: #fce8ec; border: 1px solid #e8c8d0; }

    /* 操作区容器 */
    .room-actions { display: flex; gap: 8px; align-items: center; }
    .room-btn { border: none; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: bold; font-family: inherit; cursor: pointer; transition: transform 0.15s, background 0.15s; white-space: nowrap; }
    
    /* 主按钮颜色 */
    .room-btn.btn-green { background: #5cb85c; color: #fff; box-shadow: 0 2px 6px rgba(92,184,92,0.3); }
    .room-btn.btn-green:hover:not(:disabled) { transform: translateY(-2px); background: #4ea84e; }
    .room-btn.btn-blue { background: #5bb8e8; color: #fff; box-shadow: 0 2px 6px rgba(91,184,232,0.3); }
    .room-btn.btn-blue:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    
    /* ★ 绝对强制灰色，一刀切死所有蓝底灰字问题 */
    .room-btn:disabled, 
    .room-btn.disabled,
    .room-btn.btn-green:disabled,
    .room-btn.btn-blue:disabled { 
      background: #e0e0e0 !important; 
      color: #aaa !important; 
      border: 1px solid #ccc !important; 
      box-shadow: none !important; 
      cursor: not-allowed !important; 
      transform: none !important; 
    }

    /* 观战按钮颜色 */
    .spectate-btn { background: #f5a623; color: #fff; border: none; padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.15s; white-space: nowrap; }
    .spectate-btn:hover:not(:disabled) { background: #e09820; }
    .spectate-btn:disabled { background: #e0e0e0 !important; color: #aaa !important; cursor: not-allowed; }

    /* 玩家列表 */
    .room-players { display: flex; flex-direction: column; gap: 8px; }
    .room-player-row { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
    .room-player-left { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; padding: 4px 8px; margin-left: -8px; border-radius: 8px; transition: background 0.2s; }
    .room-player-left:hover { background: #f0e8d0; }

    /* Toast */
    .toast { position: fixed; right: 20px; bottom: 100px; background: rgba(44,110,90,0.95); color: #fff; padding: 12px 22px; border-radius: 14px; font-size: 15px; font-weight: bold; opacity: 0; transform: translateY(20px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 480px) {
      .title-block .page-name { font-size: 24px; letter-spacing: 3px; }
      .back-btn { padding: 8px 14px; font-size: 14px; }
      .user-link .nickname { font-size: 19px; }
      .stat-box .val { font-size: 20px; }
      .room-code { font-size: 16px; }
      .room-btn { padding: 6px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="page-name">搏卡</div>
        <div class="en">Boka</div>
      </div>
      <a href="/" class="back-btn">返回主页</a>
    </div>

    <div class="panel">
      <div class="user-block">
        <a href="/user/{{ current_user.username }}" class="user-link">
          <div class="avatar-fallback">
            <img src="/static/avatars/{{ current_user.username }}.jpg" onerror="this.remove()" alt="">
          </div>
          <span class="nickname">{{ current_user.nickname or current_user.username }}</span>
        </a>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="lbl">场次</div><div class="val">{{ season_games }}</div></div>
        <div class="stat-box"><div class="lbl">积分</div><div class="val">{{ score }}</div></div>
        <div class="stat-box"><div class="lbl">排名</div><div class="val">{{ rank }}</div></div>
      </div>
    </div>

    <button class="btn-main btn-blue" id="createRoomBtn" onclick="createRoom()">
      创建房间
    </button>

    <div class="panel" style="margin-top: 16px;">
      <div class="list-header">
        <div class="panel-title">房间列表</div>
        <button class="refresh-btn" onclick="loadRooms(true)">刷新</button>
      </div>
      <div id="roomList"><div class="rooms-empty">加载中...</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CAN_CREATE = {{ 'true' if can_create else 'false' }};
    const myUsername = "{{ current_user.username }}";
    let roomPollTimer = null;

    // 我当前的全局状态（每次拉取列表时更新）
    let myCurrentStatus = {
      roomId: null,
      isPlaying: false,
      isReady: false,
      isEliminated: false
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    async function createRoom() {
      if (!CAN_CREATE) { showToast('班级收藏不足 6 张，无法创建房间'); return; }
      
      // 规则1：准备中或搏卡中，不允许创建
      if (myCurrentStatus.isReady || myCurrentStatus.isPlaying) {
        showToast('请先退出当前房间（取消准备）再创建');
        return;
      }

      try {
        const res = await fetch('/boka/create', { method: 'POST' });
        const data = await res.json();
        if (data.error) { showToast(data.error); return; }
        window.location.href = '/boka/room/' + data.room_id;
      } catch (e) { showToast('创建失败'); }
    }

    function joinRoomById(roomId) { window.location.href = '/boka/room/' + roomId; }
    function spectateRoomById(roomId) { window.location.href = '/boka/room/' + roomId + '/battle'; }

    async function loadRooms(manual) {
      try {
        const res = await fetch('/boka/rooms');
        const data = await res.json();
        renderRooms(data.rooms || []);
      } catch (e) {
        if (manual) showToast('刷新失败');
      }
    }

    function avatarHtml(username) {
      return `<div class="avatar-fallback small"><img src="/static/avatars/${username}.jpg" onerror="this.remove()" alt=""></div>`;
    }

    function showProfile(username) {
      if (username.startsWith('ai_')) {
        showToast("这是电脑玩家，没有资料哦~");
        return;
      }
      document.getElementById('profileIframe').src = '/user/' + username;
      document.getElementById('profileModal').style.display = 'flex';
    }
    
    function renderRooms(rooms) {
      const el = document.getElementById('roomList');
      if (!rooms.length) {
        el.innerHTML = '<div class="rooms-empty">暂无房间，点上方按钮创建一个</div>';
        return;
      }
      el.innerHTML = '';

      // 找出我所在的房间和我自己的状态
      const myRoom = rooms.find(room => room.joined);
      myCurrentStatus.roomId = myRoom ? myRoom.room_id : null;
      
      if (myRoom) {
        const meInRoom = myRoom.players.find(p => p.username === myUsername);
        if (meInRoom) {
          myCurrentStatus.isPlaying = meInRoom.status === "搏卡中";
          myCurrentStatus.isReady = meInRoom.status === "已准备";
          myCurrentStatus.isEliminated = meInRoom.status === "已淘汰";
        }
      } else {
        myCurrentStatus.isPlaying = false;
        myCurrentStatus.isReady = false;
        myCurrentStatus.isEliminated = false;
      }

      // 处理顶部“创建房间”按钮
      const createBtn = document.getElementById('createRoomBtn');
      if (!CAN_CREATE || myCurrentStatus.isPlaying || myCurrentStatus.isReady) {
        createBtn.disabled = true;
      } else {
        createBtn.disabled = false;
      }

      rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-item';

        const isPlaying = r.status === "游戏中";
        const statusText = isPlaying ? "搏卡中" : "准备中";
        const statusCls = isPlaying ? "status-playing" : "status-waiting";

        // 1. 右上角主按钮逻辑
        let mainBtnText = "加入房间";
        let mainBtnCls = "room-btn btn-green"; 
        let mainBtnDisabled = false;

        if (r.joined) {
          if (isPlaying) {
            mainBtnText = "返回卡桌";
            mainBtnCls = "room-btn btn-green";
          } else {
            mainBtnText = "返回房间";
            mainBtnCls = "room-btn btn-green";
          }
        } else {
          if (isPlaying) {
            // 房间搏卡中，不能中途进
            mainBtnText = "加入房间";
            mainBtnCls = "room-btn"; 
            mainBtnDisabled = true;
          } else {
            // 房间准备中
            mainBtnText = "加入房间";
            if (myCurrentStatus.isPlaying || myCurrentStatus.isReady) {
              // 规则6：准备中/搏卡中，不允许进入其他房间
              mainBtnCls = "room-btn"; 
              mainBtnDisabled = true;
            } else {
              // 游离状态，可以加入（后端自动退旧房）
              mainBtnCls = "room-btn btn-blue";
              mainBtnDisabled = false;
            }
          }
        }

        const mainBtnHtml = `
          <button class="${mainBtnCls}" ${mainBtnDisabled ? 'disabled' : ''} 
                  onclick="event.stopPropagation(); if(${!mainBtnDisabled}) joinRoomById('${r.room_id}')">
            ${mainBtnText}
          </button>
        `;

        // 2. 玩家列表与右侧专属观战按钮
        let playersHtml = '';
        (r.players || []).forEach(p => {
          const isOwner = p.username === r.owner;
          const isMe = p.username === myUsername;
          const isAI = p.username.startsWith('ai_');
          
          // 规则4：观战按钮（按玩家级 status 判定）
          let spectateHtml = '';
          if (!isMe) {
            // 我是否“在局里”（搏卡中或已淘汰）→ 在局里就不能再观战别人
            const iAmInGame = (myCurrentStatus.isPlaying || myCurrentStatus.isEliminated);
            // 对方是否真的在局里（搏卡中或已淘汰）→ 中途进的“已准备/未准备”没有观战意义
            const targetInGame = (p.status === "搏卡中" || p.status === "已淘汰");

            const canSpectate = targetInGame && !iAmInGame;

            spectateHtml = `
              <button class="spectate-btn" ${canSpectate ? '' : 'disabled'} 
                      onclick="event.stopPropagation(); if(${canSpectate}) spectateRoomById('${r.room_id}')">
                观战
              </button>
            `;
          }

          let playerLeftHtml = `
            <div class="room-player-left">
              ${avatarHtml(p.username)}
              <div class="player-info-text">
                ${p.name}${isMe ? '<span class="me-tag">（我）</span>' : ''}${isOwner ? '<span class="owner-tag">房主</span>' : ''}
              </div>
            </div>
          `;

          if (!isAI) {
              playerLeftHtml = `
                <div class="room-player-left" style="cursor: pointer;" onclick="event.stopPropagation(); showProfile('${p.username}')">
                  ${avatarHtml(p.username)}
                  <div class="player-info-text">
                    ${p.name}${isMe ? '<span class="me-tag">（我）</span>' : ''}${isOwner ? '<span class="owner-tag">房主</span>' : ''}
                  </div>
                </div>
              `;
          }

          playersHtml += `
            <div class="room-player-row">
              ${playerLeftHtml}
              ${spectateHtml}
            </div>
          `;
        });

        div.innerHTML = `
          <div class="room-header">
            <div class="room-header-left">
              <div class="room-code">${r.room_id}</div>
              <div class="room-status-tag ${statusCls}">${statusText}</div>
            </div>
            <div class="room-actions">${mainBtnHtml}</div>
          </div>
          <div class="room-players">
            ${playersHtml}
          </div>
        `;
        el.appendChild(div);
      });
    }

    function startRoomPolling() {
      if (roomPollTimer) clearInterval(roomPollTimer);
      roomPollTimer = setInterval(() => loadRooms(false), 4000);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (roomPollTimer) clearInterval(roomPollTimer); }
      else { loadRooms(false); startRoomPolling(); }
    });

    loadRooms(false);
    startRoomPolling();
  </script>

  <!-- 玩家资料弹窗 -->
  <div id="profileModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#e8e0cc; width:95%; max-width:500px; height:85vh; border-radius:20px; border:4px double #f0e0a0; position:relative; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.5); display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fffdf5; border-bottom:1px solid #d8d0bc; z-index:10;">
        <h3 style="margin:0; color:#8a6d1f; font-size:22px;">玩家资料</h3>
        <button onclick="document.getElementById('profileModal').style.display='none'" style="background:#fce8ec; color:#b85a6a; border:1px solid #e8c8d0; padding:8px 24px; border-radius:8px; font-size:16px; font-weight:bold; font-family:inherit; cursor:pointer; transition: 0.2s;" onmouseover="this.style.background='#f8d8de'" onmouseout="this.style.background='#fce8ec'">关闭</button>
      </div>
      <iframe id="profileIframe" src="" style="flex:1; width:100%; border:none; background:#e8e0cc;"></iframe>
    </div>
  </div>
</body>
</html>
