<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>搏卡对战 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; min-height: 100vh;
      user-select: none; -webkit-tap-highlight-color: transparent;
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: radial-gradient(ellipse at center, #f5edda 0%, #d8ccb0 100%) fixed;
      color: #333;
    }

    /* 顶部状态栏 */
    .top-bar {
      position: sticky; top: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: rgba(245,237,218,0.92);
      backdrop-filter: blur(6px); z-index: 100;
    }
    .top-btn, .top-info {
      background: rgba(255,255,255,0.95); border: 1px solid #d8d0bc;
      border-radius: 8px; padding: 6px 12px; font-size: 13px;
      font-weight: bold; color: #4a4a4a; font-family: inherit;
    }
    .top-info { color: #8a6d1f; }
    .top-btn.danger { background: #fce8ec; color: #b85a6a; }
    .top-btn:disabled {
      background: #e8e8e8 !important;
      color: #aaa !important;
      cursor: not-allowed;
      box-shadow: none;
    }
    /* 中心横幅 */
    .center-banner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 20px; font-weight: bold; color: #fff;
      letter-spacing: 4px; padding: 8px 24px; border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25); z-index: 10;
    }
    .center-banner.atk { background: radial-gradient(circle, #f5b76e, #c1783b); border: 2px solid #8a4a1f; }
    .center-banner.def { background: radial-gradient(circle, #8bc0e8, #4a7db8); border: 2px solid #2a4a7a; }

    /* 动态牌桌区 */
    .arena {
      position: relative; width: 100%; height: calc(100vh - 200px);
      overflow: hidden; /* 电脑端防溢出 */
    }

    /* 单个玩家的座位容器 */
    .player-seat {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      transition: all 0.3s;
    }
    .player-info-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.9); border-radius: 10px;
      padding: 4px 10px; border: 1px solid #d8d0bc; margin-bottom: 8px;
    }
    .player-info-row img { width: 32px; height: 32px; border-radius: 6px; }
    .player-name { font-size: 13px; font-weight: bold; }
    .hand-count { font-size: 11px; color: #888; }

    /* 每人出牌区固定宽度（电脑端 200px，手机端 300px） */
    .played-area {
      display: flex; justify-content: center; align-items: center;
      height: 140px; width: 200px; /* 默认电脑端 */
      position: relative;
    }

    /* 手机端覆盖列表流布局 */
    @media (max-width: 768px) {
      .arena {
        height: auto; overflow: visible; display: flex; flex-direction: column;
        padding-bottom: 200px; /* 留出底部手牌空间 */
      }
      .player-seat {
        position: relative !important;
        left: auto !important; top: auto !important;
        width: 100%; flex-direction: row; justify-content: flex-start;
        padding: 10px 16px; border-bottom: 1px dashed #d8d0bc;
      }
      .player-seat.is-me { display: none; } /* 手机端自己不在此列表 */
      .player-info-row { flex-direction: column; padding: 4px; width: 70px; margin-bottom: 0; }
      .played-area { width: 300px; height: 140px; } /* 手机端放宽 */
    }

    /* ===== 卡牌样式（复用挑战页） ===== */
    .hero-card {
      position: relative; width: 100px; height: 140px; flex-shrink: 0;
      transition: margin 0.3s;
    }
    .hero-card .oval-wrap {
      width: 100%; height: calc(100% - 22px); border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      overflow: hidden; background: #fffdf5; border: 4px solid #f0e0a0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2); position: relative;
    }
    .hero-card .oval-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .hero-card .atk-orb, .hero-card .def-orb {
      position: absolute; bottom: 20px; width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 12px;
      font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); z-index: 2;
    }
    .hero-card .atk-orb { left: -4px; background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b); border: 2px solid #8a4a1f; }
    .hero-card .def-orb { right: -4px; background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8); border: 2px solid #2a4a7a; }
    .hero-card .card-name {
      position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
      font-size: 12px; font-weight: bold; color: #4a4a4a; white-space: nowrap;
    }

    /* 问号卡 */
    .qmark-card { position: relative; width: 100px; height: 140px; flex-shrink: 0; }
    .qmark-card .qmark-wrap {
      width: 100%; height: calc(100% - 22px); border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      background: radial-gradient(circle at 30% 30%, #3a4a5a, #1a2a3a); border: 4px solid #c8b878;
      display: flex; align-items: center; justify-content: center;
    }
    .qmark-card .qmark-wrap::before { content: "?"; font-size: 56px; color: #e8d8a0; font-weight: bold; }

    /* 高亮与变暗 */
    .hero-card.winner .oval-wrap { border-color: #f5c542; box-shadow: 0 0 12px #f5c542; animation: winnerBlink 1s ease-in-out infinite; }
    .hero-card.loser .oval-wrap { opacity: 0.5; filter: grayscale(0.8); }
    @keyframes winnerBlink {
      0%, 100% { box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6); }
      50% { box-shadow: 0 0 24px #f5c542, 0 0 48px rgba(245,197,66,0.9); }
    }

    /* 底部你的手牌区（样式同挑战页） */
    .bottom-area { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); z-index: 50; border-top: 1px solid #d8d0bc; }
    .ready-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px; }
    .my-avatar-block { display: flex; align-items: center; gap: 8px; }
    .my-avatar-block img { width: 40px; height: 40px; border-radius: 10px; }
    .my-avatar-block .pname { font-size: 14px; font-weight: bold; }
    .combo-info { flex: 1; text-align: center; font-size: 14px; color: #666; }
    .play-btn { padding: 10px 24px; border-radius: 12px; border: none; background: #5bb8e8; color: #fff; font-size: 16px; font-weight: bold; }
    .play-btn:disabled { background: #ccc; }
    .my-hand-area { padding: 4px 12px 12px; display: flex; overflow-x: auto; gap: 10px; }
    .my-hand-area::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="top-bar">
    <!-- 左侧：轮次、卡袋、记录 -->
    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <div class="top-info" id="roundInfo">第 1 轮</div>
      <div class="top-info" id="poolInfo">卡袋 0</div>
      <button class="top-btn" onclick="showRecord()">记录</button>
    </div>
    
    <!-- 右侧：暂离、退出、弃卡 -->
    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <button class="top-btn" onclick="temporaryLeave()">暂离</button>
      <button class="top-btn danger" id="exitBtn" disabled onclick="quitGame()">退出</button>
      <button class="top-btn danger" onclick="discardCards()">弃卡</button>
    </div>
  </div>

  <div class="arena" id="arena">
    <div class="center-banner atk" id="centerBanner">等待出牌</div>
    <!-- 座位动态生成 -->
  </div>

  <div class="bottom-area">
    <div class="ready-row">
      <div class="my-avatar-block">
        <img src="/static/avatars/{{ current_user.username }}.jpg" alt="">
        <div class="pname">{{ current_user.nickname or current_user.username }}</div>
      </div>
      <div class="combo-info" id="comboInfo">请选择卡牌</div>
      <button class="play-btn" id="playBtn" onclick="submitPlay()" disabled>锁定</button>
    </div>
    <div class="my-hand-area" id="myHandArea"></div>
  </div>

  <!-- 自定义确认弹窗 -->
  <div class="confirm-modal" id="customConfirmModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); z-index:999; justify-content:center; align-items:center;">
    <div style="background:#fffdf5; padding:24px; border-radius:16px; border:4px double #f0e0a0; text-align:center; max-width:400px; width:90%; animation: confirmPop 0.18s ease-out;">
      <h3 style="margin:0 0 14px 0; color:#8a6d1f; font-size:18px; font-weight:bold; letter-spacing:3px;" id="confirmTitle">提示</h3>
      <div style="font-size:15px; color:#555; line-height:1.7; margin-bottom:20px;" id="confirmMsg">确认操作？</div>
      <div style="display:flex; gap:10px;">
        <button onclick="closeCustomConfirm(false)" style="flex:1; padding:12px; border:none; border-radius:12px; background:#fce8ec; color:#b85a6a; font-size:15px; font-weight:bold; border:1px solid #e8c8d0; cursor:pointer;">取消</button>
        <button onclick="closeCustomConfirm(true)" style="flex:1; padding:12px; border:none; border-radius:12px; background:#5bb8e8; color:#fff; font-size:15px; font-weight:bold; cursor:pointer; box-shadow: 0 2px 6px rgba(91,184,232,0.3);">确定</button>
      </div>
    </div>
  </div>

  <!-- 弃卡结算画面 -->
  <div class="confirm-modal" id="resultModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:#fffdf5; padding:24px; border-radius:20px; border:4px double #f0e0a0; text-align:center; max-width:400px; width:90%;">
      <h2 style="margin:0 0 16px 0; color:#8a6d1f; letter-spacing:3px;" id="resultTitle">对局结束</h2>
      <div style="font-size:15px; color:#555; margin-bottom:10px;" id="resultLine"></div>
      <div style="font-size:15px; color:#333; margin-bottom:20px; text-align:left; line-height:1.8;" id="resultRanks"></div>
      <button onclick="confirmResult()" style="width:100%; padding:14px; border:none; border-radius:12px; background:#5bb8e8; color:#fff; font-size:16px; font-weight:bold; cursor:pointer;">确认退出</button>
    </div>
  </div>
  
  <script>
    const roomCode = "{{ room_code }}";
    const myUsername = "{{ current_user.username }}";
    let myHand = {{ hand | tojson }};
    let myReady = [];
    let locked = false;
    let pollTimer = null;
    let lastPhase = "selecting";
    let lastRound = 0;

    // 初始化布局数据
    const playersData = {{ players | tojson }};
    const myPos = playersData.find(p => p.username === myUsername) || {};

    // ===== 自定义确认弹窗 =====
    let confirmResolve = null;
    function showCustomConfirm(title, msg) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('customConfirmModal').style.display = 'flex';
      return new Promise(resolve => { confirmResolve = resolve; });
    }
    function closeCustomConfirm(val) {
      document.getElementById('customConfirmModal').style.display = 'none';
      if (confirmResolve) { confirmResolve(val); confirmResolve = null; }
    }

    // ===== 弃卡逻辑 =====
    async function discardCards() {
      const ok = await showCustomConfirm("弃卡认输", "确定要弃卡吗？手牌将进入卡袋。");
      if (!ok) return;
      
      try {
        const res = await fetch(`/boka/room/${roomCode}/surrender`, { method: 'POST' });
        const data = await res.json();
        if (data.error) {
          alert(data.error);
          return;
        }

        if (data.finished) {
          // 没有真人了，直接全员结算
          showResultModal("游戏结束", "你是第 " + data.rank + " 名", data.all_ranks);
        } else {
          // 还有真人，展示部分排名
          showResultModal("你已弃卡", "你的最终名次：第 " + data.rank + " 名", data.partial_ranks);
        }
        document.getElementById('exitBtn').disabled = false;
      } catch (e) {
        alert("网络异常，弃卡失败");
      }
    }

    function showResultModal(title, line, ranks) {
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultLine').textContent = line;
      let html = '';
      ranks.forEach(r => {
         html += `<div>第 ${r.rank} 名：${r.nickname}</div>`;
      });
      document.getElementById('resultRanks').innerHTML = html;
      document.getElementById('resultModal').style.display = 'flex';
    }

    function confirmResult() {
      window.location.href = '/boka';
    }
    
    // 动态电脑端布局计算
    function getSeatStyle(index, total) {
      const others = total - 1;
      if (others <= 0) return {};
      
      const isMobile = window.innerWidth <= 768;
      if (isMobile) return {}; 

      let top = 0, left = 0, right = 0;
      if (others === 1) top = 1;
      else if (others === 2) top = 2;
      else if (others === 3) { top = 1; left = 1; right = 1; }
      else if (others === 4) { top = 2; left = 1; right = 1; }
      else if (others === 5) { top = 3; left = 1; right = 1; }
      else if (others >= 6) {
         top = Math.min(5, others);
         const rem = others - top;
         left = Math.ceil(rem / 2);
         right = Math.floor(rem / 2);
      }

      let area = "";
      let areaIndex = 0;
      if (index < top) { area = "top"; areaIndex = index; }
      else if (index < top + left) { area = "left"; areaIndex = index - top; }
      else { area = "right"; areaIndex = index - top - left; }

      if (area === "top") {
        const w = 100 / (top + 1);
        return { top: '10px', left: `${w * (areaIndex + 1)}%`, transform: 'translateX(-50%)' };
      } else if (area === "left") {
        const h = 100 / (left + 1);
        return { top: `${40 + (h * areaIndex)}%`, left: '20px' };
      } else {
        const h = 100 / (right + 1);
        return { top: `${40 + (h * areaIndex)}%`, right: '20px' };
      }
    }

    function initSeats() {
      const arena = document.getElementById('arena');
      arena.querySelectorAll('.player-seat').forEach(el => el.remove());

      let otherIndex = 0;
      playersData.forEach(p => {
        if (p.username === myUsername) return;
        
        const seat = document.createElement('div');
        seat.className = 'player-seat';
        seat.id = `seat-${p.username}`;
        
        const style = getSeatStyle(otherIndex, playersData.length);
        for (let k in style) seat.style[k] = style[k];
        
        seat.innerHTML = `
          <div class="player-info-row">
            <img src="/static/avatars/${p.username}.jpg" onerror="this.src='/static/avatars/default.jpg'">
            <div>
              <div class="player-name">${p.nickname}</div>
              <div class="hand-count">手牌 <span id="count-${p.username}">${p.hand_count}</span></div>
            </div>
          </div>
          <div class="played-area" id="play-${p.username}"></div>
        `;
        arena.appendChild(seat);
        otherIndex++;
      });
    }

    // 渲染卡牌到指定区域（支持问号、重叠、胜负）
    function renderCardsToArea(area, cards, phase, winnerCardIds, allLoser, isWinnerUser) {
      area.innerHTML = '';
      
      // ★ 如果是问号阶段，直接画问号，不依赖 cards 数组
      if (phase === 'qmark') {
        const q = document.createElement('div');
        q.className = 'qmark-card';
        q.innerHTML = `<div class="qmark-wrap"></div>`;
        area.appendChild(q);
        return;
      }

      // 没牌不渲染
      if (!cards || cards.length === 0) return;

      // 斗地主式重叠计算（电脑200px，手机300px，这里统一按200算也行）
      const containerWidth = window.innerWidth <= 768 ? 300 : 200;
      const cardWidth = 100;
      let totalWidth = cards.length * cardWidth;
      let marginLeft = 0;
      
      if (totalWidth > containerWidth) {
        marginLeft = (totalWidth - containerWidth) / (cards.length - 1);
      }

      cards.forEach((c, i) => {
        let cls = '';
        if (phase === 'result') {
          if (allLoser) cls = 'loser';
          else if (winnerCardIds.includes(c.id)) cls = 'winner';
          else cls = 'loser';
        }

        const div = document.createElement('div');
        div.className = `hero-card ${cls}`;
        
        if (i > 0 && marginLeft > 0) {
          div.style.marginLeft = `-${marginLeft}px`;
        }
        if (marginLeft === 0 && i > 0) {
          div.style.marginLeft = '8px';
        }
        
        div.innerHTML = `
          <div class="oval-wrap" style="border-color:#f0e0a0;">
            <img src="/static/cards/${c.name}.PNG">
          </div>
          <div class="atk-orb">${c.atk}</div>
          <div class="def-orb">${c.def}</div>
        `;
        area.appendChild(div);
      });
    }

    // 渲染卡牌到指定区域（支持问号、重叠、胜负）
    function renderCardsToArea(area, cards, phase, winnerCardIds, allLoser, isWinnerUser) {
      area.innerHTML = '';
      
      // ★ 如果是问号阶段，直接画问号，不依赖 cards 数组
      if (phase === 'qmark') {
        const q = document.createElement('div');
        q.className = 'qmark-card';
        q.innerHTML = `<div class="qmark-wrap"></div>`;
        area.appendChild(q);
        return;
      }

      // 没牌不渲染
      if (!cards || cards.length === 0) return;

      // 斗地主式重叠计算（电脑200px，手机300px，这里统一按200算也行）
      const containerWidth = window.innerWidth <= 768 ? 300 : 200;
      const cardWidth = 100;
      let totalWidth = cards.length * cardWidth;
      let marginLeft = 0;
      
      if (totalWidth > containerWidth) {
        marginLeft = (totalWidth - containerWidth) / (cards.length - 1);
      }

      cards.forEach((c, i) => {
        let cls = '';
        if (phase === 'result') {
          if (allLoser) cls = 'loser';
          else if (winnerCardIds.includes(c.id)) cls = 'winner';
          else cls = 'loser';
        }

        const div = document.createElement('div');
        div.className = `hero-card ${cls}`;
        
        if (i > 0 && marginLeft > 0) {
          div.style.marginLeft = `-${marginLeft}px`;
        }
        if (marginLeft === 0 && i > 0) {
          div.style.marginLeft = '8px';
        }
        
        div.innerHTML = `
          <div class="oval-wrap" style="border-color:#f0e0a0;">
            <img src="/static/cards/${c.name}.PNG">
          </div>
          <div class="atk-orb">${c.atk}</div>
          <div class="def-orb">${c.def}</div>
        `;
        area.appendChild(div);
      });
    }

    function updatePlayBtn() {
      const btn = document.getElementById('playBtn');
      btn.disabled = locked || myReady.length === 0;
      btn.textContent = locked ? '已锁定' : '锁定出牌';
      document.getElementById('comboInfo').textContent = myReady.length > 0 ? `已选 ${myReady.length} 张` : '请选择卡牌';
    }

    async function submitPlay() {
      if (myReady.length === 0) return;
      
      // 1. 锁定，手牌不可点
      locked = true;
      updatePlayBtn();
      renderHand(); // 重新渲染，蓝框保留但不可点

      // 2. 立刻在亮卡区展示问号（不等网络）
      const myArea = document.getElementById(`play-${myUsername}`);
      if (myArea) {
        renderCardsToArea(myArea, null, 'qmark', [], false, false);
      }

      try {
        const res = await fetch(`/boka/room/${roomCode}/play`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ card_ids: myReady.map(c => c.id) })
        });
        const data = await res.json();
        
        if (!res.ok || data.error) {
          alert(data.error || "出牌失败");
          locked = false;
          updatePlayBtn();
          renderHand();
          if (myArea) myArea.innerHTML = ''; // 失败退回
        }
      } catch (e) {
        console.error(e);
        alert("网络异常");
        locked = false;
        updatePlayBtn();
        renderHand();
        if (myArea) myArea.innerHTML = '';
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollState, 1000);
    }

    async function pollState() {
      try {
        const res = await fetch(`/boka/room/${roomCode}/battle_state`);
        const data = await res.json();
        if (data.error) return;

        // 更新顶栏
        document.getElementById('roundInfo').textContent = `第 ${data.round_no} 轮`;
        document.getElementById('phaseInfo').textContent = data.round_phase;
        
        // ★ 新增：更新卡袋数量
        document.getElementById('poolInfo').textContent = `卡袋 ${data.pool_count || 0}`;
        
        const banner = document.getElementById('centerBanner');
        // ... 下面是原有的代码保持不变
        banner.textContent = '本轮' + data.round_phase;
        banner.className = `center-banner ${data.round_phase === '比攻' ? 'atk' : 'def'}`;

        const elapsed = data.elapsed_since_reveal || 0;

        if (data.phase === 'selecting') {
          if (lastPhase !== 'selecting' || lastRound !== data.round_no) {
            locked = false;
            myHand = data.my_hand || [];
            myReady = [];
            renderHand();
            updatePlayBtn();
            playersData.forEach(p => {
              const area = document.getElementById(`play-${p.username}`);
              if (area) area.innerHTML = '';
            });
          }
        } 
        else if (data.phase === 'revealing' || data.phase === 'finished') {
          locked = true;
          updatePlayBtn();

          playersData.forEach(p => {
            const area = document.getElementById(`play-${p.username}`);
            if (!area) return;
            
            const cards = data.all_played[p.username] || [];
            
            let renderPhase = 'qmark';
            if (elapsed >= 3 && elapsed < 6) renderPhase = 'face';
            else if (elapsed >= 6) renderPhase = 'result';

            const winnerIds = data.winner_card_ids || [];
            const allLoser = data.all_loser || false;

            if (data.players_info) {
              const info = data.players_info.find(x => x.username === p.username);
              if (info) document.getElementById(`count-${p.username}`).textContent = info.hand_count;
            }

            if (data.finished) renderPhase = 'result';

            renderCardsToArea(area, cards, renderPhase, winnerIds, allLoser, data.winner_username === p.username);
          });
        }
        
        lastPhase = data.phase;
        lastRound = data.round_no;

        if (data.finished) {
          clearInterval(pollTimer);
          // ★ 游戏结束，自动解锁“退出”按钮
          const exitBtn = document.getElementById('exitBtn');
          if (exitBtn) exitBtn.disabled = false;
          
          setTimeout(() => {
            alert(`游戏结束！你的排名：${data.my_rank}`);
            window.location.href = `/boka/room/${roomCode}`;
          }, 1000);
        }
      } catch(e) { console.error(e); }
    }

    // ===== 顶部栏按钮功能 =====
    function showRecord() {
      // 目前搏卡还没有做记录弹窗，这里先留空或简单提示
      alert("对局记录功能开发中...");
    }

    // 暂离：回主页，保留房间状态
    async function temporaryLeave() {
      if (!confirm("确定要暂离房间吗？你的位置将被保留。")) return;
      await fetch(`/boka/room/${roomCode}/leave`, { method: 'POST' });
      window.location.href = '/boka';
    }

    // 退出：回主页，且退出当前房间（只有弃卡后才能点，或者直接视为投降）
    async function quitGame() {
      if (!confirm("确定要退出房间吗？")) return;
      await fetch(`/boka/room/${roomCode}/quit`, { method: 'POST' });
      window.location.href = '/boka';
    }

    // 弃卡：直接判负，结束后才能退出
    async function discardCards() {
      if (!confirm("确定要弃卡认输吗？")) return;
      const res = await fetch(`/boka/room/${roomCode}/surrender`, { method: 'POST' });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
      } else {
        alert(`你已弃卡，当前排名：第 ${data.rank} 名`);
        // 弃卡后解锁退出按钮
        document.getElementById('exitBtn').disabled = false;
      }
    }

    initSeats();
    renderHand();
    pollState();
    startPolling();

    window.addEventListener('resize', () => {
      initSeats();
    });
  </script>
</body>
</html>
