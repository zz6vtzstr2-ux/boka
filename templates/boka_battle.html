<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡战斗 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: radial-gradient(ellipse at center, #f5edda 0%, #d8ccb0 100%);
      color: #333;
      position: relative;
    }

    /* 顶部栏 */
    .top-bar {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .top-left { display: flex; gap: 8px; pointer-events: auto; }
    .top-btn {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #4a4a4a;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .top-btn:hover { background: #fff; }
    .room-code-badge {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      color: #8a6d1f;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      pointer-events: auto;
    }

    /* 中央公告（本轮比攻/防） */
    .center-banner {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: bold;
      color: #d9879a;
      letter-spacing: 6px;
      text-indent: 6px;
      background: rgba(252, 232, 236, 0.95);
      padding: 10px 28px;
      border-radius: 20px;
      border: 2px solid #f0c8d0;
      box-shadow: 0 4px 16px rgba(217,135,154,0.3);
      z-index: 15;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .center-banner.hide { opacity: 0; }

    /* 获胜公告 */
    .winner-announce {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .winner-announce.hide { opacity: 0; }
    .winner-announce .winner-label {
      font-size: 13px;
      color: #8a6d1f;
      background: #fdf6d8;
      border: 1px solid #f0e0a0;
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    /* 玩家分布 */
    .area-top {
      position: absolute;
      top: 56px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 4px;
      z-index: 5;
    }
    .area-left, .area-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }
    .area-left { left: 4px; align-items: flex-start; }
    .area-right { right: 4px; align-items: flex-end; }
    .area-bottom {
      position: absolute;
      bottom: 172px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 5;
    }

    /* 玩家槽位 */
    .player-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: relative;
    }
    .player-slot .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #f0e0a0;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      object-fit: cover;
    }
    .player-slot.me .avatar {
      border-color: #5bb8e8;
      box-shadow: 0 0 0 3px rgba(91,184,232,0.4);
    }
    .player-slot.locked .avatar {
      border-color: #5cb85c;
    }
    .player-slot .pname {
      font-size: 11px;
      font-weight: bold;
      color: #4a4a4a;
      background: rgba(255,255,255,0.92);
      padding: 1px 8px;
      border-radius: 8px;
      white-space: nowrap;
      border: 1px solid #e0d8c0;
      max-width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-slot .hand-count {
      font-size: 10px;
      color: #666;
      background: rgba(255,255,255,0.92);
      padding: 1px 6px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .player-slot.locked .hand-count::after {
      content: " ✓";
      color: #5cb85c;
      font-weight: bold;
    }

    /* 玩家出的卡（靠近屏幕中心一侧） */
    .player-played {
      position: absolute;
      width: 60px;
      height: 84px;
      z-index: 10;
      transition: transform 0.5s, opacity 0.5s;
    }
    .area-top .player-slot .player-played {
      top: 100%;
      left: 50%;
      transform: translate(-50%, 4px);
    }
    .area-bottom .player-slot .player-played {
      bottom: 100%;
      left: 50%;
      transform: translate(-50%, -4px);
    }
    .area-left .player-slot .player-played {
      left: 100%;
      top: 50%;
      transform: translate(4px, -50%);
    }
    .area-right .player-slot .player-played {
      right: 100%;
      top: 50%;
      transform: translate(-4px, -50%);
    }
    .player-played.hide { opacity: 0; }

    /* 椭圆英雄卡 */
    .hero-card {
      position: relative;
      width: 60px;
      height: 84px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .hero-card.big {
      width: 90px;
      height: 128px;
    }
    .hero-card .oval-wrap {
      width: 100%;
      height: calc(100% - 18px);
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      overflow: hidden;
      background: #fffdf5;
      border: 3px solid #f0e0a0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      position: relative;
    }
    .hero-card .oval-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-card .atk-orb,
    .hero-card .def-orb {
      position: absolute;
      bottom: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      z-index: 2;
    }
    .hero-card.big .atk-orb,
    .hero-card.big .def-orb {
      bottom: 18px;
      width: 28px;
      height: 28px;
      font-size: 13px;
    }
    .hero-card .atk-orb {
      left: -4px;
      background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b);
      border: 2px solid #8a4a1f;
    }
    .hero-card .def-orb {
      right: -4px;
      background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8);
      border: 2px solid #2a4a7a;
    }
    .hero-card .card-name {
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      color: #4a4a4a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(255,255,255,0.9);
      padding: 1px 4px;
      border-radius: 6px;
    }
    .hero-card.big .card-name {
      font-size: 12px;
    }
    .hero-card.selected {
      filter: drop-shadow(0 0 8px #5bb8e8);
    }

    /* 底部手牌 */
    .hand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.86);
      border-top: 1px solid #d8d0bc;
      padding: 8px 8px 12px 8px;
      z-index: 12;
    }
    .hand-label {
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
      padding-left: 6px;
      letter-spacing: 2px;
    }
    .hand-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      min-height: 90px;
    }
    .ready-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      min-height: 90px;
      margin-bottom: 4px;
      border-bottom: 1px dashed #e0d8c0;
    }
    .ready-scroll:empty::before {
      content: "（未选卡）";
      color: #bbb;
      font-size: 12px;
      padding: 30px 8px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .action-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 2px;
      transition: transform 0.15s;
    }
    .action-btn:disabled {
      background: #ccc !important;
      color: #fff !important;
      cursor: not-allowed;
      transform: none;
    }
    .action-blue { background: #5bb8e8; color: #fff; }
    .action-red { background: #e8a8a8; color: #fff; }

    /* 记录弹窗 */
    .record-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .record-modal.active { display: flex; }
    .record-inner {
      background: #fffdf5;
      border-radius: 16px;
      padding: 18px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 4px double #f0e0a0;
    }
    .record-inner h3 {
      margin: 0 0 12px 0;
      color: #8a6d1f;
      letter-spacing: 2px;
    }
    .record-round {
      margin-bottom: 14px;
      padding: 10px;
      background: #f9f5e8;
      border-radius: 10px;
      font-size: 13px;
    }
    .record-round .r-title {
      font-weight: bold;
      color: #b85a6a;
      margin-bottom: 6px;
    }
    .record-round .r-line {
      font-size: 12px;
      color: #555;
      margin: 2px 0;
    }
    .record-close {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5bb8e8;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      margin-top: 14px;
    }

    /* 结算弹窗 */
    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .result-modal.active { display: flex; }
    .result-inner {
      background: #fffdf5;
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 4px double #f0e0a0;
      text-align: center;
    }
    .result-inner h2 {
      margin: 0 0 16px 0;
      color: #8a6d1f;
      letter-spacing: 3px;
    }
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }
    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #f9f5e8;
      border-radius: 10px;
    }
    .result-row img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 2px solid #d8d0bc;
    }
    .result-row .r-name {
      flex: 1;
      text-align: left;
      font-weight: bold;
      color: #2c3e50;
      font-size: 14px;
    }
    .result-row .r-rank {
      font-size: 13px;
      color: #b85a6a;
      font-weight: bold;
      margin-right: 6px;
    }
    .result-row .r-change {
      font-size: 15px;
      font-weight: bold;
      min-width: 50px;
      text-align: right;
    }
    .result-row .r-change.plus { color: #5cb85c; }
    .result-row .r-change.minus { color: #d9534f; }
    .result-ok {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5bb8e8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 3px;
    }

    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(44,110,90,0.95);
      color: #fff;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <!-- 顶部栏 -->
  <div class="top-bar">
    <div class="top-left">
      <button class="top-btn" onclick="showRecord()">记录</button>
      <button class="top-btn" onclick="temporaryLeave()">暂离</button>
    </div>
    <div class="room-code-badge">房间 {{ room_code }} · 第 {{ round_no }} 轮</div>
  </div>

  <!-- 中央公告 -->
  <div class="center-banner" id="centerBanner">本轮{{ round_phase }}</div>

  <!-- 获胜公告 -->
  <div class="winner-announce hide" id="winnerAnnounce">
    <div class="winner-label">本轮获胜</div>
    <div id="winnerCardHolder"></div>
  </div>

  <!-- 玩家区域 -->
  <div class="area-top" id="areaTop"></div>
  <div class="area-left" id="areaLeft"></div>
  <div class="area-right" id="areaRight"></div>
  <div class="area-bottom" id="areaBottom"></div>

  <!-- 底部手牌 + 备战区 -->
  <div class="hand-bar">
    <div class="hand-label">备战区</div>
    <div class="ready-scroll" id="readyArea"></div>
    <div class="hand-label">手牌</div>
    <div class="hand-scroll" id="handArea"></div>
    <div class="btn-row">
      <button class="action-btn action-blue" id="playBtn" onclick="submitPlay()" disabled>出战</button>
      <button class="action-btn action-red" onclick="surrender()">弃卡</button>
    </div>
  </div>

  <!-- 记录弹窗 -->
  <div class="record-modal" id="recordModal" onclick="if(event.target===this)closeRecord()">
    <div class="record-inner">
      <h3>对局记录</h3>
      <div id="recordContent">暂无记录</div>
      <button class="record-close" onclick="closeRecord()">关闭</button>
    </div>
  </div>

  <!-- 结算弹窗 -->
  <div class="result-modal" id="resultModal">
    <div class="result-inner">
      <h2>本局结算</h2>
      <div class="result-list" id="resultList"></div>
      <button class="result-ok" onclick="confirmResult()">确认返回牌桌</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const roomCode = "{{ room_code }}";
    const myUsername = "{{ current_user.username }}";
    const layout = {{ layout | tojson }};
    let myHand = {{ hand | tojson }};
    let myReady = {{ my_ready | tojson }};
    let allLocked = false;
    let currentPhase = "{{ phase }}";
    let lastWinnerId = null;
    let resultShown = false;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    function cardHTML(c, big) {
      return `
        <div class="oval-wrap">
          <img src="/static/cards/${c.name}.PNG" alt="${c.name}">
        </div>
        <div class="atk-orb">${Math.floor(c.atk)}</div>
        <div class="def-orb">${Math.floor(c.def)}</div>
        <div class="card-name">${c.name}</div>
      `;
    }

    function renderAll(state) {
      const top = document.getElementById('areaTop');
      const left = document.getElementById('areaLeft');
      const right = document.getElementById('areaRight');
      const bottom = document.getElementById('areaBottom');
      top.innerHTML = ''; left.innerHTML = ''; right.innerHTML = ''; bottom.innerHTML = '';

      const players = state.players || [];
      const showCards = state.phase === 'revealing' || state.phase === 'finished';

      players.forEach(p => {
        const pos = layout[p.username] || { side: 'top', index: 0 };
        const div = document.createElement('div');
        div.className = 'player-slot' + (p.username === myUsername ? ' me' : '') + (p.locked ? ' locked' : '');
        div.dataset.username = p.username;
        div.innerHTML = `
          <img class="avatar" src="/static/avatars/${p.username}.jpg" alt="">
          <div class="pname">${p.nickname}${p.username === myUsername ? '（我）' : ''}</div>
          <div class="hand-count">手牌 ${p.hand_count}</div>
        `;

        // 玩家的出牌（靠近屏幕中心一侧）
        const readyCards = p.ready_cards || [];
        if ((showCards || p.is_me) && readyCards.length > 0) {
          const played = document.createElement('div');
          played.className = 'player-played';
          const c = readyCards[0];  // 暂时只显示第一张（组合技可换多张）
          played.innerHTML = `<div class="hero-card">${cardHTML(c)}</div>`;
          div.appendChild(played);
        }

        if (pos.side === 'top') top.appendChild(div);
        else if (pos.side === 'left') left.appendChild(div);
        else if (pos.side === 'right') right.appendChild(div);
        else bottom.appendChild(div);
      });

      // 中央公告
      const banner = document.getElementById('centerBanner');
      if (state.phase === 'revealing' || state.phase === 'finished') {
        banner.classList.add('hide');
      } else {
        banner.classList.remove('hide');
        banner.textContent = '本轮' + state.round_phase;
      }

      // 获胜公告
      const wa = document.getElementById('winnerAnnounce');
      if (state.winner_card_id && state.phase !== 'selecting') {
        const wc = allCards.find(c => c.id === state.winner_card_id);
        if (wc && lastWinnerId !== state.winner_card_id) {
          lastWinnerId = state.winner_card_id;
          document.getElementById('winnerCardHolder').innerHTML =
            `<div class="hero-card big" style="display:inline-block;">${cardHTML(wc, true)}</div>`;
        }
        wa.classList.remove('hide');
      } else if (state.phase === 'selecting') {
        wa.classList.add('hide');
        lastWinnerId = null;
      }

      // 备战区 + 手牌
      renderMyCards(state);

      // 记录
      renderRecord(state.history);

      // 结算
      if (state.finished && !resultShown) {
        resultShown = true;
        showResult(state.players);
      }
    }

    function renderMyCards(state) {
      const handEl = document.getElementById('handArea');
      const readyEl = document.getElementById('readyArea');

      handEl.innerHTML = '';
      readyEl.innerHTML = '';

      const me = state.players.find(p => p.username === myUsername);
      const locked = me && me.locked;

      (state.my_hand || []).forEach(c => {
        const d = document.createElement('div');
        d.className = 'hero-card';
        d.innerHTML = cardHTML(c);
        if (!locked) {
          d.onclick = () => {
            myReady.push(c);
            state.my_hand = state.my_hand.filter(x => x.id !== c.id);
            renderMyCards(state);
          };
        }
        handEl.appendChild(d);
      });

      (state.my_ready || []).forEach(c => {
        const d = document.createElement('div');
        d.className = 'hero-card';
        d.innerHTML = cardHTML(c);
        if (!locked) {
          d.onclick = () => {
            state.my_hand.push(c);
            state.my_ready = state.my_ready.filter(x => x.id !== c.id);
            renderMyCards(state);
          };
        }
        readyEl.appendChild(d);
      });

      const playBtn = document.getElementById('playBtn');
      playBtn.disabled = locked || (state.my_ready || []).length === 0;
      playBtn.textContent = locked ? '已锁定' : '出战';
    }

    function renderRecord(history) {
      const el = document.getElementById('recordContent');
      if (!history || history.length === 0) {
        el.innerHTML = '暂无记录';
        return;
      }
      let html = '';
      history.forEach(r => {
        html += `<div class="record-round">`;
        html += `<div class="r-title">第 ${r.round} 轮（${r.dim === 'atk' ? '比攻' : '比防'}）</div>`;
        (r.played || []).forEach(p => {
          const cardNames = p.cards.map(c => c.name).join('+');
          let result = '';
          if (p.result === 'win') result = ' 🏆 获胜';
          else if (p.result === 'lose') result = ' ❌';
          else if (p.result === 'bombed') result = ' 💣 被炸';
          html += `<div class="r-line">${p.username}：${cardNames}（${p.value}）${result}</div>`;
        });
        html += `</div>`;
      });
      el.innerHTML = html;
    }

    async function pollState() {
      try {
        const res = await fetch('/boka/room/' + roomCode + '/state');
        const data = await res.json();
        if (data.error) return;

        // 保留本地未锁定的手牌/备战区（避免覆盖玩家操作）
        const me = data.players.find(p => p.username === myUsername);
        if (me && !me.locked) {
          if (!allLocked) {
            // 尚未锁定，保留本地状态
            // 但如果数据有变（比如别人结算导致我手牌变化），用服务端
          }
        }

        myHand = data.my_hand || myHand;
        myReady = data.my_ready || myReady;
        allLocked = data.all_locked;
        currentPhase = data.phase;

        renderAll(data);
      } catch (e) {
        console.error(e);
      }
    }

    let myLocalState = null;
    async function submitPlay() {
      if (!myReady || myReady.length === 0) { showToast('请选择卡牌'); return; }
      const res = await fetch('/boka/room/' + roomCode + '/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({card_ids: myReady.map(c => c.id)})
      });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      // 锁定后，等待其他玩家
    }

    async function surrender() {
      if (!confirm('确定弃卡投降？将清空你的手牌，并按照当前剩余人数排定名次')) return;
      const res = await fetch('/boka/room/' + roomCode + '/surrender', { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      showToast('已弃卡，名次第 ' + data.rank);
    }

    function temporaryLeave() {
      fetch('/boka/room/' + roomCode + '/leave', { method: 'POST' }).then(() => {
        window.location.href = '/boka';
      });
    }

    function showRecord() {
      document.getElementById('recordModal').classList.add('active');
    }
    function closeRecord() {
      document.getElementById('recordModal').classList.remove('active');
    }

    function showResult(players) {
      const list = document.getElementById('resultList');
      const sorted = [...players].sort((a, b) => (a.rank || 99) - (b.rank || 99));
      list.innerHTML = sorted.map(p => {
        const me = p.username === myUsername ? '（我）' : '';
        const chg = p.score_change || 0;
        const cls = chg >= 0 ? 'plus' : 'minus';
        const sign = chg >= 0 ? '+' : '';
        return `
          <div class="result-row">
            <img src="/static/avatars/${p.username}.jpg">
            <span class="r-name">${p.nickname}${me}</span>
            <span class="r-rank">#${p.rank || '?'}</span>
            <span class="r-change ${cls}">${sign}${chg}</span>
          </div>
        `;
      }).join('');
      document.getElementById('resultModal').classList.add('active');
    }

    function confirmResult() {
      window.location.href = '/boka/room/' + roomCode;
    }

    // 全局卡表（前端查名字用）
    const allCards = (() => {
      // 从手牌反推所有卡
      const m = {};
      (myHand || []).forEach(c => { m[c.id] = c; });
      (myReady || []).forEach(c => { m[c.id] = c; });
      return Object.values(m);
    })();

    // 首次渲染
    pollState();
    // 轮询
    setInterval(pollState, 1500);
  </script>
</body>
</html>
