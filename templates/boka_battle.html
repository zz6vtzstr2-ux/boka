<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡战斗 · 搏卡游戏</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
           background: #ffffff; color: #333; margin: 0; padding: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .table { position: relative; min-height: 50vh; }
    .player-ring { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .player-box { background: #f9f9f9; border-radius: 8px; padding: 8px;
                  display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .player-box img { width: 32px; height: 32px; border-radius: 6px; }
    .center { text-align: center; margin: 16px 0; font-size: 20px; color: #d4a017; }
    .bottom { position: fixed; bottom: 0; left: 0; right: 0;
              background: #f9f9f9; padding: 10px; border-top: 1px solid #eee; }
    .hand, .ready-area { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
    .card { background: #f0f0f0; border-radius: 8px; padding: 6px; min-width: 90px;
            text-align: center; font-size: 12px; cursor: pointer; }
    .card img { width: 80px; border-radius: 4px; }
    .oval { border-radius: 50%; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-blue { background: #4a90d9; color: white; }
    .btn-red { background: #d9534f; color: white; }
    .btn-yellow { background: #f5c542; color: #333; }
  </style>
</head>
<body>
  <div class="table">
    <div class="player-ring">
      {% for p in players %}
      <div class="player-box">
        <img src="/static/avatars/{{ p.username }}.jpg">
        <span>{{ p.nickname }}</span>
        <span>手牌：{{ p.hand_count }}</span>
      </div>
      {% endfor %}
    </div>
    <div class="center">本轮比攻</div>
  </div>

  <div class="bottom">
    <div>手牌区</div>
    <div class="hand" id="hand"></div>
    <div>备战区</div>
    <div class="ready-area" id="readyArea"></div>
    <div class="btn-row">
      <button class="btn btn-blue" onclick="submit()">出战</button>
      <button class="btn btn-red" onclick="surrender()">弃卡</button>
      <button class="btn btn-yellow" onclick="leave()">暂离房间</button>
      <button class="btn btn-blue" onclick="exitRoom()">退出房间</button>
    </div>
  </div>

  <script>
    let hand = {{ hand | tojson }};
    let ready = [];

    function render() {
      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      hand.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<img src="/static/cards/${c.name}.png"><div>${c.name}</div>`;
        div.onclick = () => { ready.push(c); hand = hand.filter(x => x.id !== c.id); render(); };
        handEl.appendChild(div);
      });
      const readyEl = document.getElementById('readyArea');
      readyEl.innerHTML = '';
      ready.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card oval';
        div.innerHTML = `<img src="/static/cards/${c.name}.png"><div>${c.name}</div>`;
        div.onclick = () => { hand.push(c); ready = ready.filter(x => x.id !== c.id); render(); };
        readyEl.appendChild(div);
      });
    }

    async function submit() {
      if (ready.length === 0) { alert('请选择卡牌'); return; }
      await fetch('/boka/room/{{ room_id }}/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cards: ready.map(c => c.id)})
      });
      alert('已出战');
    }

    function surrender() {
      if (!confirm('确定弃卡？')) return;
      window.location.href = '/boka';
    }

    function leave() {
      window.location.href = '/boka';
    }

    function exitRoom() {
      window.location.href = '/boka';
    }

    render();
  </script>
</body>
</html>
