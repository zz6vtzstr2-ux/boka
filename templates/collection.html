<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收藏 · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 900px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 16px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .back-btn { background: white; color: #4a90d9; padding: 8px 14px;
                border-radius: 8px; text-decoration: none; font-size: 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs a { padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px;
              background: #4a90d9; color: white; }
    .tabs a.inactive { background: #0f3460; color: #eee; }
    .owned-count { font-size: 14px; color: #aaa; margin-bottom: 12px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .card { background: #16213e; border-radius: 10px; padding: 10px; text-align: center;
            border: 2px solid #0f3460; cursor: pointer; position: relative; }
    .card:hover { border-color: #4a90d9; }
    .card .img-wrap { position: relative; }
    .card .img-wrap img { width: 100%; border-radius: 6px; display: block; }
    .card .atk { position: absolute; left: 4px; bottom: 4px; font-size: 13px; color: #e94560; }
    .card .def { position: absolute; right: 4px; bottom: 4px; font-size: 13px; color: #4ecca3; }
    .card .count { position: absolute; top: 6px; right: 8px; font-size: 12px;
                   background: #4a90d9; border-radius: 10px; padding: 2px 6px; }
    .card .star { font-size: 12px; color: #f5c542; margin-top: 4px; }
    .card .name { font-size: 13px; margin-top: 2px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
             background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: #16213e; border-radius: 12px; padding: 24px; max-width: 400px; width: 90%; }
    .modal-content h3 { margin-top: 0; }
    .modal-content .row { margin: 8px 0; font-size: 14px; }
    .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
    .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-upgrade { background: #4ecca3; color: #1a1a2e; }
    .btn-upgrade:disabled { background: #444; color: #888; cursor: not-allowed; }
    .btn-donate { background: #4a90d9; color: white; }
    .btn-donate:disabled { background: #444; color: #888; cursor: not-allowed; }
    .btn-close { background: #333; color: #eee; }
    .bar { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0; }
    .bar .label { width: 28px; color: #aaa; }
    .bar .fill { height: 8px; background: #4ecca3; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="page-name">收藏</span>
    <a href="/" class="back-btn">返回主页</a>
  </div>

  <div class="tabs">
    <a href="/collection">个人收藏</a>
    <a href="/class_collection" class="inactive">班级收藏</a>
  </div>

  <div class="owned-count">已收藏卡（{{ owned_count }}/108）</div>

  <div class="card-grid" id="grid"></div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    const owned = {{ cards | tojson }};
    const allCards = {{ all_cards | tojson }};

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      allCards.forEach(c => {
        const ownedCard = owned.find(o => o.id === c.id);
        const count = ownedCard ? ownedCard.count : 0;
        const div = document.createElement('div');
        div.className = 'card';
        if (count > 0) {
          const star = c.star || 1;
          div.innerHTML = `
            ${count > 1 ? `<div class="count">×${count}</div>` : ''}
            <div class="img-wrap">
              <img loading="lazy" src="/static/cards/${c.name}.png" alt="${c.name}">
              <div class="atk">🗡️${c.atk}</div>
              <div class="def">🛡️${c.def}</div>
            </div>
            <div class="star">${'★'.repeat(star)}</div>
            <div class="name">${c.nick}·${c.name}</div>
          `;
          div.onclick = () => openModal(c, count);
        } else {
          div.innerHTML = `<div style="height:180px;display:flex;align-items:center;justify-content:center;color:#666;">待收集</div>`;
        }
        grid.appendChild(div);
      });
    }

    function openModal(card, count) {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modalContent');
      const canUpgrade = count >= 2;
      const canDonate = count >= 2;
      const maxAttr = Math.max(card.lead, card.might, card.intel, card.politics, card.charm);
      content.innerHTML = `
        <h3>${card.nick}·${card.name}</h3>
        <div class="row">${card.info || ''}</div>
        <div class="bar"><span class="label">统率</span><div class="fill" style="width:${card.lead/maxAttr*100}%"></div><span>${card.lead}</span></div>
        <div class="bar"><span class="label">武力</span><div class="fill" style="width:${card.might/maxAttr*100}%"></div><span>${card.might}</span></div>
        <div class="bar"><span class="label">智力</span><div class="fill" style="width:${card.intel/maxAttr*100}%"></div><span>${card.intel}</span></div>
        <div class="bar"><span class="label">政治</span><div class="fill" style="width:${card.politics/maxAttr*100}%"></div><span>${card.politics}</span></div>
        <div class="bar"><span class="label">魅力</span><div class="fill" style="width:${card.charm/maxAttr*100}%"></div><span>${card.charm}</span></div>
        <div class="row">拥有：×${count}</div>
        <div class="row">重复：×${count - 1}</div>
        <div class="row">升星需要：×${count}</div>
        <div class="modal-btns">
          <button class="btn-upgrade" ${canUpgrade ? '' : 'disabled'} onclick="upgrade(${card.id})">升星</button>
          <button class="btn-donate" ${canDonate ? '' : 'disabled'} onclick="donate(${card.id})">捐献</button>
          <button class="btn-close" onclick="closeModal()">关闭</button>
        </div>
      `;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    async function upgrade(cardId) {
      const res = await fetch('/upgrade', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({card_id: cardId})
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      alert('升星成功！');
      location.reload();
    }

    async function donate(cardId) {
      const res = await fetch('/donate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({card_id: cardId})
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      alert('捐献成功！返还 1 金币。');
      location.reload();
    }

    render();
  </script>
</body>
</html>
