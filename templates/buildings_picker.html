<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>派驻英雄 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    .header {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .title-block .page-name {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 4px;
      text-indent: 4px;
    }
    .title-block .en {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .sort-bar button {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      text-indent: 2px;
      color: #4a4a4a;
      border: 1px solid #d8d0bc;
    }
    .sort-bar button.active { box-shadow: inset 0 0 0 3px #5bb8e8; }
    .sort-rank { background: #e8e8e8; }
    .sort-lead { background: #c8e0c8; }
    .sort-might { background: #e8c8b8; }
    .sort-intel { background: #d8c8e8; }
    .sort-politics { background: #f0dcb0; }
    .sort-charm { background: #e8b8c8; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card-item {
      position: relative;
      cursor: pointer;
      border-radius: 14px;
      overflow: hidden;
      border: 4px double #f0e0a0;
      background: #fffdf5;
      padding: 8px;
    }
    .card-item.selected { box-shadow: inset 0 0 0 4px #5bb8e8; }

    .card-pair {
      display: flex;
      gap: 6px;
    }
    .card-pair .face {
      flex: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    .card-pair .face img {
      width: 100%;
      display: block;
    }
    .card-pair .back-content {
      padding: 8px;
      font-size: 11px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .back-title {
      display: inline-block;
      background: #fdf6d8;
      color: #8a6d1f;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid #f0e0a0;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 6px;
      align-self: flex-start;
    }
    .back-bio {
      font-size: 10px;
      color: #777;
      line-height: 1.4;
      margin-bottom: 6px;
      max-height: 60px;
      overflow: hidden;
    }
    .attr-bars {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      flex: 1;
    }
    .attr-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      width: 20%;
    }
    .attr-bar .label { font-size: 9px; color: #888; margin-bottom: 2px; }
    .attr-bar .bar-wrap {
      flex: 1;
      width: 10px;
      background: #f5f0e0;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .attr-bar .bar { width: 100%; border-radius: 3px; }
    .attr-bar .value { font-size: 9px; font-weight: bold; color: #555; margin-top: 2px; }
    .b-lead { background: #c8e0c8; }
    .b-might { background: #e8c8b8; }
    .b-intel { background: #d8c8e8; }
    .b-politics { background: #f0dcb0; }
    .b-charm { background: #e8b8c8; }

    .card-item .name {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-top: 6px;
      color: #4a4a4a;
    }
    .deployed-mark {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      background: #fdf6d8;
      color: #8a6d1f;
      border: 1px solid #f0e0a0;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 12px;
      border-radius: 10px;
      white-space: nowrap;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 4px;
      text-indent: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s;
    }
    .btn-confirm { background: #5bb8e8; color: #fff; box-shadow: 0 2px 6px rgba(91,184,232,0.3); }
    .btn-confirm:hover { transform: translateY(-2px); background: #4aa8d8; }
    .btn-cancel { background: #fce8ec; color: #b85a6a; border: 1px solid #e8c8d0; }
    .btn-cancel:hover { background: #f8d8de; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="page-name">派驻英雄</div>
        <div class="en">Assign Hero</div>
      </div>
    </div>

    <div class="sort-bar" id="sortBar">
      <button class="sort-rank active" onclick="sortBy('rank', this)">座次</button>
      <button class="sort-lead" onclick="sortBy('lead', this)">统率</button>
      <button class="sort-might" onclick="sortBy('might', this)">武力</button>
      <button class="sort-intel" onclick="sortBy('intel', this)">智力</button>
      <button class="sort-politics" onclick="sortBy('politics', this)">政治</button>
      <button class="sort-charm" onclick="sortBy('charm', this)">魅力</button>
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <div class="btn-row">
      <button class="btn btn-confirm" onclick="confirmPick()">确定</button>
      <button class="btn btn-cancel" onclick="cancelPick()">取消</button>
    </div>
  </div>

  <script>
    const ownedCards = {{ cards | tojson }};
    const deployedMap = {{ deployed | tojson }};
    const currentBid = {{ bid }};
    let selectedCard = null;
    let sortKey = 'rank';

    function sortBy(key, btn) {
      sortKey = key;
      document.querySelectorAll('#sortBar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('cardGrid');
      const sorted = [...ownedCards].sort((a, b) => {
        if (sortKey === 'rank') return a.id - b.id;
        return b[sortKey] - a[sortKey];
      });
      grid.innerHTML = '';
      sorted.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card-item';
        if (selectedCard && selectedCard.id === c.id) {
          div.classList.add('selected');
        }
        const deployedAt = deployedMap[c.id];
        const maxAttr = 100;
        div.innerHTML = `
          ${deployedAt ? `<div class="deployed-mark">${deployedAt}</div>` : ''}
          <div class="card-pair">
            <div class="face">
              <img loading="lazy" src="/static/cards/${c.name}.PNG" alt="${c.name}">
            </div>
            <div class="face back-content">
              <div class="back-title">人物简介</div>
              <div class="back-bio">${c.info || ''}</div>
              <div class="attr-bars">
                <div class="attr-bar">
                  <div class="label">统率</div>
                  <div class="bar-wrap"><div class="bar b-lead" style="height:${c.lead/maxAttr*100}%"></div></div>
                  <div class="value">${c.lead}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">武力</div>
                  <div class="bar-wrap"><div class="bar b-might" style="height:${c.might/maxAttr*100}%"></div></div>
                  <div class="value">${c.might}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">智力</div>
                  <div class="bar-wrap"><div class="bar b-intel" style="height:${c.intel/maxAttr*100}%"></div></div>
                  <div class="value">${c.intel}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">政治</div>
                  <div class="bar-wrap"><div class="bar b-politics" style="height:${c.politics/maxAttr*100}%"></div></div>
                  <div class="value">${c.politics}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">魅力</div>
                  <div class="bar-wrap"><div class="bar b-charm" style="height:${c.charm/maxAttr*100}%"></div></div>
                  <div class="value">${c.charm}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="name">${c.nick}·${c.name}</div>
        `;
        div.onclick = () => { selectedCard = c; renderGrid(); };
        grid.appendChild(div);
      });
    }

    async function confirmPick() {
      if (!selectedCard) { alert('请选择英雄'); return; }
      await fetch('/buildings/set_card', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({bid: currentBid, card_id: selectedCard.id})
      });
      window.location.href = '/buildings';
    }

    function cancelPick() {
      window.location.href = '/buildings';
    }

    renderGrid();
  </script>
</body>
</html>
