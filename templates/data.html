<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据排行榜 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc; color: #333; margin: 0; padding: 16px 16px 90px 16px; min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    /* ===== 顶部标题 ===== */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px;
      padding: 16px 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px;
    }
    .title-block .page-name { font-size: 28px; font-weight: bold; color: #2c3e50; letter-spacing: 4px; text-indent: 4px; }
    .title-block .en { font-size: 12px; color: #999; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
    .back-btn { background: #fce8ec; padding: 10px 20px; border-radius: 8px; border: 1px solid #e8c8d0; font-size: 15px; color: #b85a6a; text-decoration: none; white-space: nowrap; }
    .back-btn:hover { background: #f8d8de; }

    /* ===== 通用面板 ===== */
    .panel { background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .panel-title { display: inline-block; background: #fdf6d8; color: #8a6d1f; padding: 8px 20px; border-radius: 20px; border: 1px solid #f0e0a0; font-size: 18px; font-weight: bold; letter-spacing: 3px; text-indent: 3px; margin-bottom: 16px; }

    /* ===== 筛选区（自适应排列） ===== */
    .filter-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (min-width: 600px) {
      .filter-row { flex-direction: row; align-items: center; }
    }
    .filter-item {
      display: flex; align-items: center; gap: 8px; flex: 1;
    }
    .filter-item label {
      font-size: 14px; font-weight: bold; color: #666; white-space: nowrap;
    }
    .filter-item select {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d8d0bc;
      border-radius: 8px;
      background: #fdfaf0;
      font-family: inherit;
      font-size: 14px;
      color: #333;
      outline: none;
      cursor: pointer;
      appearance: none; /* 移除默认箭头 */
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a6d1f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
    }
    .filter-item select:focus { border-color: #b85a6a; }

    /* ===== 选项卡 ===== */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button {
      flex: 1; padding: 12px 0; border: none; border-radius: 8px; cursor: pointer;
      background: #f0e8d0; color: #8a6d1f; font-size: 15px; font-weight: bold; font-family: inherit;
      transition: all 0.2s; border: 1px solid #e0d8c0;
    }
    .tabs button.active { background: #fdf6d8; color: #b85a6a; border-color: #e8c8d0; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

    /* ===== 表格数据 ===== */
    .data-title { text-align: center; font-size: 16px; color: #8a6d1f; font-weight: bold; margin-bottom: 12px; letter-spacing: 1px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #f0e8d0; font-size: 14px; }
    th { color: #888; font-weight: bold; }
    td img { width: 32px; height: 32px; border-radius: 6px; vertical-align: middle; margin-right: 8px; object-fit: cover; border: 1px solid #e0d8c0; }
    td a { color: #2c3e50; text-decoration: none; font-weight: bold; }
    td a:hover { color: #b85a6a; text-decoration: underline; }
    .val-col { font-weight: bold; color: #b85a6a; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部标题 -->
    <div class="header">
      <div class="title-block">
        <div class="page-name">数据排行榜</div>
        <div class="en">Data Rank</div>
      </div>
      <a href="/" class="back-btn">返回主页</a>
    </div>

    <!-- 筛选区 -->
    <div class="panel">
      <div class="panel-title">数据筛选</div>
      <div class="filter-row">
        <!-- 年 / 总数据 -->
        <div class="filter-item">
          <label>时间</label>
          <select id="yearSelect">
            <option value="all">总数据</option>
            <!-- JS 动态填充年份 -->
          </select>
        </div>
        <!-- 月 -->
        <div class="filter-item">
          <label>月份</label>
          <select id="monthSelect">
            <option value="all">全部月份</option>
            <option value="1">1月</option>
            <option value="2">2月</option>
            <option value="3">3月</option>
            <option value="4">4月</option>
            <option value="5">5月</option>
            <option value="6">6月</option>
            <option value="7">7月</option>
            <option value="8">8月</option>
            <option value="9">9月</option>
            <option value="10">10月</option>
            <option value="11">11月</option>
            <option value="12">12月</option>
          </select>
        </div>
        <!-- 周（仅 Boss 模式显示） -->
        <div class="filter-item" id="weekFilterBox" style="display: none;">
          <label>周次</label>
          <select id="weekSelect">
            <option value="all">全月</option>
            <option value="1">第 1 周</option>
            <option value="2">第 2 周</option>
            <option value="3">第 3 周</option>
            <option value="4">第 4 周</option>
            <option value="5">第 5 周</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 数据面板 -->
    <div class="panel">
      <div class="tabs">
        <button class="active" onclick="showMode('boka', this)">搏卡</button>
        <button onclick="showMode('challenge', this)">个人挑战</button>
        <button onclick="showMode('boss', this)">世界 Boss</button>
      </div>
      
      <div class="data-title" id="modeTitle">搏卡总榜</div>

      <table>
        <thead>
          <tr>
            <th>玩家</th>
            <th id="col2">积分</th>
            <th id="col3">场次</th>
          </tr>
        </thead>
        <tbody id="rankBody">
          <tr><td colspan="3" style="text-align:center; color:#aaa;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let mode = 'boka';

    // 初始化年份下拉框（从 2024 到 2030，或者根据需求写死）
    const yearSelect = document.getElementById('yearSelect');
    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= 2024; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '年';
        yearSelect.appendChild(opt);
    }

    function showMode(m, btn) {
      mode = m;
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // 切换表头
      const col2 = document.getElementById('col2');
      const col3 = document.getElementById('col3');
      
      if (m === 'challenge') {
        col2.textContent = '最高关卡';
        col3.textContent = '场次';
        document.getElementById('weekFilterBox').style.display = 'none';
      } else if (m === 'boss') {
        col2.textContent = '总伤害';
        col3.textContent = '出战次数';
        document.getElementById('weekFilterBox').style.display = 'flex'; // 显示周
      } else {
        col2.textContent = '积分';
        col3.textContent = '场次';
        document.getElementById('weekFilterBox').style.display = 'none';
      }
      
      loadRank();
    }

    async function loadRank() {
      const body = document.getElementById('rankBody');
      body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#aaa;">加载中...</td></tr>';
      
      const year = document.getElementById('yearSelect').value;
      const month = document.getElementById('monthSelect').value;
      const week = document.getElementById('weekSelect').value;
      
      // 拼接请求参数
      const params = new URLSearchParams({ year, month, week });
      const url = `/data/${mode}?${params.toString()}`;
      
      // 更新标题
      let titleStr = "";
      if (year === 'all') titleStr += "历史总榜 ";
      else titleStr += year + "年 ";
      
      if (month !== 'all') titleStr += month + "月 ";
      if (mode === 'boss' && week !== 'all') titleStr += "第" + week + "周 ";
      
      titleStr += (mode === 'boka' ? "搏卡" : (mode === 'challenge' ? "挑战" : "Boss"));
      document.getElementById('modeTitle').textContent = titleStr + " 数据";

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        body.innerHTML = '';
        if (!data.ranks || data.ranks.length === 0) {
            body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#aaa; padding:20px;">该时间段暂无数据</td></tr>';
            return;
        }

        data.ranks.forEach((r, index) => {
          const tr = document.createElement('tr');
          
          // 如果是 AI，用立绘，如果是真人，用头像
          const isAI = r.username.startsWith('ai_');
          const avatarSrc = isAI ? `/static/cards/${r.nickname}.PNG` : `/static/avatars/${r.username}.jpg`;
          
          // 点击头像跳转玩家资料（AI 不能点）
          const avatarHtml = isAI 
              ? `<img src="${avatarSrc}" onerror="this.src='/static/cards/default.PNG'">`
              : `<a href="/user/${r.username}"><img src="${avatarSrc}" onerror="this.remove()"></a>`;
              
          const nameHtml = isAI 
              ? `<span>${r.nickname}</span>` 
              : `<a href="/user/${r.username}">${r.nickname}</a>`;

          tr.innerHTML = `
            <td>${avatarHtml} ${nameHtml}</td>
            <td class="val-col">${r.value || 0}</td>
            <td>${r.games || 0}</td>
          `;
          body.appendChild(tr);
        });
      } catch (e) {
        body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#b85a6a; padding:20px;">网络异常，请重试</td></tr>';
      }
    }

    // 监听下拉菜单变化
    document.getElementById('yearSelect').addEventListener('change', loadRank);
    document.getElementById('monthSelect').addEventListener('change', loadRank);
    document.getElementById('weekSelect').addEventListener('change', loadRank);

    // 首次加载
    loadRank();
  </script>
</body>
</html>
