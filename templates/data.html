<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据排行榜 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc; color: #333; margin: 0; padding: 16px 16px 90px 16px; min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    /* ===== 顶部标题 ===== */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px;
      padding: 16px 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px;
    }
    .title-block .page-name { font-size: 28px; font-weight: bold; color: #2c3e50; letter-spacing: 4px; text-indent: 4px; }
    .title-block .en { font-size: 12px; color: #999; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
    .back-btn { background: #fce8ec; padding: 10px 20px; border-radius: 8px; border: 1px solid #e8c8d0; font-size: 15px; color: #b85a6a; text-decoration: none; white-space: nowrap; }
    .back-btn:hover { background: #f8d8de; }

    /* ===== 通用面板 ===== */
    .panel { background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .panel-title { display: inline-block; background: #fdf6d8; color: #8a6d1f; padding: 8px 20px; border-radius: 20px; border: 1px solid #f0e0a0; font-size: 18px; font-weight: bold; letter-spacing: 3px; text-indent: 3px; margin-bottom: 16px; }

    /* ===== 筛选区 ===== */
    .filter-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    @media (min-width: 600px) { .filter-row { flex-direction: row; align-items: center; } }
    .filter-item { display: flex; align-items: center; gap: 8px; flex: 1; }
    .filter-item label { font-size: 14px; font-weight: bold; color: #666; white-space: nowrap; }
    .filter-item select { flex: 1; padding: 10px 12px; border: 1px solid #d8d0bc; border-radius: 8px; background: #fdfaf0; font-family: inherit; font-size: 14px; color: #333; outline: none; cursor: pointer; }
    .filter-item select:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }

    /* ===== 三个胶囊按钮 ===== */
    /* ★ 这里我连空格都和你的资料页一模一样，没有任何多余的修改 */
    /* ===== 三个胶囊按钮（根据截图完全复刻） ===== */
    .data-tabs { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 16px; 
      width: 100%; 
    }
    .data-tabs button {
      flex: 1 1 0;
      min-width: 0;
      padding: 10px 6px;
      border: 1px solid #d8d0bc; /* 浅边框 */
      border-radius: 12px;
      cursor: pointer;
      background: #fdfaf0; /* 未选中：米黄色底 */
      color: #4a4a4a;      /* 未选中：深灰色字 */
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 1px;
      transition: transform 0.15s, background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .data-tabs button.active {
      background: #5bb8e8; /* 选中：蓝色底 */
      color: #fff;         /* 选中：白色字 */
      border-color: #5bb8e8;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3); /* 选中：带点发光阴影 */
    }

    .data-title { text-align: center; font-size: 16px; color: #8a6d1f; font-weight: bold; margin-bottom: 12px; }

    /* ===== 表格 & 冻结首列 ===== */
    .table-wrap { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
    table { width: 100%; min-width: 400px; border-collapse: collapse; }
    th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #f0e8d0; font-size: 14px; white-space: nowrap; }
    th { color: #888; font-weight: bold; cursor: pointer; position: relative; user-select: none; }
    th:hover { color: #b85a6a; }
    
    th.sort-asc::after { content: " ▲"; font-size: 10px; }
    th.sort-desc::after { content: " ▼"; font-size: 10px; }
    
    .sticky-col { position: sticky; left: 0; background: rgba(255,255,255,0.95); z-index: 1; border-right: 1px solid #f0e8d0; text-align: left; min-width: 110px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    
    td img { width: 32px; height: 32px; border-radius: 6px; vertical-align: middle; margin-right: 8px; object-fit: cover; border: 1px solid #e0d8c0; cursor: pointer; }
    td .name-text { color: #2c3e50; text-decoration: none; font-weight: bold; cursor: pointer; }
    td .name-text:hover { color: #b85a6a; }
    .val-col { font-weight: bold; color: #b85a6a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block"><div class="page-name">数据排行榜</div><div class="en">Data Rank</div></div>
      <a href="/" class="back-btn">返回主页</a>
    </div>

    <div class="panel">
      <div class="panel-title">数据筛选</div>
      <div class="filter-row">
        <div class="filter-item">
          <label>时间</label>
          <select id="yearSelect">
            <option value="all">总数据</option>
          </select>
        </div>
        <div class="filter-item">
          <label>月份</label>
          <select id="monthSelect" disabled>
            <option value="all">全部月份</option>
          </select>
        </div>
        <div class="filter-item">
          <label>周次</label>
          <select id="weekSelect" disabled>
            <option value="all">全月</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="data-tabs">
        <button class="active" onclick="showMode('boka', this)">搏卡</button>
        <button onclick="showMode('challenge', this)">个人挑战</button>
        <button onclick="showMode('boss', this)">世界 Boss</button>
      </div>
      
      <div class="data-title" id="modeTitle">搏卡总榜</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr id="tableHeader"></tr>
          </thead>
          <tbody id="rankBody">
            <tr><td colspan="5" style="text-align:center; color:#aaa;">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let mode = 'boka';
    let rawData = []; 
    let sortCol = 'value';
    let sortAsc = false; 

    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    const weekSelect = document.getElementById('weekSelect');

    const startDate = new Date(2026, 10, 1); 
    const now = new Date();

    for (let y = now.getFullYear(); y >= 2026; y--) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y + '年';
        yearSelect.appendChild(opt);
    }

    yearSelect.addEventListener('change', () => {
      const y = parseInt(yearSelect.value);
      if (yearSelect.value === 'all') {
        monthSelect.value = 'all'; monthSelect.disabled = true;
        weekSelect.value = 'all'; weekSelect.disabled = true;
      } else {
        monthSelect.innerHTML = '<option value="all">全部月份</option>';
        let startM = (y === 2026) ? 11 : 1;
        let endM = (y === now.getFullYear()) ? now.getMonth() + 1 : 12;
        for (let m = startM; m <= endM; m++) {
            const opt = document.createElement('option');
            opt.value = m; opt.textContent = m + '月';
            monthSelect.appendChild(opt);
        }
        monthSelect.disabled = false;
        weekSelect.value = 'all'; weekSelect.disabled = true;
      }
      loadRank();
    });

    monthSelect.addEventListener('change', () => {
      const m = parseInt(monthSelect.value);
      if (monthSelect.value === 'all') {
        weekSelect.value = 'all'; weekSelect.disabled = true;
      } else {
        weekSelect.innerHTML = '<option value="all">全月</option>';
        const y = parseInt(yearSelect.value);
        const daysInMonth = new Date(y, m, 0).getDate();
        let weekCount = 0;
        for (let d = 1; d <= daysInMonth; d++) {
            if (new Date(y, m - 1, d).getDay() === 1) weekCount++;
        }
        if (new Date(y, m - 1, 1).getDay() !== 1) weekCount++;

        for (let w = 1; w <= weekCount; w++) {
            const opt = document.createElement('option');
            opt.value = w; opt.textContent = '第 ' + w + ' 周';
            weekSelect.appendChild(opt);
        }
        weekSelect.disabled = false;
      }
      loadRank();
    });

    weekSelect.addEventListener('change', loadRank);

    function showMode(m, btn) {
      mode = m;
      document.querySelectorAll('.data-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sortCol = 'value';
      sortAsc = false;
      loadRank();
    }

    function renderHeader() {
        const header = document.getElementById('tableHeader');
        let html = `<th class="sticky-col" style="cursor:default;">玩家</th>`;
        
        if (mode === 'boka') {
            html += `<th onclick="sortData('value')" id="th-val">积分增减</th><th onclick="sortData('games')" id="th-games">场次</th>`;
        } else if (mode === 'challenge') {
            html += `<th onclick="sortData('value')" id="th-val">最高关卡</th>
                     <th onclick="sortData('winrate')" id="th-winrate">胜率</th>
                     <th onclick="sortData('games')" id="th-games">场次</th>`;
        } else if (mode === 'boss') {
            html += `<th onclick="sortData('max_dmg')" id="th-max">最高伤害</th>
                     <th onclick="sortData('games')" id="th-games">次数</th>`;
        }
        header.innerHTML = html;
        updateSortArrows();
    }

    function sortData(col) {
        if (sortCol === col) {
            sortAsc = !sortAsc; 
        } else {
            sortCol = col;
            sortAsc = false; 
        }
        updateSortArrows();
        renderTable();
    }

    function updateSortArrows() {
        document.querySelectorAll('th').forEach(th => {
            th.classList.remove('sort-asc', 'sort-desc');
        });
        const targetTh = document.getElementById('th-' + (sortCol === 'value' && mode === 'boss' ? 'max' : sortCol));
        if (targetTh) {
            targetTh.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
        }
    }

    async function loadRank() {
      const body = document.getElementById('rankBody');
      body.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#aaa; padding:20px;">加载中...</td></tr>';
      
      const year = yearSelect.value;
      const month = monthSelect.value;
      const week = weekSelect.value;
      
      const params = new URLSearchParams({ year, month, week });
      const url = `/data/${mode}?${params.toString()}`;
      
      let titleStr = year === 'all' ? "历史总榜 " : year + "年 ";
      if (month !== 'all') titleStr += month + "月 ";
      if (week !== 'all') titleStr += "第" + week + "周 ";
      titleStr += (mode === 'boka' ? "搏卡" : (mode === 'challenge' ? "挑战" : "Boss"));
      document.getElementById('modeTitle').textContent = titleStr + " 数据";

      try {
        const res = await fetch(url);
        const data = await res.json();
        rawData = data.ranks || [];
        
        renderHeader();
        renderTable();
      } catch (e) {
        body.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#b85a6a; padding:20px;">网络异常</td></tr>';
      }
    }

    function renderTable() {
        const body = document.getElementById('rankBody');
        body.innerHTML = '';
        
        if (rawData.length === 0) {
            body.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#aaa; padding:20px;">该时间段暂无数据</td></tr>';
            return;
        }

        let sortedData = [...rawData];
        sortedData.sort((a, b) => {
            let va = a[sortCol];
            let vb = b[sortCol];
            if (sortCol === 'winrate') {
                va = a.games ? (a.wins / a.games) : 0;
                vb = b.games ? (b.wins / b.games) : 0;
            }
            if (va === undefined) va = 0;
            if (vb === undefined) vb = 0;
            return sortAsc ? va - vb : vb - va;
        });

        sortedData.forEach((r) => {
          const tr = document.createElement('tr');
          const isAI = r.username.startsWith('ai_');
          const avatarSrc = isAI ? `/static/cards/${r.nickname}.PNG` : `/static/avatars/${r.username}.jpg`;
          
          const avatarHtml = isAI 
              ? `<img src="${avatarSrc}" onerror="this.remove()">`
              : `<img src="${avatarSrc}" onclick="showProfile('${r.username}')" onerror="this.remove()">`;
          const nameHtml = isAI 
              ? `<span class="name-text">${r.nickname}</span>` 
              : `<span class="name-text" onclick="showProfile('${r.username}')">${r.nickname}</span>`;

          let tds = `<td class="sticky-col">${avatarHtml} ${nameHtml}</td>`;

          if (mode === 'boka') {
              tds += `<td class="val-col">${r.value > 0 ? '+' : ''}${r.value || 0}</td><td>${r.games || 0}</td>`;
          } else if (mode === 'challenge') {
              const wr = r.games ? ((r.wins / r.games) * 100).toFixed(1) + '%' : '0%';
              tds += `<td class="val-col">${r.value || 0}</td><td>${wr}</td><td>${r.games || 0}</td>`;
          } else if (mode === 'boss') {
              tds += `<td class="val-col">${r.max_dmg || 0}</td><td>${r.games || 0}</td>`;
          }

          tr.innerHTML = tds;
          body.appendChild(tr);
        });
    }

    function showProfile(username) {
      if (username.startsWith('ai_')) return;
      const iframe = document.getElementById('profileIframe');
      iframe.src = 'about:blank';
      setTimeout(() => { iframe.src = '/user/' + username; }, 10);
      document.getElementById('profileModal').style.display = 'flex';
    }

    yearSelect.value = 'all';
    loadRank();
  </script>

  <div id="profileModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#e8e0cc; width:95%; max-width:500px; height:85vh; border-radius:20px; border:4px double #f0e0a0; position:relative; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.5); display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fffdf5; border-bottom:1px solid #d8d0bc; z-index:10;">
        <h3 style="margin:0; color:#8a6d1f; font-size:22px;">玩家资料</h3>
        <button onclick="document.getElementById('profileModal').style.display='none'" style="background:#fce8ec; color:#b85a6a; border:1px solid #e8c8d0; padding:8px 24px; border-radius:8px; font-size:16px; font-weight:bold; font-family:inherit; cursor:pointer;">关闭</button>
      </div>
      <iframe id="profileIframe" src="" style="flex:1; width:100%; border:none; background:#e8e0cc;"></iframe>
    </div>
  </div>
</body>
</html>
