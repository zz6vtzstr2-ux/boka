<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑卡组 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      max-width: 868px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 0 16px;
    }

    .panel-combined {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .panel-cards {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e8e0cc;
    }
    .title-block .page-name {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 4px;
      text-indent: 4px;
    }
    .title-block .en {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .cancel-top-btn {
      background: #fce8ec;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #e8c8d0;
      font-size: 15px;
      color: #b85a6a;
      text-decoration: none;
    }
    .cancel-top-btn:hover { background: #f8d8de; }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .confirm-top-btn {
      background: #5bb8e8;
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #4aa8d8;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .confirm-top-btn:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    .confirm-top-btn:disabled { background: #cccccc; border-color: #b0b0b0; cursor: not-allowed; }

    .sort-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .selected-count-top {
      font-size: 14px;
      color: #666;
      white-space: nowrap;
      padding: 0 4px;
    }
    .selected-count-top b {
      color: #b85a6a;
      font-size: 16px;
    }
    .sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sort-bar button {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      text-indent: 2px;
      color: #4a4a4a;
      border: 1px solid #d8d0bc;
    }
    .sort-bar button.active { box-shadow: inset 0 0 0 3px #5bb8e8; }
    .sort-rank { background: #e8e8e8; }
    .sort-atk { background: #f5d5b0; color: #7a4a1a; }
    .sort-def { background: #c8dff0; color: #1a4a7a; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .card-wrap {
      position: relative;
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-item {
      cursor: pointer;
      border-radius: 14px;
      overflow: hidden;
      background: #fffdf5;
      padding: 8px;
      border: 4px double #f0e0a0;
      transition: box-shadow 0.15s;
      width: 100%;
      max-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-item.selected {
      box-shadow: inset 0 0 0 4px #5bb8e8;
    }
    .card-img-wrap {
      width: 100%;
      aspect-ratio: 300 / 480;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-item .name {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-top: 6px;
      color: #4a4a4a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .card-item .stars {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      margin-top: 4px;
    }

    .order-mark {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      background: #5bb8e8;
      color: #fff;
      border: 1px solid #4aa8d8;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 14px;
      border-radius: 10px;
      white-space: nowrap;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .toast {
      position: fixed; top: 88%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(44,110,90,0.95); color: #fff;
      padding: 14px 24px; border-radius: 14px; font-size: 15px;
      font-weight: bold; opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel-combined">
      <div class="header-row">
        <div class="title-block">
          <div class="page-name">编辑卡组</div>
          <div class="en">Edit Deck</div>
        </div>
        <div class="header-actions">
          <button class="confirm-top-btn" id="confirmBtn" onclick="confirmPick()" disabled>确定</button>
          <a href="/challenge?level={{ level }}" class="cancel-top-btn">取消</a>
        </div>
      </div>
      <div class="sort-bar-row">
        <div class="sort-bar" id="sortBar">
          <button class="sort-rank active" onclick="sortBy('rank', this)">座次</button>
          <button class="sort-atk" onclick="sortBy('atk', this)">攻击</button>
          <button class="sort-def" onclick="sortBy('def', this)">防御</button>
        </div>
        <span class="selected-count-top">已选 <b id="selCountTop">0</b>/6</span>
      </div>
    </div>

    <div class="panel-cards">
      <div class="card-grid" id="cardGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const ownedCards = {{ cards | tojson }};
    const initialSelected = {{ selected_ids | tojson }};
    const level = {{ level }};
    let selectedCards = [];
    let sortKey = 'rank';

    initialSelected.forEach(id => {
      const c = ownedCards.find(x => x.id === id);
      if (c) selectedCards.push(c);
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    function levelToQuality(level) {
      if (level <= 5) return "#d0d0d0";
      if (level <= 10) return "#5cb85c";
      if (level <= 15) return "#4a90d9";
      if (level <= 20) return "#a06cd5";
      return "#f5a623";
    }
    function levelToStars(level) {
      return ((level - 1) % 5) + 1;
    }

    function updateCount() {
      document.getElementById('selCountTop').textContent = selectedCards.length;
      document.getElementById('confirmBtn').disabled = selectedCards.length < 1 || selectedCards.length > 6;
    }

    function sortBy(key, btn) {
      sortKey = key;
      document.querySelectorAll('#sortBar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('cardGrid');
      const sorted = [...ownedCards].sort((a, b) => {
        if (sortKey === 'rank') return a.id - b.id;
        const aVal = sortKey === 'atk' ? (a.atk + (a.level - 1)) : (a.def + (a.level - 1));
        const bVal = sortKey === 'atk' ? (b.atk + (b.level - 1)) : (b.def + (b.level - 1));
        return bVal - aVal;
      });
      grid.innerHTML = '';
      sorted.forEach(c => {
        const order = selectedCards.findIndex(x => x.id === c.id);
        const isSelected = order >= 0;
        const lv = c.level || 1;
        const stars = levelToStars(lv);
        const borderColor = levelToQuality(lv);

        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrap';
        wrapper.dataset.cardId = c.id;

        const div = document.createElement('div');
        div.className = 'card-item' + (isSelected ? ' selected' : '');
        div.style.borderColor = borderColor;
        div.innerHTML = `
          <div class="card-img-wrap">
            <img loading="lazy" src="/static/cards/${c.name}.PNG" alt="${c.name}">
          </div>
          <div class="name">${c.nick}·${c.name}</div>
          <div class="stars" style="color:${borderColor};">${'★'.repeat(stars)} Lv${lv}</div>
        `;
        div.onclick = () => {
          const idx = selectedCards.findIndex(x => x.id === c.id);
          if (idx >= 0) {
            selectedCards.splice(idx, 1);
          } else {
            if (selectedCards.length >= 6) { showToast('最多选择 6 张'); return; }
            selectedCards.push(c);
          }
          updateAllVisuals();
          updateCount();
        };
        wrapper.appendChild(div);
        if (isSelected) {
          const mark = document.createElement('div');
          mark.className = 'order-mark';
          mark.textContent = '已选';
          wrapper.appendChild(mark);
        }
        grid.appendChild(wrapper);
      });
    }

    function updateAllVisuals() {
      const grid = document.getElementById('cardGrid');
      grid.querySelectorAll('.card-wrap').forEach(wrapper => {
        const cardId = parseInt(wrapper.dataset.cardId);
        const div = wrapper.querySelector('.card-item');
        if (!div) return;
        const order = selectedCards.findIndex(x => x.id === cardId);
        const isSelected = order >= 0;
        if (isSelected) {
          div.classList.add('selected');
        } else {
          div.classList.remove('selected');
        }
        const oldMark = wrapper.querySelector('.order-mark');
        if (isSelected) {
          if (oldMark) {
            oldMark.textContent = '已选';
          } else {
            const mark = document.createElement('div');
            mark.className = 'order-mark';
            mark.textContent = '已选';
            wrapper.appendChild(mark);
          }
        } else {
          if (oldMark) oldMark.remove();
        }
      });
    }

    async function confirmPick() {
      if (selectedCards.length < 1 || selectedCards.length > 6) { showToast('请选择 1~6 张卡'); return; }
      const res = await fetch('/challenge/deck/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          level: level,
          card_ids: selectedCards.map(c => c.id)
        })
      });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      window.location.href = '/challenge?level=' + level;
    }

    updateCount();
    renderGrid();
  </script>
</body>
</html>
