<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界 Boss · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 900px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 16px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .back-btn { background: white; color: #4a90d9; padding: 8px 14px;
                border-radius: 8px; text-decoration: none; font-size: 14px; }
    .panel { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .hp-bar { height: 20px; background: #0f3460; border-radius: 10px; overflow: hidden; }
    .hp-fill { height: 100%; background: #e94560; }
    .boss-info { font-size: 14px; color: #aaa; margin: 8px 0; }
    .main { display: flex; gap: 16px; }
    .main .left { flex: 1; }
    .main .right { width: 260px; }
    .deck { background: #0f3460; border-radius: 8px; padding: 10px; margin: 8px 0; }
    .deck .deck-head { display: flex; justify-content: space-between; align-items: center; }
    .deck .deck-dmg { color: #f5c542; font-size: 13px; }
    .deck .cards { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .card { background: #16213e; border-radius: 6px; padding: 6px; width: 90px;
            text-align: center; font-size: 11px; }
    .card img { width: 100%; border-radius: 4px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
           background: #4a90d9; color: white; font-size: 14px; }
    .picker { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
              background: rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; }
    .picker.active { display: block; }
    .picker-inner { max-width: 900px; margin: 20px auto; padding: 16px; }
    .picker .sort-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .picker .sort-bar button { padding: 6px 12px; border-radius: 6px; border: none;
                                background: #0f3460; color: #eee; cursor: pointer; }
    .picker .sort-bar button.active { background: #4a90d9; color: white; }
    .picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .picker .grid .card { background: #16213e; border-radius: 8px; padding: 6px;
                          text-align: center; cursor: pointer; }
    .picker .grid .card img { width: 100%; border-radius: 4px; }
    .fatigue { font-size: 11px; }
    .fatigue-0 { color: #4ecca3; }
    .fatigue-1 { color: #8bc34a; }
    .fatigue-2 { color: #ffc107; }
    .fatigue-3 { color: #ff9800; }
    .fatigue-4 { color: #ff5722; }
    .fatigue-5 { color: #e94560; }
    .fatigue-6 { color: #c62828; }
    .fatigue-7 { color: #880e4f; }
  </style>
</head>
<body>
  <div class="header">
    <span class="page-name">世界 Boss</span>
    <a href="/" class="back-btn">返回主页</a>
  </div>

  <div class="panel">
    <h3>{{ boss.name }} · 本周</h3>
    <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
    <div class="boss-info">今日部队：{{ boss.troop }}</div>
    <div class="boss-info">易伤五维：{{ weak_attr_cn }}（伤害 ×3）</div>
    <div class="boss-info">规则：多次出战英雄感到疲劳，战力将衰减。</div>
  </div>

  <div class="main">
    <div class="left">
      <div class="panel">
        <h3>我的卡组</h3>
        <div id="decks"></div>
        <button class="btn" onclick="createDeck()">新建卡组</button>
      </div>
    </div>
    <div class="right">
      <div class="panel">
        <h3>本周期排名</h3>
        <div id="rankList">暂无数据</div>
      </div>
    </div>
  </div>

  <div class="picker" id="picker">
    <div class="picker-inner">
      <div class="sort-bar">
        <button class="active" onclick="sortBy('rank', this)">名次</button>
        <button onclick="sortBy('lead', this)">统率</button>
        <button onclick="sortBy('might', this)">武力</button>
        <button onclick="sortBy('intel', this)">智力</button>
        <button onclick="sortBy('politics', this)">政治</button>
        <button onclick="sortBy('charm', this)">魅力</button>
      </div>
      <div class="grid" id="pickerGrid"></div>
      <button class="btn" onclick="confirmPick()">确定</button>
      <button class="btn" onclick="closePicker()">取消</button>
    </div>
  </div>

  <script>
    const ownedCards = {{ cards | tojson }};
    const fatigueData = {{ fatigue | tojson }};
    const weakAttr = "{{ weak_attr }}";
    let selectedCards = [];
    let sortKey = 'rank';

    function fatigueColor(times) {
      return 'fatigue-' + Math.min(times, 7);
    }

    async function loadDecks() {
      const res = await fetch('/world_boss/decks');
      const data = await res.json();
      const el = document.getElementById('decks');
      el.innerHTML = '';
      data.decks.forEach(d => {
        const div = document.createElement('div');
        div.className = 'deck';
        div.innerHTML = `
          <div class="deck-head">
            <span>${d.name}</span>
            <span class="deck-dmg">预计伤害：${d.damage} 点</span>
          </div>
          <div class="cards">
            ${d.cards.map(c => `
              <div class="card">
                <img src="/static/cards/${c.name}.png">
                <div>${c.name}</div>
                <div class="fatigue ${fatigueColor(c.times)}">已出战：${c.times} 次</div>
              </div>
            `).join('')}
          </div>
        `;
        el.appendChild(div);
      });
    }

    function createDeck() {
      selectedCards = [];
      renderPicker();
      document.getElementById('picker').classList.add('active');
    }

    function closePicker() {
      document.getElementById('picker').classList.remove('active');
    }

    function sortBy(key, btn) {
      sortKey = key;
      document.querySelectorAll('.sort-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPicker();
    }

    function renderPicker() {
      const grid = document.getElementById('pickerGrid');
      const sorted = [...ownedCards].sort((a, b) => {
        if (sortKey === 'rank') return a.id - b.id;
        return b[sortKey] - a[sortKey];
      });
      grid.innerHTML = '';
      sorted.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        if (selectedCards.find(x => x.id === c.id)) {
          div.style.border = '2px solid #4ecca3';
        }
        const times = fatigueData[c.id] || 0;
        div.innerHTML = `
          <img src="/static/cards/${c.name}.png">
          <div>${c.name}</div>
          <div class="fatigue ${fatigueColor(times)}">已出战：${times} 次</div>
        `;
        div.onclick = () => {
          if (selectedCards.find(x => x.id === c.id)) {
            selectedCards = selectedCards.filter(x => x.id !== c.id);
          } else if (selectedCards.length < 5) {
            selectedCards.push(c);
          }
          renderPicker();
        };
        grid.appendChild(div);
      });
    }

    async function confirmPick() {
      if (selectedCards.length === 0) { alert('请选择英雄'); return; }
      await fetch('/world_boss/deck/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cards: selectedCards.map(c => c.id)})
      });
      closePicker();
      loadDecks();
    }

    loadDecks();
  </script>
</body>
</html>
