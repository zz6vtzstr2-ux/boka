<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挑战 · 小浣熊水浒卡</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back { color: #888; text-decoration: none; }
    .level-info { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .cards { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .card { background: #0f3460; border-radius: 8px; padding: 10px; width: 100px; text-align: center; font-size: 13px; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .btn-start { background: #e94560; color: white; }
  </style>
</head>
<body>
  <header>
    <h2>挑战</h2>
    <a href="/" class="back">返回主页</a>
  </header>

  <div class="level-info">
    <h3>当前关卡：第 {{ level }} 关</h3>
    <p>AI 战斗力：{{ 30 + level }}</p>
  </div>

  <button class="btn btn-start" onclick="startChallenge()">开始挑战</button>
  <div id="result"></div>

  <script>
    async function startChallenge() {
      const res = await fetch('/challenge/start', {method: 'POST'});
      const data = await res.json();
      const resultEl = document.getElementById('result');
      resultEl.innerHTML = `<h3>AI 卡组</h3><div class="cards" id="aiCards"></div>`;
      const container = document.getElementById('aiCards');
      data.ai_cards.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `${c.name}<br>攻${c.atk} 防${c.def}`;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
