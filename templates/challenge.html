<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人挑战 · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 16px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .back-btn { background: white; color: #4a90d9; padding: 8px 14px;
                border-radius: 8px; text-decoration: none; font-size: 14px; }
    .panel { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .panel h3 { margin-top: 0; }
    .level-row { font-size: 16px; margin-bottom: 8px; }
    .level-row .num { color: #4a90d9; cursor: pointer; text-decoration: underline; }
    .win-loss { font-size: 14px; color: #aaa; }
    .cards { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .card { background: #0f3460; border-radius: 8px; padding: 10px; width: 100px;
            text-align: center; font-size: 13px; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .btn-start { background: #4a90d9; color: white; }
    .btn-start:disabled { background: #444; color: #888; cursor: not-allowed; }
    .btn-edit { background: #0f3460; color: #eee; }
    .btn-green { background: #4ecca3; color: #1a1a2e; }
    .picker { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
              background: rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; }
    .picker.active { display: block; }
    .picker-inner { max-width: 700px; margin: 20px auto; padding: 16px; }
    .picker .sort-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .picker .sort-bar button { padding: 6px 12px; border-radius: 6px; border: none;
                                background: #0f3460; color: #eee; cursor: pointer; }
    .picker .sort-bar button.active { background: #4a90d9; color: white; }
    .picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .picker .grid .card { background: #16213e; border-radius: 8px; padding: 6px;
                          text-align: center; cursor: pointer; }
    .picker .grid .card img { width: 100%; border-radius: 4px; }
    .lvl-picker { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                  background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
    .lvl-picker.active { display: flex; }
    .lvl-picker-content { background: #16213e; border-radius: 12px; padding: 24px; max-width: 400px;
                          width: 90%; max-height: 70vh; overflow-y: auto; }
    .lvl-picker-content .lvl { padding: 10px; border-bottom: 1px solid #0f3460; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <span class="page-name">个人挑战</span>
    <a href="/" class="back-btn">返回主页</a>
  </div>

  <div class="panel">
    <div class="level-row">
      当前关卡：<span class="num" onclick="openLevelPicker()">{{ level }}</span>
    </div>
    <div class="win-loss">
      胜利次数：{{ wins }} · 失败次数：{{ losses }}
    </div>
  </div>

  <div class="panel">
    <h3>我的卡组</h3>
    <div class="cards" id="deckCards"></div>
    <button class="btn btn-edit" onclick="editDeck()">编辑卡组</button>
  </div>

  <div class="panel">
    <button class="btn btn-start" id="startBtn" onclick="startChallenge()" disabled>开始挑战</button>
  </div>

  <div class="lvl-picker" id="lvlPicker">
    <div class="lvl-picker-content" id="lvlPickerContent"></div>
  </div>

  <div class="picker" id="picker">
    <div class="picker-inner">
      <div class="sort-bar">
        <button class="active" onclick="sortBy('rank', this)">名次</button>
        <button onclick="sortBy('lead', this)">统率</button>
        <button onclick="sortBy('might', this)">武力</button>
        <button onclick="sortBy('intel', this)">智力</button>
        <button onclick="sortBy('politics', this)">政治</button>
        <button onclick="sortBy('charm', this)">魅力</button>
      </div>
      <div class="grid" id="pickerGrid"></div>
      <button class="btn btn-green" onclick="confirmPick()">确定</button>
      <button class="btn" onclick="closePicker()">取消</button>
    </div>
  </div>

  <script>
    const ownedCards = {{ cards | tojson }};
    let deck = {{ deck | tojson }};
    let selectedCards = [];
    let sortKey = 'rank';

    function renderDeck() {
      const el = document.getElementById('deckCards');
      el.innerHTML = '';
      deck.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `${c.name}<br>攻${c.atk} 防${c.def}`;
        el.appendChild(div);
      });
      document.getElementById('startBtn').disabled = deck.length === 0;
    }

    function openLevelPicker() {
      const picker = document.getElementById('lvlPicker');
      const content = document.getElementById('lvlPickerContent');
      content.innerHTML = '';
      for (let i = 1; i <= {{ level }}; i++) {
        const div = document.createElement('div');
        div.className = 'lvl';
        div.textContent = '第 ' + i + ' 关';
        div.onclick = () => { window.location.href = '/challenge?level=' + i; };
        content.appendChild(div);
      }
      picker.classList.add('active');
    }

    function editDeck() {
      selectedCards = [...deck];
      renderPicker();
      document.getElementById('picker').classList.add('active');
    }

    function closePicker() {
      document.getElementById('picker').classList.remove('active');
    }

    function sortBy(key, btn) {
      sortKey = key;
      document.querySelectorAll('.sort-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPicker();
    }

    function renderPicker() {
      const grid = document.getElementById('pickerGrid');
      const sorted = [...ownedCards].sort((a, b) => {
        if (sortKey === 'rank') return a.id - b.id;
        return b[sortKey] - a[sortKey];
      });
      grid.innerHTML = '';
      sorted.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        if (selectedCards.find(x => x.id === c.id)) {
          div.style.border = '2px solid #4ecca3';
        }
        div.innerHTML = `<img src="/static/cards/${c.name}.png"><div>${c.name}</div>`;
        div.onclick = () => {
          if (selectedCards.find(x => x.id === c.id)) {
            selectedCards = selectedCards.filter(x => x.id !== c.id);
          } else if (selectedCards.length < 6) {
            selectedCards.push(c);
          }
          renderPicker();
        };
        grid.appendChild(div);
      });
    }

    async function confirmPick() {
      deck = [...selectedCards];
      await fetch('/challenge/deck/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cards: deck.map(c => c.id)})
      });
      closePicker();
      renderDeck();
    }

    async function startChallenge() {
      const res = await fetch('/challenge/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({level: {{ level }}, deck: deck.map(c => c.id)})
      });
      const data = await res.json();
      window.location.href = '/challenge/battle';
    }

    renderDeck();
  </script>
</body>
</html>
