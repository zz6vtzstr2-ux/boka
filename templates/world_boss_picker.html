<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择出战英雄 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 16px 16px 120px 16px;
      min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .title-block .page-name {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 4px;
      text-indent: 4px;
    }
    .title-block .en {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .cancel-top-btn {
      background: #fce8ec;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #e8c8d0;
      font-size: 15px;
      color: #b85a6a;
      text-decoration: none;
    }
    .cancel-top-btn:hover { background: #f8d8de; }

    .deck-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .deck-name-row label {
      font-size: 14px;
      color: #666;
      white-space: nowrap;
    }
    .deck-name-row input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #d8d0bc;
      background: #fff;
      font-size: 15px;
      font-family: inherit;
    }
    .deck-name-row input:focus { outline: none; border-color: #5bb8e8; }

    .sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .sort-bar button {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      text-indent: 2px;
      color: #4a4a4a;
      border: 1px solid #d8d0bc;
    }
    .sort-bar button.active { box-shadow: inset 0 0 0 3px #5bb8e8; }
    .sort-rank { background: #e8e8e8; }
    .sort-lead { background: #c8e0c8; }
    .sort-might { background: #e8c8b8; }
    .sort-intel { background: #d8c8e8; }
    .sort-politics { background: #f0dcb0; }
    .sort-charm { background: #e8b8c8; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card-wrap {
      position: relative;
      padding-top: 14px;
    }
    .order-mark {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      background: #5bb8e8;
      color: #fff;
      border: 1px solid #4aa8d8;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 14px;
      border-radius: 10px;
      white-space: nowrap;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .card-item {
      cursor: pointer;
      border-radius: 14px;
      overflow: hidden;
      border: 4px double #f0e0a0;
      background: #fffdf5;
      padding: 8px;
      transition: box-shadow 0.15s;
    }
    .card-item.selected { box-shadow: inset 0 0 0 4px #5bb8e8; }

    .card-pair {
      display: flex;
      gap: 6px;
    }
    .card-pair .face {
      flex: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    .card-pair .face img {
      width: 100%;
      display: block;
    }
    .card-pair .back-content {
      padding: 8px;
      font-size: 11px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .back-title {
      display: inline-block;
      background: #fdf6d8;
      color: #8a6d1f;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid #f0e0a0;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 6px;
      align-self: flex-start;
    }
    .back-bio {
      font-size: 10px;
      color: #777;
      line-height: 1.4;
      margin-bottom: 6px;
      max-height: 60px;
      overflow: hidden;
    }
    .attr-bars {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      flex: 1;
    }
    .attr-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      width: 20%;
    }
    .attr-bar .label { font-size: 9px; color: #888; margin-bottom: 2px; }
    .attr-bar .bar-wrap {
      flex: 1;
      width: 10px;
      background: #f5f0e0;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .attr-bar .bar { width: 100%; border-radius: 3px; }
    .attr-bar .value { font-size: 9px; font-weight: bold; color: #555; margin-top: 2px; }
    .b-lead { background: #c8e0c8; }
    .b-might { background: #e8c8b8; }
    .b-intel { background: #d8c8e8; }
    .b-politics { background: #f0dcb0; }
    .b-charm { background: #e8b8c8; }

    .card-item .name {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-top: 6px;
      color: #4a4a4a;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.96);
      border-top: 1px solid #d8d0bc;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
      padding: 14px 16px;
      z-index: 50;
    }
    .bottom-inner {
      max-width: 868px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .selected-count {
      font-size: 14px;
      color: #666;
      white-space: nowrap;
      padding: 0 8px;
    }
    .selected-count b {
      color: #b85a6a;
      font-size: 16px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 4px;
      text-indent: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s;
    }
    .btn-confirm { background: #5bb8e8; color: #fff; box-shadow: 0 2px 6px rgba(91,184,232,0.3); }
    .btn-confirm:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    .btn-confirm:disabled { background: #cccccc; cursor: not-allowed; box-shadow: none; }
    .btn-cancel { background: #fce8ec; color: #b85a6a; border: 1px solid #e8c8d0; flex: 0 0 auto; padding: 14px 24px; }
    .btn-cancel:hover { background: #f8d8de; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 100px;
      background: rgba(44,110,90,0.95);
      color: #fff;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="page-name">选择出战英雄</div>
        <div class="en">Select Heroes</div>
      </div>
      <a href="/world_boss" class="cancel-top-btn">返回</a>
    </div>

    <div class="deck-name-row">
      <label>卡组名：</label>
      <input type="text" id="deckName" value="{{ deck_name }}" placeholder="输入卡组名（可留空）" maxlength="50">
    </div>

    <div class="sort-bar" id="sortBar">
      <button class="sort-rank active" onclick="sortBy('rank', this)">座次</button>
      <button class="sort-lead" onclick="sortBy('lead', this)">统率</button>
      <button class="sort-might" onclick="sortBy('might', this)">武力</button>
      <button class="sort-intel" onclick="sortBy('intel', this)">智力</button>
      <button class="sort-politics" onclick="sortBy('politics', this)">政治</button>
      <button class="sort-charm" onclick="sortBy('charm', this)">魅力</button>
    </div>

    <div class="card-grid" id="cardGrid"></div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <button class="btn btn-cancel" onclick="cancelPick()">取消</button>
      <span class="selected-count">已选 <b id="selCount">0</b>/5</span>
      <button class="btn btn-confirm" id="confirmBtn" onclick="confirmPick()" disabled>确定</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const ownedCards = {{ cards | tojson }};
    const initialSelected = {{ selected_ids | tojson }};
    const deckId = "{{ deck_id }}";
    let selectedCards = [];
    let sortKey = 'rank';

    // 初始化已选
    initialSelected.forEach(id => {
      const c = ownedCards.find(x => x.id === id);
      if (c) selectedCards.push(c);
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    function updateCount() {
      document.getElementById('selCount').textContent = selectedCards.length;
      document.getElementById('confirmBtn').disabled = selectedCards.length === 0;
    }

    function sortBy(key, btn) {
      sortKey = key;
      document.querySelectorAll('#sortBar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('cardGrid');
      const sorted = [...ownedCards].sort((a, b) => {
        if (sortKey === 'rank') return a.id - b.id;
        return b[sortKey] - a[sortKey];
      });
      grid.innerHTML = '';
      sorted.forEach(c => {
        const order = selectedCards.findIndex(x => x.id === c.id);
        const isSelected = order >= 0;
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrap';
        const div = document.createElement('div');
        div.className = 'card-item' + (isSelected ? ' selected' : '');
        const maxAttr = 100;
        div.innerHTML = `
          <div class="card-pair">
            <div class="face">
              <img loading="lazy" src="/static/cards/${c.name}.PNG" alt="${c.name}">
            </div>
            <div class="face back-content">
              <div class="back-title">人物简介</div>
              <div class="back-bio">${c.info || ''}</div>
              <div class="attr-bars">
                <div class="attr-bar">
                  <div class="label">统率</div>
                  <div class="bar-wrap"><div class="bar b-lead" style="height:${c.lead/maxAttr*100}%"></div></div>
                  <div class="value">${c.lead}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">武力</div>
                  <div class="bar-wrap"><div class="bar b-might" style="height:${c.might/maxAttr*100}%"></div></div>
                  <div class="value">${c.might}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">智力</div>
                  <div class="bar-wrap"><div class="bar b-intel" style="height:${c.intel/maxAttr*100}%"></div></div>
                  <div class="value">${c.intel}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">政治</div>
                  <div class="bar-wrap"><div class="bar b-politics" style="height:${c.politics/maxAttr*100}%"></div></div>
                  <div class="value">${c.politics}</div>
                </div>
                <div class="attr-bar">
                  <div class="label">魅力</div>
                  <div class="bar-wrap"><div class="bar b-charm" style="height:${c.charm/maxAttr*100}%"></div></div>
                  <div class="value">${c.charm}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="name">${c.nick}·${c.name}</div>
        `;
        div.onclick = () => {
          const idx = selectedCards.findIndex(x => x.id === c.id);
          if (idx >= 0) {
            selectedCards.splice(idx, 1);
          } else {
            if (selectedCards.length >= 5) { showToast('最多选择 5 张'); return; }
            selectedCards.push(c);
          }
          updateCount();
          renderGrid();
        };
        wrapper.appendChild(div);
        if (isSelected) {
          const mark = document.createElement('div');
          mark.className = 'order-mark';
          mark.textContent = `出战中 · 第${order + 1}位`;
          wrapper.appendChild(mark);
        }
        grid.appendChild(wrapper);
      });
    }

    async function confirmPick() {
      if (selectedCards.length === 0) { showToast('请至少选 1 张卡'); return; }
      const name = document.getElementById('deckName').value.trim();
      const res = await fetch('/world_boss/deck/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          deck_id: deckId || null,
          card_ids: selectedCards.map(c => c.id),
          name: name,
        })
      });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      window.location.href = '/world_boss';
    }

    function cancelPick() {
      window.location.href = '/world_boss';
    }

    updateCount();
    renderGrid();
  </script>
</body>
</html>
