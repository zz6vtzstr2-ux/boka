<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ profile_user.nickname or profile_user.username }} 的资料</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* 顶部用户信息栏（无白底） */
    .user-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 10px 16px;
    }
    .user-bar img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 2px solid #d8d0bc;
      background: #fff;
      object-fit: cover;
    }
    .user-bar .nickname {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 1px;
      margin-right: 12px;
    }
    .score-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0ece1;
      border: 1px solid #d8d0bc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }
    .score-capsule .swords { font-size: 20px; color: #666; }

    /* 白色卡片板块 */
    .panel {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    /* ★ 核心改动：标题行使用 flex 布局，让文字排在标题右侧 */
    .panel-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .panel-title {
      display: inline-block;
      background: #fdf6d8;
      color: #8a6d1f;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #f0e0a0;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      text-indent: 3px;
      margin: 0; /* 取消底边距，靠父级 flex 对齐 */
    }
    .honor-text {
      font-size: 15px;
      color: #4a4a4a;
      font-weight: bold;
      white-space: nowrap;
    }

    /* 奖杯列表 */
    .trophies-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .trophy-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .trophy-icon {
      font-size: 36px;
      line-height: 1;
    }
    .trophy-date {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* 数据胶囊 */
    .data-btns {
      display: flex;
      gap: 12px;
    }
    .data-btn {
      flex: 1;
      padding: 12px 0;
      background: #f9f5e8;
      border: 1px solid #e0d8c0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #4a4a4a;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .data-btn:hover, .data-btn:active {
      background: #5bb8e8;
      color: #fff;
      border-color: #5bb8e8;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 头像区 -->
    <div class="user-bar">
      <img src="/static/avatars/{{ profile_user.username }}.jpg" onerror="this.src='/static/avatars/default.jpg'">
      <div class="nickname">{{ profile_user.nickname or profile_user.username }}</div>
      <div class="score-capsule">
        <span class="swords">⚔️</span>
        <span>{{ score }}</span>
      </div>
    </div>

    <!-- 荣誉区 -->
    <div class="panel">
      <!-- ★ 把标题和文字放进同一个 flex 容器 -->
      <div class="panel-header-row">
        <div class="panel-title" style="margin-bottom: 0;">玩家荣誉</div>
        <div class="honor-text">搏卡月度冠军 × {{ trophies|length }}</div>
      </div>
      
      <div class="trophies-wrap">
        {% for t in trophies %}
          <div class="trophy-item">
            <div class="trophy-icon">🏆</div>
            <div class="trophy-date">{{ t }}</div>
          </div>
        {% endfor %}
      </div>
    </div>

    <!-- 数据区 -->
    <div class="panel">
      <div class="panel-title">玩家数据</div>
      <div class="data-btns">
        <a href="/boka" class="data-btn">搏卡</a>
        <a href="/challenge" class="data-btn">个人挑战</a>
        <a href="/world_boss" class="data-btn">世界Boss</a>
      </div>
    </div>
    
  </div>
</body>
</html>
