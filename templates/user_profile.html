<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ profile_user.nickname or profile_user.username }} 的资料</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .panel {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .panel-title {
      display: inline-block;
      background: #fdf6d8;
      color: #8a6d1f;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #f0e0a0;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      text-indent: 3px;
      margin-bottom: 16px;
    }

    /* 第一行：头像、昵称、双剑、积分 */
    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8e0cc;
      margin-bottom: 16px;
    }
    .profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-left img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      border: 2px solid #d8d0bc;
      background: #fff;
      object-fit: cover;
    }
    .profile-left .info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .profile-left .nickname {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
    }
    .profile-left .score-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 16px;
      font-weight: bold;
      color: #b85a6a;
    }
    /* 双剑图标 */
    .swords-icon {
      font-size: 18px;
      color: #5bb8e8;
      margin-right: 4px;
    }

    /* 荣誉板 */
    .trophy-container {
      text-align: center;
      margin-top: 10px;
    }
    .trophy-item {
      display: inline-block;
      margin: 0 10px;
    }
    .trophy-icon {
      font-size: 36px;
      line-height: 1;
    }
    .trophy-text {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* 数据按钮区 */
    .data-btns {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .data-btn {
      flex: 1;
      padding: 12px;
      background: #f9f5e8;
      border: 1px solid #e0d8c0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #4a4a4a;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .data-btn:hover {
      background: #fdf6d8;
      color: #8a6d1f;
    }

    /* 底部返回按钮 */
    .back-btn {
      display: inline-block;
      background: #fce8ec;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #e8c8d0;
      font-size: 15px;
      color: #b85a6a;
      text-decoration: none;
      margin-bottom: 16px;
    }
    .back-btn:hover { background: #f8d8de; }
  </style>
</head>
<body>
  <div class="container">
    <a href="javascript:history.back()" class="back-btn">返回上一页</a>

    <!-- 第一大块：玩家信息 + 荣誉 -->
    <div class="panel">
      <!-- 第一行 -->
      <div class="profile-header">
        <div class="profile-left">
          <img src="/static/avatars/{{ profile_user.username }}.jpg" onerror="this.src='/static/avatars/default.jpg'">
          <div class="info">
            <div class="nickname">{{ profile_user.nickname or profile_user.username }}</div>
            <!-- 双剑图标可以用 ⚔️，积分跟主页样式一致 -->
            <div class="score-row">
              <span class="swords-icon">⚔️</span>
              {{ score }} 分
            </div>
          </div>
        </div>
      </div>

      <div class="panel-title">玩家荣誉</div>
      
      <div class="trophy-container">
        <div class="trophy-item">
          <div class="trophy-icon">🏆</div>
          <div class="trophy-text">搏卡月度冠军 × {{ trophies|length }}</div>
        </div>
      </div>
      
      <!-- 如果有多个奖杯，这里可以循环渲染 -->
      <div style="display:flex; justify-content:center; gap: 20px; margin-top: 16px; flex-wrap: wrap;">
        {% for t in trophies %}
          <div class="trophy-item" style="text-align:center;">
            <div class="trophy-icon">🏆</div>
            <div class="trophy-text">{{ t }}</div>
          </div>
        {% endfor %}
      </div>

    </div>

    <!-- 第二大块：数据 -->
    <div class="panel">
      <div class="panel-title">玩家数据</div>
      <div class="data-btns">
        <a href="/boka" class="data-btn" style="text-decoration:none;">搏卡记录</a>
        <a href="/challenge" class="data-btn" style="text-decoration:none;">个人挑战</a>
        <a href="/world_boss" class="data-btn" style="text-decoration:none;">世界 Boss</a>
      </div>
    </div>
  </div>
</body>
</html>
