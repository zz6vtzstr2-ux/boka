<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ profile_user.nickname or profile_user.username }} 的资料</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    
    .panel {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .panel-title {
      display: inline-block;
      background: #fdf6d8;
      color: #8a6d1f;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #f0e0a0;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      text-indent: 3px;
      margin-bottom: 16px;
    }

    /* 1. 头像和昵称（独立出来，不属于荣誉板块） */
    .user-block {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .user-block img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 2px solid #d8d0bc;
      background: #fff;
      object-fit: cover;
    }
    .user-block .nickname {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 1px;
      margin-right: 12px;
    }
    /* 双剑和积分胶囊（类似主页） */
    .score-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0ece1;
      border: 1px solid #d8d0bc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }
    .score-capsule .swords {
      font-size: 20px;
      color: #666;
    }

    /* 荣誉排版 */
    .honor-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .honor-trophies {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 8px;
    }
    .trophy-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .trophy-icon {
      font-size: 32px;
      line-height: 1;
    }
    .trophy-date {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* 数据胶囊 */
    .data-btns {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .data-btn {
      flex: 1;
      padding: 12px 4px; /* 减小左右内边距以防换行 */
      background: #f9f5e8;
      border: 1px solid #e0d8c0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #4a4a4a;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      white-space: nowrap; /* ★ 强制不换行 */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .data-btn:hover, .data-btn:active {
      background: #5bb8e8;
      color: #fff;
      border-color: #5bb8e8;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 第一块：头像、昵称、积分 (独立板块) -->
    <div class="user-block">
      <img src="/static/avatars/{{ profile_user.username }}.jpg" onerror="this.src='/static/avatars/default.jpg'">
      <div class="nickname">{{ profile_user.nickname or profile_user.username }}</div>
      
      <div class="score-capsule">
        <span class="swords">⚔️</span>
        <span>{{ score }}</span>
      </div>
    </div>

    <!-- 第二块：玩家荣誉 -->
    <div class="panel">
      <div class="honor-row">
        <div class="panel-title" style="margin-bottom: 0;">玩家荣誉</div>
        
        <!-- 循环渲染奖杯 -->
        <div class="honor-trophies">
          {% for t in trophies %}
            <div class="trophy-item">
              <div class="trophy-icon">🏆</div>
              <div class="trophy-date">{{ t }}</div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- 第三块：玩家数据 -->
    <div class="panel">
      <div class="panel-title">玩家数据</div>
      <div class="data-btns">
        <a href="/boka" class="data-btn">搏卡</a>
        <a href="/challenge" class="data-btn">个人挑战</a>
        <a href="/world_boss" class="data-btn">世界Boss</a>
      </div>
    </div>
    
  </div>
</body>
</html>
