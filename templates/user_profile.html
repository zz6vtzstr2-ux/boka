<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玩家资料 · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 16px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .back-btn { background: white; color: #4a90d9; padding: 8px 14px;
                border-radius: 8px; text-decoration: none; font-size: 14px; }
    .panel { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .panel h3 { margin-top: 0; }
    .trophy { display: inline-block; text-align: center; margin: 8px; }
    .trophy .icon { font-size: 32px; }
    .trophy .month { font-size: 12px; color: #aaa; }
    .data-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .data-tabs button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
                        background: #0f3460; color: #eee; }
    .data-tabs button.active { background: #4a90d9; color: white; }
    .data-content { display: none; font-size: 14px; }
    .data-content.active { display: block; }
    .data-content .row { margin: 6px 0; color: #ccc; }
  </style>
</head>
<body>
  <div class="header">
    <span class="page-name">{{ profile_user.nickname or profile_user.username }} 的资料</span>
    <a href="/data" class="back-btn">返回数据页</a>
  </div>

  <div class="panel">
    <h3>荣誉</h3>
    <p>搏卡月度冠军 × {{ trophies|length }} 个</p>
    {% for m in trophies %}
    <div class="trophy">
      <div class="icon">🏆</div>
      <div class="month">{{ m }}</div>
    </div>
    {% endfor %}
  </div>

  <div class="panel">
    <h3>数据</h3>
    <div class="data-tabs">
      <button onclick="showData('boka', this)">搏卡</button>
      <button onclick="showData('challenge', this)">个人挑战</button>
      <button onclick="showData('boss', this)">世界 Boss</button>
    </div>
    <div class="data-content" id="data-boka">
      <div class="row">平均分：--</div>
      <div class="row">平均排名：--</div>
      <div class="row">平均场次：--</div>
    </div>
    <div class="data-content" id="data-challenge">
      <div class="row">目前关卡：--</div>
      <div class="row">获胜场次：--</div>
      <div class="row">失败场次：--</div>
    </div>
    <div class="data-content" id="data-boss">
      <div class="row">平均伤害：--</div>
      <div class="row">平均排名：--</div>
    </div>
  </div>

  <script>
    function showData(key, btn) {
      document.querySelectorAll('.data-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.data-content').forEach(d => d.classList.remove('active'));
      document.getElementById('data-' + key).classList.add('active');
    }
  </script>
</body>
</html>
