<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 搏卡游戏</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
           background: #ffffff; color: #333;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #f9f9f9; padding: 40px; border-radius: 12px; width: 300px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    h1 { font-size: 20px; margin-top: 0; text-align: center; color: #4a90d9; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;
            border: 1px solid #ddd; background: #fff; color: #333; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 12px; border: none; border-radius: 6px;
             background: #4a90d9; color: white; font-size: 16px; cursor: pointer; }
    .error { color: #d9534f; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="box">
    <h1>搏卡游戏</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input name="username" placeholder="账号" required>
      <input name="password" type="password" placeholder="密码" required>
      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
