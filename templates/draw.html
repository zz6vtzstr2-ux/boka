<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽卡 · 搏卡游戏</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
           background: #f2f0e8; color: #333; max-width: 900px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .title-block h1 { font-size: 28px; margin: 0; color: #2c3e50; font-weight: bold; }
    .title-block p { font-size: 13px; color: #888; margin: 4px 0 0; }
    .user-block { display: flex; align-items: center; gap: 10px; }
    .user-block img { width: 48px; height: 48px; border-radius: 8px; border: 2px solid #d8d0bc; }
    .user-block .money { background: #fff; padding: 6px 14px; border-radius: 20px;
                         border: 1px solid #e0d8c0; font-size: 14px; display: flex; align-items: center; gap: 4px; }
    .coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; }
    .coin-gold { background: #e8c97b; border: 1px solid #d4a86b; }
    .user-block .link { background: #fff; padding: 6px 14px; border-radius: 8px;
                        border: 1px solid #e0d8c0; font-size: 14px; color: #555; text-decoration: none; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .nav-tabs { display: flex; gap: 0; background: #fff; border-radius: 10px;
                border: 1px solid #e0d8c0; overflow: hidden; }
    .nav-tabs a { padding: 10px 24px; text-decoration: none; color: #555; font-size: 14px;
                  border-right: 1px solid #e0d8c0; }
    .nav-tabs a:last-child { border-right: none; }
    .nav-tabs a.active { background: #2c6e5a; color: white; }
    .back-btn { background: #fff; padding: 10px 18px; border-radius: 8px;
                border: 1px solid #e0d8c0; text-decoration: none; color: #555; font-size: 14px; }
    .banner { background: linear-gradient(135deg, #4a3a6e, #6e4a6e); border-radius: 16px;
              padding: 28px; color: white; display: flex; gap: 24px; margin-bottom: 16px; }
    .banner-left { flex: 1; }
    .banner-left .sub { font-size: 12px; letter-spacing: 2px; opacity: 0.7; }
    .banner-left h2 { font-size: 26px; margin: 8px 0; }
    .banner-left p { font-size: 14px; opacity: 0.85; margin: 0; }
    .banner-right { width: 320px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .data-cell { background: rgba(255,255,255,0.12); border-radius: 10px; padding: 12px; }
    .data-cell .label { font-size: 12px; opacity: 0.75; margin-bottom: 6px; }
    .data-cell .value { font-size: 16px; font-weight: bold; }
    .banner-btns { display: flex; gap: 12px; margin-top: 20px; }
    .banner-btns button { flex: 1; padding: 16px; border: none; border-radius: 10px;
                          font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
    .btn-single { background: #2c6e5a; }
    .btn-single:hover { background: #235a4a; }
    .btn-single:disabled { background: #555; cursor: not-allowed; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .tags span { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 12px; font-size: 12px; }
    .result-area { background: #fff; border: 1px dashed #d8d0bc; border-radius: 12px;
                   padding: 40px; text-align: center; color: #aaa; font-size: 14px; min-height: 200px; }
    .result-area .cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .card { background: #fff; border-radius: 14px; padding: 12px; width: 190px;
            position: relative; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 2px solid #f0ead5; cursor: pointer; transition: transform 0.15s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .card .img-wrap { border-radius: 10px; overflow: hidden; }
    .card .img-wrap img { width: 100%; display: block; }
    .card .info-row { display: flex; justify-content: space-between; align-items: center;
                      margin-top: 10px; padding-top: 8px; border-top: 1px solid #f5f0e0; }
    .card .name { font-size: 13px; font-weight: bold; color: #333; }
    .card .atk-pill, .card .def-pill { display: flex; align-items: center; gap: 2px;
            padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold;
            background: #f5f0e0; }
    .card .atk-pill { color: #c97b7b; }
    .card .def-pill { color: #a0876b; }
    .first-time { position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
                  color: #c97b7b; font-size: 12px; font-weight: bold; white-space: nowrap;
                  background: #fff; padding: 3px 12px; border-radius: 12px;
                  box-shadow: 0 2px 8px rgba(201,123,123,0.2); z-index: 2; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
             background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: #fff; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; }
    .modal-content h3 { margin-top: 0; }
    .bio { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 16px;
           padding-bottom: 16px; border-bottom: 1px solid #f0ead5; }
    .attr-bars { display: flex; justify-content: space-around; align-items: flex-end; height: 140px; }
    .attr-bar { display: flex; flex-direction: column; align-items: center; gap: 6px;
                height: 100%; justify-content: flex-start; }
    .attr-bar .label { font-size: 12px; color: #888; }
    .attr-bar .bar-wrap { flex: 1; display: flex; align-items: flex-end; }
    .attr-bar .bar { width: 22px; border-radius: 6px 6px 0 0; }
    .attr-bar .value { font-size: 12px; font-weight: bold; }
    .b-lead { background: #7ba7cc; }
    .b-might { background: #cc8a8a; }
    .b-intel { background: #a68cc9; }
    .b-politics { background: #8cc9a0; }
    .b-charm { background: #d4a86b; }
    .modal-content .btn-close { margin-top: 20px; padding: 10px; border: none;
                                border-radius: 8px; background: #f5f0e0; color: #4a4a4a;
                                cursor: pointer; font-size: 14px; width: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-block">
      <h1>抽卡</h1>
      <p>每包干脆面可获得一张水浒卡。</p>
    </div>
    <div class="user-block">
      <img src="/static/avatars/{{ nickname }}.JPG" alt="">
      <div class="money"><span id="goldDisplay">{{ gold }}</span><span class="coin coin-gold"></span></div>
      <a href="/profile" class="link">我的资料</a>
      <a href="/logout" class="link">退出登录</a>
    </div>
  </div>

  <div class="nav">
    <div class="nav-tabs">
      <a href="/">家园</a>
      <a href="/collection">图鉴</a>
      <a href="/draw" class="active">抽卡</a>
    </div>
    <a href="/" class="back-btn">返回主页</a>
  </div>

  <div class="banner">
    <div class="banner-left">
      <div class="sub">SUMMON</div>
      <h2>英雄召集</h2>
      <p>每包干脆面可获得一张水浒卡。</p>
      <div class="banner-btns">
        <button class="btn-single" id="drawBtn" onclick="drawCard()">来一包 · 2 金币</button>
      </div>
      <div class="tags">
        <span>108 将等概率</span>
        <span>双黄蛋 2%</span>
        <span>空包 1%</span>
      </div>
    </div>
    <div class="banner-right">
      <div class="data-cell">
        <div class="label">当前金币</div>
        <div class="value">{{ gold }}</div>
      </div>
      <div class="data-cell">
        <div class="label">当前银币</div>
        <div class="value">{{ silver }}</div>
      </div>
      <div class="data-cell">
        <div class="label">当前铜币</div>
        <div class="value">{{ copper }}</div>
      </div>
      <div class="data-cell">
        <div class="label">卡池数量</div>
        <div class="value">108 张</div>
      </div>
    </div>
  </div>

  <div class="result-area" id="result">抽卡结果会显示在这里</div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    let drawing = false;
    let lastCards = [];

    async function drawCard() {
      if (drawing) return;
      drawing = true;
      document.getElementById('drawBtn').disabled = true;

      const res = await fetch('/draw_card', { method: 'POST' });
      const data = await res.json();
      const el = document.getElementById('result');

      if (data.error) {
        el.innerHTML = `<p>${data.error}</p>`;
      } else {
        if (data.gold !== undefined) {
          document.getElementById('goldDisplay').textContent = data.gold;
        }
        if (data.type === 'empty') {
          el.innerHTML = `<p>${data.message}</p>`;
        } else if (data.type === 'double') {
          lastCards = data.cards;
          el.innerHTML = `<p>${data.message}</p><div class="cards">` +
            data.cards.map((c, i) => renderCard(c, i, data.first_time.includes(c.name) && i === 0)).join('') +
            `</div>`;
        } else {
          lastCards = data.cards;
          el.innerHTML = `<div class="cards">` +
            data.cards.map((c, i) => renderCard(c, i, data.first_time.includes(c.name))).join('') +
            `</div>`;
        }
      }

      drawing = false;
      document.getElementById('drawBtn').disabled = false;
    }

    function renderCard(c, index, firstTime) {
      return `
        <div class="card" onclick="openModal(${index})">
          ${firstTime ? '<div class="first-time">首次抽到</div>' : ''}
          <div class="img-wrap">
            <img loading="lazy" src="/static/cards/${c.name}.PNG" alt="${c.name}">
          </div>
          <div class="info-row">
            <span class="atk-pill">🗡️${c.atk}</span>
            <span class="name">${c.nick}·${c.name}</span>
            <span class="def-pill">${c.def}🛡️</span>
          </div>
        </div>
      `;
    }

    function openModal(index) {
      const c = lastCards[index];
      if (!c) return;
      const modal = document.getElementById('modal');
      const content = document.getElementById('modalContent');
      const maxAttr = 100;
      content.innerHTML = `
        <h3>${c.nick}·${c.name}</h3>
        <div class="bio">${c.info || ''}</div>
        <div class="attr-bars">
          <div class="attr-bar">
            <div class="label">统率</div>
            <div class="bar-wrap"><div class="bar b-lead" style="height:${c.lead/maxAttr*100}%"></div></div>
            <div class="value">${c.lead}</div>
          </div>
          <div class="attr-bar">
            <div class="label">武力</div>
            <div class="bar-wrap"><div class="bar b-might" style="height:${c.might/maxAttr*100}%"></div></div>
            <div class="value">${c.might}</div>
          </div>
          <div class="attr-bar">
            <div class="label">智力</div>
            <div class="bar-wrap"><div class="bar b-intel" style="height:${c.intel/maxAttr*100}%"></div></div>
            <div class="value">${c.intel}</div>
          </div>
          <div class="attr-bar">
            <div class="label">政治</div>
            <div class="bar-wrap"><div class="bar b-politics" style="height:${c.politics/maxAttr*100}%"></div></div>
            <div class="value">${c.politics}</div>
          </div>
          <div class="attr-bar">
            <div class="label">魅力</div>
            <div class="bar-wrap"><div class="bar b-charm" style="height:${c.charm/maxAttr*100}%"></div></div>
            <div class="value">${c.charm}</div>
          </div>
        </div>
        <button class="btn-close" onclick="closeModal()">关闭</button>
      `;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
  </script>
</body>
</html>
