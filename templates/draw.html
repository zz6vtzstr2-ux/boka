<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽卡 · 搏卡游戏</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
           max-width: 700px; margin: 0 auto; padding: 16px; text-align: center; }
    .header { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 16px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .back-btn { background: white; color: #4a90d9; padding: 8px 14px;
                border-radius: 8px; text-decoration: none; font-size: 14px; }
    .wallet { display: flex; gap: 8px; justify-content: center;
              font-size: 14px; margin-bottom: 16px; }
    .wallet span { background: #16213e; padding: 6px 12px; border-radius: 6px; }
    .noodle { width: 200px; margin: 20px auto; display: block; }
    .price { font-size: 16px; color: #f5c542; margin: 12px 0; }
    .draw-btn { padding: 14px 40px; border: none; border-radius: 10px;
                background: #4a90d9; color: white; font-size: 18px; cursor: pointer; }
    .draw-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
    .result { margin-top: 20px; }
    .cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .card { background: #16213e; border-radius: 10px; padding: 10px; width: 140px;
            position: relative; }
    .card img { width: 100%; border-radius: 6px; display: block; }
    .card .atk { position: absolute; left: 4px; bottom: 4px; font-size: 13px; color: #e94560; }
    .card .def { position: absolute; right: 4px; bottom: 4px; font-size: 13px; color: #4ecca3; }
    .card .name { font-size: 13px; margin-top: 4px; }
    .first-time { position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
                  color: #e94560; font-size: 12px; font-weight: bold; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header">
    <span class="page-name">抽卡</span>
    <a href="/" class="back-btn">返回主页</a>
  </div>

  <div class="wallet">
    <span>🪙 {{ gold }}</span>
    <span>🥈 {{ silver }}</span>
    <span>🥉 {{ copper }}</span>
  </div>

  <img class="noodle" src="/static/images/干脆面.jpg" alt="干脆面">
  <div class="price">2 金币一包</div>
  <button class="draw-btn" id="drawBtn" onclick="drawCard()">来一包</button>
  <div class="result" id="result"></div>

  <script>
    let drawing = false;

    async function drawCard() {
      if (drawing) return;
      drawing = true;
      document.getElementById('drawBtn').disabled = true;

      const res = await fetch('/draw_card', { method: 'POST' });
      const data = await res.json();
      const el = document.getElementById('result');

      if (data.error) {
        el.innerHTML = `<p>${data.error}</p>`;
      } else if (data.type === 'empty') {
        el.innerHTML = `<p>${data.message}</p>`;
      } else if (data.type === 'double') {
        el.innerHTML = `<p>${data.message}</p><div class="cards">` +
          data.cards.map((c, i) => renderCard(c, data.first_time.includes(c.name) && i === 0)).join('') +
          `</div>`;
      } else {
        el.innerHTML = `<div class="cards">` +
          data.cards.map(c => renderCard(c, data.first_time.includes(c.name))).join('') +
          `</div>`;
      }

      drawing = false;
      document.getElementById('drawBtn').disabled = false;
    }

    function renderCard(c, firstTime) {
      return `
        <div class="card">
          ${firstTime ? '<div class="first-time">首次抽到</div>' : ''}
          <img loading="lazy" src="/static/cards/${c.name}.png" alt="${c.name}">
          <div class="atk">🗡️${c.atk}</div>
          <div class="def">🛡️${c.def}</div>
          <div class="name">${c.nick}·${c.name}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
