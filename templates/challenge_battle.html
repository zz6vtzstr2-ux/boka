<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挑战战斗 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      min-height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: radial-gradient(ellipse at center, #f5edda 0%, #d8ccb0 100%) fixed;
      color: #333;
      position: relative;
    }

    .combo-info {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #666;
      padding: 0 8px;
      text-align: center;
      /* 确保没有其他干扰高度或居中的样式 */
    }
    .combo-info .combo-name {
      font-weight: bold;
      color: #8a6d1f;
      letter-spacing: 1px;
    }
    .combo-info .info-pill {
      font-size: 13px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 8px;
      line-height: 1.4;
      white-space: nowrap;
    }
    .combo-info .atk-pill {
      background: #d89050;
      color: #fff;
      box-shadow: 0 1px 3px rgba(138,74,31,0.4);
    }
    .combo-info .def-pill {
      background: #6ba0d0;
      color: #fff;
      box-shadow: 0 1px 3px rgba(42,74,122,0.4);
    }
    .combo-info .combo-error {
      color: #b85a6a;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .top-bar {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(245,237,218,0.92);
      backdrop-filter: blur(6px);
      z-index: 30;
      flex-wrap: wrap;
    }
    .top-left { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .top-right { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .top-btn, .top-info {
      background: rgba(255,255,255,0.95);
      border: 1px solid #d8d0bc;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #4a4a4a;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      white-space: nowrap;
    }
    .top-info { color: #8a6d1f; cursor: default; }
    .top-btn.danger { background: #fce8ec; color: #b85a6a; border-color: #e8c8d0; }

    .arena {
      padding: 0px 12px 0px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0px; /* ★ 间隙从 4px 改为 0，完全靠 margin 控制 */
    }

    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }
    .side .player-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .side .player-head img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid #5bb8e8;
      box-shadow: 0 0 0 3px rgba(91,184,232,0.4);
      background: #fff;
      object-fit: cover;
    }
    .ai-avatar-placeholder {
      height: 40px;
      min-width: 40px;
      border-radius: 10px;
      border: 2px solid #e8c8d0;
      box-shadow: 0 0 0 3px rgba(232,200,208,0.5);
      background: #fce8ec;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #b85a6a;
      letter-spacing: 1px;
      white-space: nowrap;
      padding: 2px 10px;
    }
    .side .pname {
      font-size: 15px;
      font-weight: bold;
      color: #4a4a4a;
      letter-spacing: 1px;
    }
    .side .hand-count {
      font-size: 12px;
      color: #888;
    }

    .played-area {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center; /* 垂直居中，会自动把卡牌往下推 */
      height: 160px;       /* 给足高度，上下留白自然就会居中 */
      padding-top: 20px;   /* ★ 核心：顶部留出 20px 空间，防止星星顶到上面 */
      margin: 0;
    }
    }
    /* 当没牌或者展示问号时，不让内容撑开或收缩 */
    .played-area.empty::before {
      display: none;
    }

    .center-banner {
      /* 前面的字体、背景、颜色等都不变 */
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 6px;
      text-indent: 6px;
      padding: 6px 24px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      white-space: nowrap;
      
      margin: 10px 0 20px 0; /* ★ 增加上下 margin，彻底拉开和卡片的距离 */
    }
    .center-banner.atk {
      background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b);
      border: 2px solid #8a4a1f;
    }
    .center-banner.def {
      background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8);
      border: 2px solid #2a4a7a;
    }

    .hero-card {
      position: relative;
      width: 100px;
      height: 140px;
      flex-shrink: 0;
      transition: box-shadow 0.15s;
    }
    .hero-card .oval-wrap {
      width: 100%;
      height: calc(100% - 22px);
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      overflow: hidden;
      background: #fffdf5;
      border: 4px solid #f0e0a0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      position: relative;
      transition: box-shadow 0.3s, border-color 0.3s, opacity 0.3s;
    }
    .hero-card .oval-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-card .atk-orb,
    .hero-card .def-orb {
      position: absolute;
      bottom: 20px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      z-index: 2;
    }
    .hero-card .atk-orb {
      left: -4px;
      background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b);
      border: 2px solid #8a4a1f;
    }
    .hero-card .def-orb {
      right: -4px;
      background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8);
      border: 2px solid #2a4a7a;
    }
    .hero-card .card-name {
      position: absolute;
      bottom: 10px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #4a4a4a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-card .stars {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      z-index: 3;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    .hero-card.selected .oval-wrap {
      outline: 4px solid #5bb8e8;
      outline-offset: -4px;
      box-shadow: 0 0 0 4px rgba(91,184,232,0.35), 0 3px 8px rgba(0,0,0,0.2);
    }

    .hero-card.winner .oval-wrap {
      border-color: #f5c542;
      box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6);
      animation: winnerBlink 1s ease-in-out 3;
    }
    @keyframes winnerBlink {
      0%, 100% { box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6); }
      50% { box-shadow: 0 0 24px #f5c542, 0 0 48px rgba(245,197,66,0.9); }
    }
    /* ★ 宋江抽卡短暂金框 */
    .hero-card.new-drawn .oval-wrap {
      border-color: #f5c542 !important;
      box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6);
      animation: winnerBlink 1s ease-in-out 3;
    }
    .hero-card.loser .oval-wrap {
      opacity: 0.5;
      filter: grayscale(0.5);
    }

    .qmark-card {
      position: relative;
      width: 100px;
      height: 140px;
      flex-shrink: 0;
    }
    .qmark-card .qmark-wrap {
      width: 100%;
      height: calc(100% - 22px);
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, #3a4a5a, #1a2a3a);
      border: 4px solid #c8b878;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .qmark-card .qmark-wrap::before {
      content: "?";
      font-size: 56px;
      font-weight: bold;
      color: #e8d8a0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      font-family: "LXGW WenKai", serif;
    }

    .bottom-area {
      margin-top: 0; /* ★ 去掉 12px 的外边距 */
      display: flex;
      flex-direction: column;
    }
    .my-hand-area {
      padding: 2px 16px 8px 16px; /* ★ 减少上下 padding */
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.94);
    }
    .hand-label {
      font-size: 12px; /* 跟搏卡一样 12px */
      color: #888;
      letter-spacing: 2px;
      padding-left: 4px;
      margin-bottom: 0;
    }
    .hand-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      justify-content: center;
      padding: 4px 0;
    }
    .ready-row {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 12px 2px 12px; /* ★ 减少上下 padding */
      min-height: 56px;
    }
    .my-avatar-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      width: 64px;
    }
    .my-avatar-block img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid #5bb8e8;
      box-shadow: 0 0 0 3px rgba(91,184,232,0.4);
      background: #fff;
      object-fit: cover;
    }
    .my-avatar-block .pname {
      font-size: 14px; /* ★ 从 11px 放大到 14px */
      font-weight: bold;
      color: #4a4a4a;
      text-align: center;
      max-width: 64px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }
    .my-avatar-block .hand-count {
      font-size: 10px;
      color: #888;
      white-space: nowrap;
    }
    .play-square-btn {
      flex-shrink: 0;
      width: 64px;
      border: none;
      border-radius: 12px;
      background: #5bb8e8;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .play-square-btn:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    .play-square-btn:disabled {
      background: #cccccc !important;
      color: #fff !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .played-area { min-height: 130px; }
      .my-avatar-block { width: 56px; }
      .my-avatar-block img { width: 40px; height: 40px; }
      .my-avatar-block .pname { font-size: 14px; max-width: 56px; }
      .my-avatar-block .hand-count { font-size: 9px; }
      .play-square-btn { width: 56px; height: 56px; font-size: 13px; }
    }

    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .result-modal.active { display: flex; }
    .result-inner {
      background: #fffdf5;
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 4px double #f0e0a0;
      text-align: center;
    }
    .result-inner h2 {
      margin: 0 0 16px 0;
      color: #8a6d1f;
      letter-spacing: 3px;
    }
    .result-inner .rl {
      font-size: 15px;
      color: #555;
      margin-bottom: 10px;
    }
    .result-inner .rm {
      font-size: 22px;
      font-weight: bold;
      color: #b85a6a;
      margin-bottom: 18px;
    }
    .result-ok {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5bb8e8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 3px;
    }

    /* ===== 记录弹窗 ===== */
    .record-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 400;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .record-modal.active { display: flex; }
    .record-inner {
      background: #fffdf5;
      border-radius: 16px;
      padding: 18px;
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 4px double #f0e0a0;
    }
    .record-inner h3 {
      margin: 0 0 12px 0;
      color: #8a6d1f;
      letter-spacing: 2px;
    }
    .record-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .record-table th,
    .record-table td {
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid #e8e0cc;
    }
    .record-table th {
      color: #8a6d1f;
      font-weight: bold;
      background: #fdf6d8;
    }
    .record-table tr:last-child td { border-bottom: none; }
    .record-table .r-win { color: #5cb85c; font-weight: bold; }
    .record-table .r-lose { color: #d9534f; font-weight: bold; }
    .record-table .r-draw { color: #999; font-weight: bold; }
    .record-close {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5bb8e8;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      margin-top: 14px;
    }

    .toast {
      position: fixed; top: 88%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(44,110,90,0.95); color: #fff;
      padding: 14px 24px; border-radius: 14px; font-size: 15px;
      font-weight: bold; opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .result-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .result-title-row h2 {
      margin: 0;
    }
    .result-record-btn {
      background: #f9f5e8;
      border: 1px solid #d8d0bc;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      color: #8a6d1f;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }
    .result-record-btn:hover { background: #f0e8d0; }

    /* ===== 退出确认弹窗 ===== */
    .confirm-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 400;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .confirm-modal.active { display: flex; }
    .confirm-inner {
      background: #fffdf5;
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 4px double #f0e0a0;
      text-align: center;
      animation: confirmPop 0.18s ease-out;
    }
    @keyframes confirmPop {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .confirm-inner h3 {
      margin: 0 0 14px 0;
      color: #8a6d1f;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    .confirm-inner .confirm-msg {
      font-size: 15px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    .confirm-btns {
      display: flex;
      gap: 10px;
    }
    .confirm-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 2px;
      transition: transform 0.15s, background 0.15s;
    }
    .confirm-btn:hover { transform: translateY(-1px); }
    .confirm-btn.confirm-primary {
      background: #5bb8e8;
      color: #fff;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3);
    }
    .confirm-btn.confirm-primary:hover { background: #4aa8d8; }
    .confirm-btn.confirm-secondary {
      background: #fce8ec;
      color: #b85a6a;
      border: 1px solid #e8c8d0;
    }
    .confirm-btn.confirm-secondary:hover { background: #f8d8de; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-left">
      <div class="top-info" id="roundInfo">第 1 轮</div>
      <div class="top-info" id="poolInfo">卡袋 0</div>
      <button class="top-btn" onclick="showRecord()">记录</button>
    </div>
    <div class="top-right">
      <button class="top-btn danger" onclick="quitGame()">退出</button>
    </div>
  </div>

  <div class="arena">
    <div class="side ai">
      <div class="player-head">
        <div class="ai-avatar-placeholder">第{{ level }}关</div>
        <div>
          <div class="pname">电脑</div>
          <div class="hand-count">手牌 <span id="aiHandCount">6</span></div>
        </div>
      </div>
      <div class="played-area empty" id="aiPlayed"></div>
    </div>

    <div class="center-banner atk" id="centerBanner">本轮比攻</div>

    <div class="side me">
      <div class="played-area empty" id="myPlayed"></div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="ready-row">
      <div class="my-avatar-block">
        <img src="/static/avatars/{{ username }}.jpg" alt="">
        <div class="pname">{{ nickname }}</div>
      </div>
      <div class="combo-info" id="comboInfo"></div>
      <button class="play-square-btn" id="playBtn" onclick="submitPlay()" disabled>出战</button>
    </div>
    <div class="my-hand-area">
      <div class="hand-label">手牌 <span id="myHandCount" style="font-weight:bold; color:#b85a6a; font-size:14px;">6</span></div>
      <div class="hand-scroll" id="myHandArea"></div>
    </div>
  </div>

  <div class="result-modal" id="resultModal">
    <div class="result-inner">
      <div class="result-title-row">
        <h2 id="resultTitle">挑战成功</h2>
        <button class="result-record-btn" onclick="showRecord()">记录</button>
      </div>
      <div class="rl" id="resultLine"></div>
      <div class="rm" id="resultMaterials"></div>
      <button class="result-ok" onclick="confirmResult()">确认</button>
    </div>
  </div>

  <!-- ===== 记录弹窗 ===== -->
  <div class="record-modal" id="recordModal" onclick="if(event.target===this)closeRecord()">
    <div class="record-inner">
      <h3>对局记录</h3>
      <div id="recordContent">暂无对局记录</div>
      <button class="record-close" onclick="closeRecord()">关闭</button>
    </div>
  </div>

  <!-- 宋江抽卡弹窗 -->
  <div class="confirm-modal" id="songjiangModal">
    <div class="confirm-inner">
      <h3>及时雨 · 宋江</h3>
      <div class="confirm-msg">是否抽卡？</div>
      <div class="confirm-btns">
        <button class="confirm-btn confirm-primary" onclick="songjiangChoose(true)">抽卡</button>
        <button class="confirm-btn confirm-secondary" onclick="songjiangChoose(false)">取消</button>
      </div>
    </div>
  </div>

  <!-- 退出确认弹窗 -->
  <div class="confirm-modal" id="confirmModal">
    <div class="confirm-inner">
      <h3>退出挑战</h3>
      <div class="confirm-msg" id="confirmMsg"></div>
      <div class="confirm-btns">
        <button class="confirm-btn confirm-secondary" onclick="confirmChoose(true)">退出</button>
        <button class="confirm-btn confirm-primary" onclick="confirmChoose(false)">留下</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const level = {{ level }};
    // ★ 注入时间轴配置
    const TIME_REVEAL = {{ TIME_REVEAL | default(3.0) }};
    const TIME_RESOLVE = {{ TIME_RESOLVE | default(6.0) }};
    const TIME_UPDATE = {{ TIME_UPDATE_CARDS | default(8.0) }};
    let myHand = {{ my_hand | tojson }};
    let myReady = [];
    let locked = false;
    let roundNo = 1;
    let pollTimer = null;
    let lastWinnerCardId = null;
    let shownStep = "idle";
    let shownRound = 0;
    let displayedPoolCount = 0;
    let lastHistory = [];
    let poolCount = 0;
    let songjiangShownForCurrentSelection = false;
    let songjiangResolver = null;
    let songjiangShowTimer = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    let confirmResolver = null;
    function showConfirm(message) {
      document.getElementById('confirmMsg').textContent = message;
      document.getElementById('confirmModal').classList.add('active');
      return new Promise(resolve => { confirmResolver = resolve; });
    }
    function confirmChoose(ok) {
      document.getElementById('confirmModal').classList.remove('active');
      if (confirmResolver) {
        confirmResolver(ok);
        confirmResolver = null;
      }
    }

    function levelToQuality(level) {
      if (level <= 5) return "#d0d0d0";
      if (level <= 10) return "#5cb85c";
      if (level <= 15) return "#4a90d9";
      if (level <= 20) return "#a06cd5";
      return "#f5a623";
    }
    function levelToStars(level) {
      return ((level - 1) % 5) + 1;
    }

    function makeHeroCard(c, extraCls) {
      const lv = c.level || 1;
      const atk = c.atk;
      const def = c.def;
      const borderColor = levelToQuality(lv);
      const stars = levelToStars(lv);
      const div = document.createElement('div');
      div.className = 'hero-card ' + (extraCls || '');
      div.innerHTML = `
        <div class="stars" style="color:${borderColor};">${'★'.repeat(stars)}</div>
        <div class="oval-wrap" style="border-color:${borderColor};">
          <img src="/static/cards/${c.name}.PNG" alt="${c.name}">
        </div>
        <div class="atk-orb">${atk}</div>
        <div class="def-orb">${def}</div>
        <div class="card-name">${c.name}</div>
      `;
      return div;
    }

    function makeQmarkCard() {
      const div = document.createElement('div');
      div.className = 'qmark-card';
      div.innerHTML = `<div class="qmark-wrap"></div>`;
      return div;
    }

    function renderHand() {
      const handEl = document.getElementById('myHandArea');
      handEl.innerHTML = '';
      myHand.forEach(c => {
        const isSelected = myReady.find(x => x.id === c.id);
        // ★ 加上这段判断
        let extraCls = isSelected ? 'selected ' : '';
        if (window.newDrawnCards && window.newDrawnCards.has(c.id)) {
          extraCls += 'new-drawn';
        }
        
        const d = makeHeroCard(c, extraCls); // 注意这里传 extraCls
        if (!locked) {
          // ... 后面原本的点击逻辑保持不变
          d.onclick = () => {
            if (locked) return;
            const idx = myReady.findIndex(x => x.id === c.id);
            if (idx >= 0) {
              myReady.splice(idx, 1);
            } else {
              myReady.push(c);
            }
            songjiangShownForCurrentSelection = false;
            renderHand();
            
            // ★ 瞬间更新 UI 和按钮
            updateComboInfo(); 
            
            checkSongjiangTrigger();
          };
        }
        handEl.appendChild(d);
      });
      document.getElementById('myHandCount').textContent = myHand.length;
    }

    function updatePlayBtn() {
      const btn = document.getElementById('playBtn');
      btn.disabled = locked || myReady.length === 0 || !lastComboValid;
      btn.textContent = locked ? '锁定' : '出战';
    }

    function checkSongjiangTrigger() {
      if (myReady.length !== 1) return;
      if (myReady[0].name !== '宋江') return;
      if (songjiangShownForCurrentSelection) return;
      if (poolCount <= 0) return;
      songjiangShownForCurrentSelection = true;
      document.getElementById('songjiangModal').classList.add('active');
      songjiangResolver = null;
    }

    async function songjiangChoose(ok) {
      document.getElementById('songjiangModal').classList.remove('active');
      if (!ok) return;

      const res = await fetch('/challenge/songjiang_draw', { method: 'POST' });
      const data = await res.json();
      if (data.error) {
        showToast(data.error);
        return;
      }

      // 1. 在亮卡区展示宋江 2 秒（金边）
      const songjiangCard = myHand.find(c => c.name === '宋江');
      if (songjiangCard) {
        renderPlayed([songjiangCard], [], "face", [songjiangCard.id], false);
        if (songjiangShowTimer) clearTimeout(songjiangShowTimer);
        songjiangShowTimer = setTimeout(() => {
          renderPlayed([], [], "idle", null);
          songjiangShowTimer = null;
        }, 2000);
      }

      myReady = [];
      songjiangShownForCurrentSelection = false;

      // 2. 拉取最新手牌状态
      const stateRes = await fetch('/challenge/state?level=' + level);
      const state = await stateRes.json();
      if (!state.error) {
        myHand = state.my_hand || [];
        
        // 3. ★ 处理抽到新卡的 3 秒金色呼吸特效
        if (data.picked_id) {
          // 初始化全局 Set（用于存放需要闪烁的卡牌 ID）
          if (!window.newDrawnCards) window.newDrawnCards = new Set();
          window.newDrawnCards.add(data.picked_id);
          
          // 3 秒后自动移除并重绘
          setTimeout(() => {
            if (window.newDrawnCards) {
              window.newDrawnCards.delete(data.picked_id);
              renderHand(); // 重绘，取消金框
            }
          }, 3000);
        }

        document.getElementById('myHandCount').textContent = state.my_hand_count || 0;
        document.getElementById('aiHandCount').textContent = state.ai_hand_count || 0;
        poolCount = state.card_pool_count || 0;
        document.getElementById('poolInfo').textContent = '卡袋 ' + poolCount;
      }

      // 4. 重新渲染 UI
      renderHand();
      updateComboInfo();
      updatePlayBtn();
    }

    function renderPlayed(myCards, aiCards, step, winnerIds, allLoser) {
      const myEl = document.getElementById('myPlayed');
      const aiEl = document.getElementById('aiPlayed');
      myEl.innerHTML = '';
      aiEl.innerHTML = '';

      if (step === "idle") {
        myEl.classList.add('empty');
        aiEl.classList.add('empty');
        return;
      }
      if (step === "my_qmark") {
        myEl.classList.remove('empty');
        myEl.appendChild(makeQmarkCard());
        aiEl.classList.add('empty');
        return;
      }
      if (step === "both_qmark") {
        myEl.classList.remove('empty');
        myEl.appendChild(makeQmarkCard());
        aiEl.classList.remove('empty');
        aiEl.appendChild(makeQmarkCard());
        return;
      }
      if (step === "face" || step === "result") {
        const winSet = new Set(winnerIds || []);
        myEl.classList.toggle('empty', myCards.length === 0);
        aiEl.classList.toggle('empty', aiCards.length === 0);
        myCards.forEach(c => {
          let cls = '';
          if (step === "result") {
            if (allLoser) {
              cls = 'loser';
            } else if (winSet.size > 0) {
              cls = winSet.has(c.id) ? 'winner' : 'loser';
            }
          }
          myEl.appendChild(makeHeroCard(c, cls));
        });
        aiCards.forEach(c => {
          let cls = '';
          if (step === "result") {
            if (allLoser) {
              cls = 'loser';
            } else if (winSet.size > 0) {
              cls = winSet.has(c.id) ? 'winner' : 'loser';
            }
          }
          aiEl.appendChild(makeHeroCard(c, cls));
        });
      }
    }

    let lastComboValid = true;

    // ★ 纯前端本地计算，0 网络请求，瞬间亮起
    function updateComboInfo() {
      if (locked) return;
      const infoEl = document.getElementById('comboInfo');
      if (!infoEl) return;

      if (myReady.length === 0) {
        // 挑战页原本是 infoEl.innerHTML = ''; 现在改成这样：
        infoEl.innerHTML = '请选择卡牌'; 
        lastComboValid = true;
        updatePlayBtn();
        return;
      }

      const names = myReady.map(c => c.name);
      let html = '';
      let isValid = true;

      // 1 张卡
      if (myReady.length === 1) {
        const c = myReady[0];
        if (c.name === '扈三娘') {
          html = `<span class="combo-name">美女</span>`;
        } else if (['白胜', '孙二娘'].includes(c.name)) {
          html = `<span class="combo-name">炸弹</span>`;
        } else if (['林冲', '柴进', '燕青', '花荣', '徐宁'].includes(c.name)) {
          html = `<span class="combo-name">帅哥</span>`;
        }
      } 
      // 多张卡
      else {
        // 双炸
        if (names.includes('白胜') && names.includes('孙二娘') && names.length === 2) {
          html = `<span class="combo-name">双炸</span>`;
        }
        // 智多星
        else if (names.includes('吴用') && names.length === 2) {
          const other = myReady.find(c => c.name !== '吴用');
          if (['林冲', '柴进', '燕青', '花荣', '徐宁'].includes(other.name)) {
            html = `<span class="combo-name">智多星 帅哥</span>`;
          } else if (!['扈三娘', '白胜', '孙二娘', '宋江'].includes(other.name)) {
            html = `<span class="combo-name">智多星</span>`;
          } else {
            isValid = false;
          }
        }
        // 五虎将
        else if (['关胜', '林冲', '秦明', '呼延灼', '董平'].every(n => names.includes(n)) && names.length === 5) {
          html = `<span class="combo-name">五虎将</span>`;
        }
        // 八虎骑
        else if (['花荣', '徐宁', '杨志', '索超', '张清', '朱仝', '史进', '穆弘'].every(n => names.includes(n)) && names.length === 8) {
          html = `<span class="combo-name">八虎骑</span>`;
        }
        // 风流威猛
        else if (names.length === 2 && names.includes('花荣') && names.includes('徐宁')) {
          html = `<span class="combo-name">风流威猛</span>`;
        }
        // 水军三兄弟
        else if (names.length === 3 && names.includes('阮小二') && names.includes('阮小五') && names.includes('阮小七')) {
          html = `<span class="combo-name">水军三兄弟</span>`;
        }
        // 黑白双煞
        else if (names.length === 2 && names.includes('张顺') && names.includes('李逵')) {
          html = `<span class="combo-name">黑白双煞</span>`;
        }
        // 打猎兄弟
        else if (names.length === 2 && names.includes('解珍') && names.includes('解宝')) {
          html = `<span class="combo-name">打猎兄弟</span>`;
        }
        // 非法组合拦截（多卡带美女/宋江）
        else if (names.includes('扈三娘') || names.includes('宋江')) {
          isValid = false;
        } else {
          // 其他任何合法的组合（比如水军两兄弟等）都放行，按钮亮起
          html = `<span class="combo-name">组合</span>`;
        }
      }

      if (!isValid) {
        infoEl.innerHTML = `<span class="combo-error">无效的组合</span>`;
        lastComboValid = false;
      } else {
        infoEl.innerHTML = html;
        lastComboValid = true;
      }
      
      updatePlayBtn();
    }

    async function submitPlay() {
      if (myReady.length === 0) { showToast('请选择卡牌'); return; }
      if (!lastComboValid) { showToast('组合无效'); return; }

      // 提前取消宋江展示
      if (songjiangShowTimer) {
        clearTimeout(songjiangShowTimer);
        songjiangShowTimer = null;
      }

      locked = true;
      renderHand();
      updatePlayBtn();

      const res = await fetch('/challenge/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({level: level, card_ids: myReady.map(c => c.id)})
      });
      const data = await res.json();
      if (data.error) {
        showToast(data.error);
        locked = false;
        updatePlayBtn();
        return;
      }

      shownStep = "my_qmark";
      renderPlayed([], [], "my_qmark", null);

      startPolling();
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollState, 500);
    }

    async function pollState() {
      try {
        const res = await fetch('/challenge/state?level=' + level);
        const data = await res.json();
        if (data.error) return;

        if (data.history) {
          lastHistory = data.history;
        }

        roundNo = data.round_no;
        document.getElementById('roundInfo').textContent = '第 ' + roundNo + ' 轮';

        // 卡袋数量（只在非亮牌或亮牌结束 8 秒后更新）
        const elapsed = data.elapsed_since_reveal || 0;
        if (data.phase === 'revealing' && elapsed < TIME_RESOLVE) {
          // 亮牌结算前，保持旧值
        } else {
          displayedPoolCount = data.card_pool_count || 0;
        }
        document.getElementById('poolInfo').textContent = '卡袋 ' + displayedPoolCount;
        poolCount = data.card_pool_count || 0;

        const banner = document.getElementById('centerBanner');
        banner.textContent = '本轮' + data.round_phase;
        banner.classList.remove('atk', 'def');
        banner.classList.add(data.round_phase === '比攻' ? 'atk' : 'def');

        if (data.phase === 'revealing' || data.phase === 'finished') {
          let step;
          
          // ★ 核心：使用全局时间变量替换写死的秒数
          if (elapsed < TIME_REVEAL) {
            // 0 ~ 3秒（a+b）：双方问号
            step = "both_qmark"; 
          } else if (elapsed < TIME_RESOLVE) {
            // 3 ~ 6秒（+c）：亮牌
            step = "face";
          } else {
            // 6秒以上（+d+e）：显示胜负结果
            step = "result";
          }
          
          const winnerIds = (step === "result") ? (data.winner_card_ids || []) : [];
          const allLoser = (step === "result") ? (data.all_loser || false) : false;
          renderPlayed(data.my_played || [], data.ai_played || [], step, winnerIds, allLoser);

          if (step === "result") {
            if (shownStep !== "result" || shownRound !== roundNo) {
              shownStep = "result";
              shownRound = roundNo;
              myHand = data.my_hand || [];
              myReady = [];
              document.getElementById('myHandCount').textContent = data.my_hand_count || 0;
              document.getElementById('aiHandCount').textContent = data.ai_hand_count || 0;
              renderHand();
              updatePlayBtn();
            }
          }
        } else if (data.phase === 'selecting') {
          if (shownRound !== roundNo) {
            shownStep = "idle";
            shownRound = roundNo;
            myHand = data.my_hand || [];
            myReady = [];
            songjiangShownForCurrentSelection = false;
            locked = false;
            document.getElementById('myHandCount').textContent = data.my_hand_count || 0;
            document.getElementById('aiHandCount').textContent = data.ai_hand_count || 0;
            renderHand();
            updatePlayBtn();
            renderPlayed([], [], "idle", null);
          }
        }

        // ★ 结束弹窗：同样等动画播完（TIME_UPDATE）
        if (data.finished) {
          if (elapsed >= TIME_UPDATE) {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            setTimeout(() => showResult(data), 500);
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ===== 记录弹窗 =====
    const DISPLAY_NAME_MAP = {
      "扈三娘": "美女",
      "白胜": "炸弹",
      "孙二娘": "炸弹",
    };
    function displayName(name) {
      return DISPLAY_NAME_MAP[name] || name;
    }

    function renderRecord() {
      const el = document.getElementById('recordContent');
      if (!lastHistory || lastHistory.length === 0) {
        el.innerHTML = '暂无对局记录';
        return;
      }
      let html = `
        <table class="record-table">
          <thead>
            <tr>
              <th>轮次</th>
              <th>我</th>
              <th>电脑</th>
              <th>赢家</th>
            </tr>
          </thead>
          <tbody>
      `;
      lastHistory.forEach(h => {
        const dimKey = h.dim === 'atk' ? 'atk' : 'def';
        const myCard = h.my_card || {};
        const aiCard = h.ai_card || {};
        let myText;
        if (myCard.no_stats) {
          myText = displayName(myCard.name) || '?';
        } else if (myCard.is_combo) {
          myText = `${displayName(myCard.name)} ${myCard[dimKey] ?? '-'}`;
        } else {
          myText = `${displayName(myCard.name) || '?'} ${myCard[dimKey] ?? '-'}`;
        }
        let aiText;
        if (aiCard.no_stats) {
          aiText = displayName(aiCard.name) || '?';
        } else if (aiCard.is_combo) {
          aiText = `${displayName(aiCard.name)} ${aiCard[dimKey] ?? '-'}`;
        } else {
          aiText = `${displayName(aiCard.name) || '?'} ${aiCard[dimKey] ?? '-'}`;
        }

        const winners = h.winners || [];
        let winnerText = '/';
        let winnerCls = 'r-draw';
        if (winners.length === 1) {
          if (winners[0] === 'me') { winnerText = '我'; winnerCls = 'r-win'; }
          else if (winners[0] === 'ai') { winnerText = '电脑'; winnerCls = 'r-lose'; }
        } else if (winners.length > 1) {
          const parts = winners.map(w => w === 'me' ? '我' : '电脑');
          winnerText = parts.join('、');
          winnerCls = 'r-win';
        }

        html += `
          <tr>
            <td>第 ${h.round} 轮</td>
            <td>${myText}</td>
            <td>${aiText}</td>
            <td class="${winnerCls}">${winnerText}</td>
          </tr>
        `;
      });
      html += `</tbody></table>`;
      el.innerHTML = html;
    }

    function showRecord() {
      renderRecord();
      document.getElementById('recordModal').classList.add('active');
    }
    function closeRecord() {
      document.getElementById('recordModal').classList.remove('active');
    }

    function showResult(data) {
      const win = data.won;
      document.getElementById('resultTitle').textContent = win ? '挑战成功' : '挑战失败';
      document.getElementById('resultLine').textContent = win
        ? `第 ${data.level} 关通过`
        : `第 ${data.level} 关未通过`;
      document.getElementById('resultMaterials').textContent = win
        ? `+${data.materials} 建材`
        : '（无建材）';
      document.getElementById('resultModal').classList.add('active');
    }

    function confirmResult() {
      window.location.href = '/challenge';
    }

    async function quitGame() {
      const ok = await showConfirm('确定退出？');
      if (!ok) return;
      window.location.href = '/challenge';
    }

    renderHand();
    pollState();
  </script>
</body>
</html>
