<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人挑战 · 搏卡游戏</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
           background: #ffffff; color: #333; margin: 0; padding: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .page-name { color: #4a90d9; font-size: 18px; }
    .exit-btn { background: #d9534f; color: white; padding: 8px 14px;
                border-radius: 8px; text-decoration: none; font-size: 14px; }
    .table { display: flex; flex-direction: column; min-height: 40vh; }
    .opponent { text-align: center; padding: 12px; }
    .opponent img { width: 48px; height: 48px; border-radius: 8px; }
    .center { text-align: center; font-size: 20px; color: #d4a017; margin: 12px 0; }
    .player-area { text-align: center; padding: 12px; }
    .player-area img { width: 48px; height: 48px; border-radius: 8px; }
    .bottom { position: fixed; bottom: 0; left: 0; right: 0;
              background: #f9f9f9; padding: 10px; border-top: 1px solid #eee; }
    .hand, .ready-area { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
    .card { background: #f0f0f0; border-radius: 8px; padding: 6px; min-width: 90px;
            text-align: center; font-size: 12px; cursor: pointer; }
    .card img { width: 80px; border-radius: 4px; }
    .oval { border-radius: 50%; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-blue { background: #4a90d9; color: white; }
    .btn-red { background: #d9534f; color: white; }
  </style>
</head>
<body>
  <div class="header">
    <span class="page-name">个人挑战</span>
    <a href="/challenge" class="exit-btn" onclick="return confirmExit()">退出</a>
  </div>

  <div class="table">
    <div class="opponent">
      <img src="/static/images/ai.png">
      <div>电脑</div>
      <div>手牌：{{ ai_hand_count }}</div>
    </div>
    <div class="center" id="roundTip">本轮比攻</div>
    <div class="player-area">
      <img src="/static/avatars/{{ username }}.jpg">
      <div>{{ nickname }}</div>
      <div>手牌：{{ my_hand_count }}</div>
    </div>
  </div>

  <div class="bottom">
    <div>手牌区</div>
    <div class="hand" id="hand"></div>
    <div>备战区</div>
    <div class="ready-area" id="readyArea"></div>
    <div class="btn-row">
      <button class="btn btn-blue" onclick="submit()">出战</button>
    </div>
  </div>

  <script>
    let hand = {{ hand | tojson }};
    let ready = [];

    function render() {
      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      hand.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<img src="/static/cards/${c.name}.png"><div>${c.name}</div>`;
        div.onclick = () => { ready.push(c); hand = hand.filter(x => x.id !== c.id); render(); };
        handEl.appendChild(div);
      });
      const readyEl = document.getElementById('readyArea');
      readyEl.innerHTML = '';
      ready.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card oval';
        div.innerHTML = `<img src="/static/cards/${c.name}.png"><div>${c.name}</div>`;
        div.onclick = () => { hand.push(c); ready = ready.filter(x => x.id !== c.id); render(); };
        readyEl.appendChild(div);
      });
    }

    function confirmExit() {
      return confirm('退出将直接判负，确定退出？');
    }

    async function submit() {
      if (ready.length === 0) { alert('请选择卡牌'); return; }
      await fetch('/challenge/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cards: ready.map(c => c.id)})
      });
      alert('已出战');
    }

    render();
  </script>
</body>
</html>
