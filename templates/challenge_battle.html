<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挑战战斗 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      min-height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: radial-gradient(ellipse at center, #f5edda 0%, #d8ccb0 100%) fixed;
      color: #333;
      position: relative;
    }

    .combo-info {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      font-size: 14px;
      color: #666;
      padding: 0 8px;
      text-align: center;
    }
    .combo-info .combo-name {
      font-weight: bold;
      color: #8a6d1f;
      letter-spacing: 1px;
    }
    .combo-info .info-pill {
      font-size: 13px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 8px;
      line-height: 1.4;
      white-space: nowrap;
    }
    .combo-info .atk-pill {
      background: #d89050;
      color: #fff;
      box-shadow: 0 1px 3px rgba(138,74,31,0.4);
    }
    .combo-info .def-pill {
      background: #6ba0d0;
      color: #fff;
      box-shadow: 0 1px 3px rgba(42,74,122,0.4);
    }
    .combo-info .combo-error {
      color: #b85a6a;
      font-weight: bold;
      letter-spacing: 1px;
    }
    
    .top-bar {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(245,237,218,0.92);
      backdrop-filter: blur(6px);
      z-index: 30;
      flex-wrap: wrap;
    }
    .top-left { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .top-right { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .top-btn, .top-info {
      background: rgba(255,255,255,0.95);
      border: 1px solid #d8d0bc;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #4a4a4a;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      white-space: nowrap;
    }
    .top-info { color: #8a6d1f; cursor: default; }
    .top-btn.danger { background: #fce8ec; color: #b85a6a; border-color: #e8c8d0; }

    .arena {
      padding: 6px 12px 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }
    .side .player-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .side .player-head img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 2px solid #5bb8e8;
      box-shadow: 0 0 0 3px rgba(91,184,232,0.4);
      background: #fff;
      object-fit: cover;
    }
    .ai-avatar-placeholder {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 2px solid #e8c8d0;
      box-shadow: 0 0 0 3px rgba(232,200,208,0.5);
      background: #fce8ec;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #b85a6a;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.2;
      padding: 2px;
    }
    .side .pname {
      font-size: 15px;
      font-weight: bold;
      color: #4a4a4a;
      letter-spacing: 1px;
    }
    .side .hand-count {
      font-size: 12px;
      color: #888;
    }

    .played-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 180px;
      align-items: center;
      padding-top: 20px;
    }

    .center-banner {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 6px;
      text-indent: 6px;
      padding: 10px 28px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      white-space: nowrap;
      margin: 20px 0;
    }
    .center-banner.atk {
      background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b);
      border: 2px solid #8a4a1f;
    }
    .center-banner.def {
      background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8);
      border: 2px solid #2a4a7a;
    }

    .hero-card {
      position: relative;
      width: 100px;
      height: 140px;
      flex-shrink: 0;
      transition: box-shadow 0.15s;
    }
    .hero-card .oval-wrap {
      width: 100%;
      height: calc(100% - 22px);
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      overflow: hidden;
      background: #fffdf5;
      border: 4px solid #f0e0a0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      position: relative;
      transition: box-shadow 0.3s, border-color 0.3s, opacity 0.3s;
    }
    .hero-card .oval-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-card .atk-orb,
    .hero-card .def-orb {
      position: absolute;
      bottom: 20px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      z-index: 2;
    }
    .hero-card .atk-orb {
      left: -4px;
      background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b);
      border: 2px solid #8a4a1f;
    }
    .hero-card .def-orb {
      right: -4px;
      background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8);
      border: 2px solid #2a4a7a;
    }
    .hero-card .card-name {
      position: absolute;
      bottom: 10px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #4a4a4a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-card .stars {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      z-index: 3;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    .hero-card.selected .oval-wrap {
      outline: 4px solid #5bb8e8;
      outline-offset: -4px;
      box-shadow: 0 0 0 4px rgba(91,184,232,0.35), 0 3px 8px rgba(0,0,0,0.2);
    }

    .hero-card.winner .oval-wrap {
      border-color: #f5c542;
      box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6);
      animation: winnerBlink 1s ease-in-out 3;
    }
    @keyframes winnerBlink {
      0%, 100% { box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6); }
      50% { box-shadow: 0 0 24px #f5c542, 0 0 48px rgba(245,197,66,0.9); }
    }
    .hero-card.loser .oval-wrap {
      opacity: 0.5;
      filter: grayscale(0.5);
    }

    .qmark-card {
      position: relative;
      width: 100px;
      height: 140px;
      flex-shrink: 0;
    }
    .qmark-card .qmark-wrap {
      width: 100%;
      height: calc(100% - 22px);
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, #3a4a5a, #1a2a3a);
      border: 4px solid #c8b878;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .qmark-card .qmark-wrap::before {
      content: "?";
      font-size: 56px;
      font-weight: bold;
      color: #e8d8a0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      font-family: "LXGW WenKai", serif;
    }

    .bottom-area {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
    }
    .my-hand-area {
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.94);
    }
    .hand-label {
      font-size: 11px;
      color: #999;
      letter-spacing: 2px;
      padding-left: 4px;
      margin-bottom: 4px;
    }
    .hand-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      justify-content: center;
      padding: 4px 0;
    }
    .ready-row {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      min-height: 80px;
    }
    .my-avatar-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      width: 64px;
    }
    .my-avatar-block img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 2px solid #5bb8e8;
      box-shadow: 0 0 0 3px rgba(91,184,232,0.4);
      background: #fff;
      object-fit: cover;
    }
    .my-avatar-block .pname {
      font-size: 11px;
      font-weight: bold;
      color: #4a4a4a;
      text-align: center;
      max-width: 64px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .my-avatar-block .hand-count {
      font-size: 10px;
      color: #888;
      white-space: nowrap;
    }
    .play-square-btn {
      flex-shrink: 0;
      width: 64px;
      border: none;
      border-radius: 12px;
      background: #5bb8e8;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .play-square-btn:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    .play-square-btn:disabled {
      background: #cccccc !important;
      color: #fff !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .played-area { min-height: 130px; }
      .my-avatar-block { width: 56px; }
      .my-avatar-block img { width: 40px; height: 40px; }
      .my-avatar-block .pname { font-size: 10px; max-width: 56px; }
      .my-avatar-block .hand-count { font-size: 9px; }
      .play-square-btn { width: 56px; height: 56px; font-size: 13px; }
    }

    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .result-modal.active { display: flex; }
    .result-inner {
      background: #fffdf5;
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 4px double #f0e0a0;
      text-align: center;
    }
    .result-inner h2 {
      margin: 0 0 16px 0;
      color: #8a6d1f;
      letter-spacing: 3px;
    }
    .result-inner .rl {
      font-size: 15px;
      color: #555;
      margin-bottom: 10px;
    }
    .result-inner .rm {
      font-size: 22px;
      font-weight: bold;
      color: #b85a6a;
      margin-bottom: 18px;
    }
    .result-ok {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5bb8e8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 3px;
    }

    /* ===== 记录弹窗 ===== */
    .record-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .record-modal.active { display: flex; }
    .record-inner {
      background: #fffdf5;
      border-radius: 16px;
      padding: 18px;
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 4px double #f0e0a0;
    }
    .record-inner h3 {
      margin: 0 0 12px 0;
      color: #8a6d1f;
      letter-spacing: 2px;
    }
    .record-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .record-table th,
    .record-table td {
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid #e8e0cc;
    }
    .record-table th {
      color: #8a6d1f;
      font-weight: bold;
      background: #fdf6d8;
    }
    .record-table tr:last-child td { border-bottom: none; }
    .record-table .r-win { color: #5cb85c; font-weight: bold; }
    .record-table .r-lose { color: #d9534f; font-weight: bold; }
    .record-table .r-draw { color: #999; font-weight: bold; }
    .record-close {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5bb8e8;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      margin-top: 14px;
    }

    .toast {
      position: fixed; top: 88%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(44,110,90,0.95); color: #fff;
      padding: 14px 24px; border-radius: 14px; font-size: 15px;
      font-weight: bold; opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-left">
      <div class="top-info" id="roundInfo">第 1 轮</div>
      <div class="top-info" id="poolInfo">卡袋 0</div>
      <button class="top-btn" onclick="showRecord()">记录</button>
    </div>
    <div class="top-right">
      <button class="top-btn danger" onclick="quitGame()">退出</button>
    </div>
  </div>

  <div class="arena">
    <div class="side ai">
      <div class="player-head">
        <div class="ai-avatar-placeholder">第{{ level }}关</div>
        <div>
          <div class="pname">电脑</div>
          <div class="hand-count">手牌 <span id="aiHandCount">6</span></div>
        </div>
      </div>
      <div class="played-area empty" id="aiPlayed"></div>
    </div>

    <div class="center-banner atk" id="centerBanner">本轮比攻</div>

    <div class="side me">
      <div class="played-area empty" id="myPlayed"></div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="ready-row">
      <div class="my-avatar-block">
        <img src="/static/avatars/{{ username }}.jpg" alt="">
        <div class="pname">{{ nickname }}</div>
        <div class="hand-count">手牌 <span id="myHandCount">6</span></div>
      </div>
      <div class="combo-info" id="comboInfo"></div>
      <button class="play-square-btn" id="playBtn" onclick="submitPlay()" disabled>出战</button>
    </div>
    <div class="my-hand-area">
      <div class="hand-label">手牌</div>
      <div class="hand-scroll" id="myHandArea"></div>
    </div>
  </div>

  <div class="result-modal" id="resultModal">
    <div class="result-inner">
      <h2 id="resultTitle">挑战成功</h2>
      <div class="rl" id="resultLine"></div>
      <div class="rm" id="resultMaterials"></div>
      <button class="result-ok" onclick="confirmResult()">确认</button>
    </div>
  </div>

  <!-- ===== 记录弹窗 ===== -->
  <div class="record-modal" id="recordModal" onclick="if(event.target===this)closeRecord()">
    <div class="record-inner">
      <h3>对局记录</h3>
      <div id="recordContent">暂无对局记录</div>
      <button class="record-close" onclick="closeRecord()">关闭</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const level = {{ level }};
    let myHand = {{ my_hand | tojson }};
    let myReady = [];
    let locked = false;
    let roundNo = 1;
    let pollTimer = null;
    let lastWinnerCardId = null;
    let shownStep = "idle";
    let shownRound = 0;
    let displayedPoolCount = 0;
    let lastHistory = [];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    function levelToQuality(level) {
      if (level <= 5) return "#d0d0d0";
      if (level <= 10) return "#5cb85c";
      if (level <= 15) return "#4a90d9";
      if (level <= 20) return "#a06cd5";
      return "#f5a623";
    }
    function levelToStars(level) {
      return ((level - 1) % 5) + 1;
    }

    function makeHeroCard(c, extraCls) {
      const lv = c.level || 1;
      const atk = c.atk;
      const def = c.def;
      const borderColor = levelToQuality(lv);
      const stars = levelToStars(lv);
      const div = document.createElement('div');
      div.className = 'hero-card ' + (extraCls || '');
      div.innerHTML = `
        <div class="stars" style="color:${borderColor};">${'★'.repeat(stars)}</div>
        <div class="oval-wrap" style="border-color:${borderColor};">
          <img src="/static/cards/${c.name}.PNG" alt="${c.name}">
        </div>
        <div class="atk-orb">${atk}</div>
        <div class="def-orb">${def}</div>
        <div class="card-name">${c.name}</div>
      `;
      return div;
    }

    function makeQmarkCard() {
      const div = document.createElement('div');
      div.className = 'qmark-card';
      div.innerHTML = `<div class="qmark-wrap"></div>`;
      return div;
    }

    function renderHand() {
      const handEl = document.getElementById('myHandArea');
      handEl.innerHTML = '';
      myHand.forEach(c => {
        const isSelected = myReady.find(x => x.id === c.id);
        const d = makeHeroCard(c, isSelected ? 'selected' : '');
        if (!locked) {
          d.onclick = async () => {
            const idx = myReady.findIndex(x => x.id === c.id);
            if (idx >= 0) {
              myReady.splice(idx, 1);
            } else {
              myReady.push(c);
            }
            renderHand();
            await updateComboInfo();
            updatePlayBtn();
          };
        }
        handEl.appendChild(d);
      });
      document.getElementById('myHandCount').textContent = myHand.length;
    }

    function updatePlayBtn() {
      const btn = document.getElementById('playBtn');
      btn.disabled = locked || myReady.length === 0 || !lastComboValid;
      btn.textContent = locked ? '锁定' : '出战';
    }

    function renderPlayed(myCards, aiCards, step, winnerIds, allLoser) {
      const myEl = document.getElementById('myPlayed');
      const aiEl = document.getElementById('aiPlayed');
      myEl.innerHTML = '';
      aiEl.innerHTML = '';

      if (step === "idle") {
        myEl.classList.add('empty');
        aiEl.classList.add('empty');
        return;
      }
      if (step === "my_qmark") {
        myEl.classList.remove('empty');
        myEl.appendChild(makeQmarkCard());
        aiEl.classList.add('empty');
        return;
      }
      if (step === "both_qmark") {
        myEl.classList.remove('empty');
        myEl.appendChild(makeQmarkCard());
        aiEl.classList.remove('empty');
        aiEl.appendChild(makeQmarkCard());
        return;
      }
      if (step === "face" || step === "result") {
        const winSet = new Set(winnerIds || []);
        myEl.classList.toggle('empty', myCards.length === 0);
        aiEl.classList.toggle('empty', aiCards.length === 0);
        myCards.forEach(c => {
          let cls = '';
          if (step === "result") {
            if (allLoser) {
              cls = 'loser';
            } else if (winSet.size > 0) {
              cls = winSet.has(c.id) ? 'winner' : 'loser';
            }
          }
          myEl.appendChild(makeHeroCard(c, cls));
        });
        aiCards.forEach(c => {
          let cls = '';
          if (step === "result") {
            if (allLoser) {
              cls = 'loser';
            } else if (winSet.size > 0) {
              cls = winSet.has(c.id) ? 'winner' : 'loser';
            }
          }
          aiEl.appendChild(makeHeroCard(c, cls));
        });
      }
    }

    let lastComboValid = true;

    async function updateComboInfo() {
      const infoEl = document.getElementById('comboInfo');
      if (!infoEl) return;
      if (myReady.length === 0) {
        infoEl.innerHTML = '';
        lastComboValid = true;
        return;
      }
      try {
        const res = await fetch('/challenge/validate_combo', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({card_ids: myReady.map(c => c.id)})
        });
        const data = await res.json();

        if (!data.valid) {
          infoEl.innerHTML = `<span class="combo-error">无效的组合</span>`;
          lastComboValid = false;
          return;
        }

        const name = data.name || '';
        const atk = data.atk;
        const def = data.def;
        let html = '';

        if (data.type === 'single') {
          // 单卡普通：不显示
          infoEl.innerHTML = '';
        } else if (data.type === 'single_beauty') {
          html = `<span class="combo-name">${name}</span>`;
          infoEl.innerHTML = html;
        } else if (data.type === 'single_bomb') {
          html = `<span class="combo-name">${name}</span>`;
          infoEl.innerHTML = html;
        } else if (data.type === 'single_handsome') {
          html = `<span class="combo-name">${name}</span>`;
          infoEl.innerHTML = html;
        } else if (data.type === 'double_bomb') {
          html = `<span class="combo-name">${name}</span>`;
          infoEl.innerHTML = html;
        } else if (data.type === 'wu_yong') {
          html = `<span class="combo-name">${name}</span>`;
          if (atk !== null) html += `<span class="info-pill atk-pill">${atk}</span>`;
          if (def !== null) html += `<span class="info-pill def-pill">${def}</span>`;
          infoEl.innerHTML = html;
        } else if (data.type === 'wu_yong_handsome') {
          html = `<span class="combo-name">${name}</span>`;
          if (atk !== null) html += `<span class="info-pill atk-pill">${atk}</span>`;
          if (def !== null) html += `<span class="info-pill def-pill">${def}</span>`;
          infoEl.innerHTML = html;
        } else if (data.type === 'combo') {
          html = `<span class="combo-name">${name}</span>`;
          if (atk !== null) html += `<span class="info-pill atk-pill">${atk}</span>`;
          if (def !== null) html += `<span class="info-pill def-pill">${def}</span>`;
          infoEl.innerHTML = html;
        } else {
          infoEl.innerHTML = '';
        }
        lastComboValid = true;
      } catch (e) {
        infoEl.innerHTML = `<span class="combo-error">校验失败</span>`;
        lastComboValid = false;
      }
    }
    
    async function submitPlay() {
      if (myReady.length === 0) { showToast('请选择卡牌'); return; }
      if (!lastComboValid) { showToast('组合无效'); return; }
      locked = true;
      updatePlayBtn();

      const res = await fetch('/challenge/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({level: level, card_ids: myReady.map(c => c.id)})
      });
      const data = await res.json();
      if (data.error) {
        showToast(data.error);
        locked = false;
        updatePlayBtn();
        return;
      }

      shownStep = "my_qmark";
      renderPlayed([], [], "my_qmark", null);

      startPolling();
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollState, 500);
    }

    async function pollState() {
      try {
        const res = await fetch('/challenge/state?level=' + level);
        const data = await res.json();
        if (data.error) return;

        // 同步历史记录
        if (data.history) {
          lastHistory = data.history;
        }

        roundNo = data.round_no;
        document.getElementById('roundInfo').textContent = '第 ' + roundNo + ' 轮';

        const elapsedForPool = data.elapsed_since_reveal || 0;
        if (data.phase === 'revealing' && elapsedForPool < 6.0) {
          // 展示结算前旧值
        } else {
          displayedPoolCount = data.card_pool_count || 0;
        }
        document.getElementById('poolInfo').textContent = '卡袋 ' + displayedPoolCount;
        const banner = document.getElementById('centerBanner');
        banner.textContent = '本轮' + data.round_phase;
        banner.classList.remove('atk', 'def');
        banner.classList.add(data.round_phase === '比攻' ? 'atk' : 'def');

        const elapsed = data.elapsed_since_reveal || 0;

        if (data.phase === 'revealing' || data.phase === 'finished') {
          let step;
          if (elapsed < 1.0) {
            step = "my_qmark";
          } else if (elapsed < 3.0) {
            step = "both_qmark";
          } else if (elapsed < 6.0) {
            step = "face";
          } else {
            step = "result";
          }
          const winnerIds = (step === "result") ? (data.winner_card_ids || []) : [];
          const allLoser = (step === "result") ? (data.all_loser || false) : false;
          renderPlayed(data.my_played || [], data.ai_played || [], step, winnerIds, allLoser);

          if (step === "result") {
            if (shownStep !== "result" || shownRound !== roundNo) {
              shownStep = "result";
              shownRound = roundNo;
              myHand = data.my_hand || [];
              myReady = [];
              document.getElementById('myHandCount').textContent = data.my_hand_count || 0;
              document.getElementById('aiHandCount').textContent = data.ai_hand_count || 0;
              renderHand();
              updatePlayBtn();
            }
          }
        } else if (data.phase === 'selecting') {
          if (shownRound !== roundNo) {
            shownStep = "idle";
            shownRound = roundNo;
            myHand = data.my_hand || [];
            myReady = [];
            locked = false;
            document.getElementById('myHandCount').textContent = data.my_hand_count || 0;
            document.getElementById('aiHandCount').textContent = data.ai_hand_count || 0;
            renderHand();
            updatePlayBtn();
            renderPlayed([], [], "idle", null);
          }
        }

        if (data.finished) {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          setTimeout(() => showResult(data), 500);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ===== 记录弹窗 =====
    const DISPLAY_NAME_MAP = {
      "扈三娘": "美女",
      "白胜": "炸弹",
      "孙二娘": "炸弹",
    };
    function displayName(name) {
      return DISPLAY_NAME_MAP[name] || name;
    }

    function renderRecord() {
      const el = document.getElementById('recordContent');
      if (!lastHistory || lastHistory.length === 0) {
        el.innerHTML = '暂无对局记录';
        return;
      }
      let html = `
        <table class="record-table">
          <thead>
            <tr>
              <th>轮次</th>
              <th>我</th>
              <th>电脑</th>
              <th>赢家</th>
            </tr>
          </thead>
          <tbody>
      `;
      lastHistory.forEach(h => {
        const dimKey = h.dim === 'atk' ? 'atk' : 'def';
        const myCard = h.my_card || {};
        const aiCard = h.ai_card || {};
        let myText;
        if (myCard.no_stats) {
          myText = displayName(myCard.name) || '?';
        } else if (myCard.is_combo) {
          myText = `${displayName(myCard.name)} ${myCard[dimKey] ?? '-'}`;
        } else {
          myText = `${displayName(myCard.name) || '?'} ${myCard[dimKey] ?? '-'}`;
        }
        let aiText;
        if (aiCard.no_stats) {
          aiText = displayName(aiCard.name) || '?';
        } else if (aiCard.is_combo) {
          aiText = `${displayName(aiCard.name)} ${aiCard[dimKey] ?? '-'}`;
        } else {
          aiText = `${displayName(aiCard.name) || '?'} ${aiCard[dimKey] ?? '-'}`;
        }

        const winners = h.winners || [];
        let winnerText = '/';
        let winnerCls = 'r-draw';
        if (winners.length === 1) {
          if (winners[0] === 'me') { winnerText = '我'; winnerCls = 'r-win'; }
          else if (winners[0] === 'ai') { winnerText = '电脑'; winnerCls = 'r-lose'; }
        } else if (winners.length > 1) {
          const parts = winners.map(w => w === 'me' ? '我' : '电脑');
          winnerText = parts.join('、');
          winnerCls = 'r-win';
        }

        html += `
          <tr>
            <td>第 ${h.round} 轮</td>
            <td>${myText}</td>
            <td>${aiText}</td>
            <td class="${winnerCls}">${winnerText}</td>
          </tr>
        `;
      });
      html += `</tbody></table>`;
      el.innerHTML = html;
    }

    function showRecord() {
      renderRecord();
      document.getElementById('recordModal').classList.add('active');
    }
    function closeRecord() {
      document.getElementById('recordModal').classList.remove('active');
    }

    function showResult(data) {
      const win = data.won;
      document.getElementById('resultTitle').textContent = win ? '挑战成功' : '挑战失败';
      document.getElementById('resultLine').textContent = win
        ? `第 ${data.level} 关通过`
        : `第 ${data.level} 关未通过`;
      document.getElementById('resultMaterials').textContent = win
        ? `+${data.materials} 建材`
        : '（无建材）';
      document.getElementById('resultModal').classList.add('active');
    }

    function confirmResult() {
      window.location.href = '/challenge';
    }

    function quitGame() {
      if (locked || myReady.length > 0) {
        if (!confirm('退出将直接判负，确定？')) return;
      } else {
        if (!confirm('确定退出？')) return;
      }
      window.location.href = '/challenge';
    }

    renderHand();
    pollState();
  </script>
</body>
</html>
