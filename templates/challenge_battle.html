<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挑战战斗 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      min-height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: radial-gradient(ellipse at center, #f5edda 0%, #d8ccb0 100%) fixed;
      color: #333;
      position: relative;
    }

    .top-bar {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(245,237,218,0.92);
      backdrop-filter: blur(6px);
      z-index: 30;
    }
    .top-left { display: flex; gap: 6px; align-items: center; }
    .top-right { display: flex; gap: 6px; align-items: center; }
    .top-btn, .top-info {
      background: rgba(255,255,255,0.95);
      border: 1px solid #d8d0bc;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #4a4a4a;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      white-space: nowrap;
    }
    .top-info { color: #8a6d1f; cursor: default; }
    .top-btn.danger { background: #fce8ec; color: #b85a6a; border-color: #e8c8d0; }

    .arena {
      padding: 6px 12px 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .side .player-head {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 14px;
      padding: 6px 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .side .player-head img {
      width: 48px; height: 48px;
      border-radius: 10px;
      border: 2px solid #f0e0a0;
      background: #fff;
    }
    .side.me .player-head img {
      border-color: #5bb8e8;
      box-shadow: 0 0 0 3px rgba(91,184,232,0.4);
    }
    .side .pname {
      font-size: 15px;
      font-weight: bold;
      color: #4a4a4a;
      letter-spacing: 1px;
    }
    .side .hand-count {
      font-size: 12px;
      color: #888;
    }

    .played-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 180px;
      align-items: center;
    }
    .played-area.empty::before {
      content: "（等待出牌）";
      color: #bbb;
      font-size: 14px;
    }

    .center-banner {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 6px;
      text-indent: 6px;
      padding: 10px 28px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      white-space: nowrap;
      margin: 4px 0;
    }
    .center-banner.atk {
      background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b);
      border: 2px solid #8a4a1f;
    }
    .center-banner.def {
      background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8);
      border: 2px solid #2a4a7a;
    }

    .hero-card {
      position: relative;
      width: 100px;
      height: 140px;
      flex-shrink: 0;
    }
    .hero-card .oval-wrap {
      width: 100%;
      height: calc(100% - 22px);
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      overflow: hidden;
      background: #fffdf5;
      border: 4px solid #f0e0a0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      position: relative;
      transition: box-shadow 0.3s, border-color 0.3s, opacity 0.3s;
    }
    .hero-card .oval-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-card .atk-orb,
    .hero-card .def-orb {
      position: absolute;
      bottom: 20px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      z-index: 2;
    }
    .hero-card .atk-orb {
      left: -4px;
      background: radial-gradient(circle at 30% 30%, #f5b76e, #c1783b);
      border: 2px solid #8a4a1f;
    }
    .hero-card .def-orb {
      right: -4px;
      background: radial-gradient(circle at 30% 30%, #8bc0e8, #4a7db8);
      border: 2px solid #2a4a7a;
    }
    .hero-card .card-name {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #4a4a4a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-card .stars {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      z-index: 3;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    .hero-card.winner .oval-wrap {
      border-color: #f5c542;
      box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6);
      animation: winnerBlink 1s ease-in-out 3;
    }
    @keyframes winnerBlink {
      0%, 100% { box-shadow: 0 0 12px #f5c542, 0 0 24px rgba(245,197,66,0.6); }
      50% { box-shadow: 0 0 24px #f5c542, 0 0 48px rgba(245,197,66,0.9); }
    }
    .hero-card.loser .oval-wrap {
      opacity: 0.5;
      filter: grayscale(0.5);
    }

    /* 底部区：流式布局（不再固定） */
    .bottom-area {
      background: rgba(255,255,255,0.94);
      border-top: 1px solid #d8d0bc;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
    }
    .my-ready-area {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: center;
      justify-content: center;
      padding: 4px;
      min-width: 0;
    }
    .my-ready-area:empty::before {
      content: "备战区（未选卡）";
      color: #bbb;
      font-size: 13px;
      padding: 8px;
      display: block;
    }
    .my-hand-area {
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
    }
    .hand-label {
      font-size: 11px;
      color: #999;
      letter-spacing: 2px;
      padding-left: 4px;
      margin-bottom: 4px;
    }
    .hand-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
      padding: 4px 0;
    }
    .ready-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      padding: 10px 12px 10px 12px;
      border-bottom: 1px dashed #e0d8c0;
      min-height: 96px;
    }
    .my-avatar-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      width: 64px;
    }
    .my-avatar-block img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 2px solid #5bb8e8;
      box-shadow: 0 0 0 3px rgba(91,184,232,0.4);
      background: #fff;
      object-fit: cover;
    }
    .my-avatar-block .pname {
      font-size: 11px;
      font-weight: bold;
      color: #4a4a4a;
      text-align: center;
      max-width: 64px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .my-avatar-block .hand-count {
      font-size: 10px;
      color: #888;
      white-space: nowrap;
    }
    .play-square-btn {
      flex-shrink: 0;
      width: 64px;
      border: none;
      border-radius: 12px;
      background: #5bb8e8;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .play-square-btn:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }
    .play-square-btn:disabled {
      background: #cccccc !important;
      color: #fff !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .played-area { min-height: 130px; }
      .my-avatar-block { width: 56px; }
      .my-avatar-block img { width: 40px; height: 40px; }
      .my-avatar-block .pname { font-size: 10px; max-width: 56px; }
      .my-avatar-block .hand-count { font-size: 9px; }
      .play-square-btn { width: 56px; font-size: 13px; }
      .ready-row { min-height: 80px; }
    }

    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .result-modal.active { display: flex; }
    .result-inner {
      background: #fffdf5;
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 4px double #f0e0a0;
      text-align: center;
    }
    .result-inner h2 {
      margin: 0 0 16px 0;
      color: #8a6d1f;
      letter-spacing: 3px;
    }
    .result-inner .rl {
      font-size: 15px;
      color: #555;
      margin-bottom: 10px;
    }
    .result-inner .rm {
      font-size: 22px;
      font-weight: bold;
      color: #b85a6a;
      margin-bottom: 18px;
    }
    .result-ok {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5bb8e8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 3px;
    }

    .toast {
      position: fixed; top: 88%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(44,110,90,0.95); color: #fff;
      padding: 14px 24px; border-radius: 14px; font-size: 15px;
      font-weight: bold; opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-left">
      <button class="top-btn danger" onclick="quitGame()">退出</button>
      <div class="top-info" id="levelInfo">第 {{ level }} 关</div>
      <div class="top-info" id="roundInfo">第 1 轮</div>
      <div class="top-info" id="poolInfo">卡袋 0</div>
    </div>
    <div class="top-right">
      <div class="top-info" id="rewardInfo">胜利 +0 建材</div>
    </div>
  </div>

  <div class="arena">
    <div class="side ai">
      <div class="player-head">
        <img src="/static/images/ai.png" alt="AI">
        <div>
          <div class="pname">电脑</div>
          <div class="hand-count">手牌 <span id="aiHandCount">6</span></div>
        </div>
      </div>
      <div class="played-area empty" id="aiPlayed"></div>
    </div>

    <div class="center-banner atk" id="centerBanner">本轮比攻</div>

    <div class="side me">
      <div class="played-area empty" id="myPlayed"></div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="ready-row">
      <div class="my-avatar-block">
        <img src="/static/avatars/{{ username }}.jpg" alt="">
        <div class="pname">{{ nickname }}</div>
        <div class="hand-count">手牌 <span id="myHandCount">6</span></div>
      </div>
      <div class="my-ready-area" id="myReadyArea"></div>
      <button class="play-square-btn" id="playBtn" onclick="submitPlay()" disabled>出战</button>
    </div>
    <div class="my-hand-area">
      <div class="hand-label">手牌</div>
      <div class="hand-scroll" id="myHandArea"></div>
    </div>
  </div>

  <div class="result-modal" id="resultModal">
    <div class="result-inner">
      <h2 id="resultTitle">挑战成功</h2>
      <div class="rl" id="resultLine"></div>
      <div class="rm" id="resultMaterials"></div>
      <button class="result-ok" onclick="confirmResult()">确认</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const level = {{ level }};
    let myHand = {{ my_hand | tojson }};
    let myReady = [];
    let locked = false;
    let currentPhase = "selecting";
    let roundNo = 1;
    let pollTimer = null;
    let lastWinnerCardId = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    function levelToQuality(level) {
      if (level <= 5) return "#d0d0d0";
      if (level <= 10) return "#5cb85c";
      if (level <= 15) return "#4a90d9";
      if (level <= 20) return "#a06cd5";
      return "#f5a623";
    }
    function levelToStars(level) {
      return ((level - 1) % 5) + 1;
    }

    function makeHeroCard(c, extraCls) {
      const lv = c.level || 1;
      const bonus = lv - 1;
      const atk = c.atk + bonus;
      const def = c.def + bonus;
      const borderColor = levelToQuality(lv);
      const stars = levelToStars(lv);
      const div = document.createElement('div');
      div.className = 'hero-card ' + (extraCls || '');
      div.innerHTML = `
        <div class="stars" style="color:${borderColor};">${'★'.repeat(stars)}</div>
        <div class="oval-wrap" style="border-color:${borderColor};">
          <img src="/static/cards/${c.name}.PNG" alt="${c.name}">
        </div>
        <div class="atk-orb">${atk}</div>
        <div class="def-orb">${def}</div>
        <div class="card-name">${c.name}</div>
      `;
      return div;
    }

    function renderHand() {
      const handEl = document.getElementById('myHandArea');
      handEl.innerHTML = '';
      myHand.forEach(c => {
        const d = makeHeroCard(c, '');
        if (!locked) {
          d.onclick = () => {
            myReady.push(c);
            myHand = myHand.filter(x => x.id !== c.id);
            renderHand();
            renderReady();
            updatePlayBtn();
          };
        }
        handEl.appendChild(d);
      });
      document.getElementById('myHandCount').textContent = myHand.length;
    }

    function renderReady() {
      const readyEl = document.getElementById('myReadyArea');
      readyEl.innerHTML = '';
      myReady.forEach(c => {
        const d = makeHeroCard(c, '');
        if (!locked) {
          d.onclick = () => {
            myHand.push(c);
            myReady = myReady.filter(x => x.id !== c.id);
            renderHand();
            renderReady();
            updatePlayBtn();
          };
        }
        readyEl.appendChild(d);
      });
    }

    function updatePlayBtn() {
      const btn = document.getElementById('playBtn');
      btn.disabled = locked || myReady.length === 0;
      btn.textContent = locked ? '已锁定' : '出战';
    }

    function renderPlayed(myCards, aiCards) {
      const myEl = document.getElementById('myPlayed');
      const aiEl = document.getElementById('aiPlayed');
      myEl.innerHTML = '';
      aiEl.innerHTML = '';
      myEl.classList.toggle('empty', myCards.length === 0);
      aiEl.classList.toggle('empty', aiCards.length === 0);
      myCards.forEach(c => {
        const cls = (lastWinnerCardId === c.id) ? 'winner' : ((lastWinnerCardId && lastWinnerCardId !== c.id) ? 'loser' : '');
        myEl.appendChild(makeHeroCard(c, cls));
      });
      aiCards.forEach(c => {
        const cls = (lastWinnerCardId === c.id) ? 'winner' : ((lastWinnerCardId && lastWinnerCardId !== c.id) ? 'loser' : '');
        aiEl.appendChild(makeHeroCard(c, cls));
      });
    }

    async function submitPlay() {
      if (myReady.length === 0) { showToast('请选择卡牌'); return; }
      const res = await fetch('/challenge/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({level: level, card_ids: myReady.map(c => c.id)})
      });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      locked = true;
      updatePlayBtn();
      startPolling();
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollState, 800);
    }

    async function pollState() {
      try {
        const res = await fetch('/challenge/state?level=' + level);
        const data = await res.json();
        if (data.error) return;

        roundNo = data.round_no;
        currentPhase = data.phase;
        document.getElementById('roundInfo').textContent = '第 ' + roundNo + ' 轮';
        document.getElementById('poolInfo').textContent = '卡袋 ' + (data.card_pool_count || 0);
        const banner = document.getElementById('centerBanner');
        banner.textContent = '本轮' + data.round_phase;
        banner.classList.remove('atk', 'def');
        banner.classList.add(data.round_phase === '比攻' ? 'atk' : 'def');

        if (data.phase === 'selecting' && data.round_no !== (window._lastRound || 0)) {
          window._lastRound = data.round_no;
          myHand = data.my_hand || [];
          myReady = [];
          locked = false;
          lastWinnerCardId = null;
          renderHand();
          renderReady();
          updatePlayBtn();
        } else if (data.phase === 'selecting' && !data.round_started) {
          if (myHand.length === 0) {
            myHand = data.my_hand || [];
            renderHand();
          }
        }

        renderPlayed(data.my_played || [], data.ai_played || []);

        if (data.winner_card_id) {
          if (lastWinnerCardId !== data.winner_card_id) {
            lastWinnerCardId = data.winner_card_id;
            renderPlayed(data.my_played || [], data.ai_played || []);
          }
        }

        if (data.finished) {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          showResult(data);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function showResult(data) {
      const win = data.won;
      document.getElementById('resultTitle').textContent = win ? '挑战成功' : '挑战失败';
      document.getElementById('resultLine').textContent = win
        ? `第 ${data.level} 关通过`
        : `第 ${data.level} 关未通过`;
      document.getElementById('resultMaterials').textContent = win
        ? `+${data.materials} 建材`
        : '（无建材）';
      document.getElementById('resultModal').classList.add('active');
    }

    function confirmResult() {
      window.location.href = '/challenge';
    }

    function quitGame() {
      if (locked || myReady.length > 0) {
        if (!confirm('退出将直接判负，确定？')) return;
      } else {
        if (!confirm('确定退出？')) return;
      }
      window.location.href = '/challenge';
    }

    renderHand();
    pollState();
  </script>
</body>
</html>
