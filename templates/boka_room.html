<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡房间 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc; color: #333; margin: 0; padding: 16px 16px 90px 16px; min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    /* ===== 顶部标题 ===== */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px;
      padding: 16px 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px;
    }
    .title-block .page-name { font-size: 28px; font-weight: bold; color: #2c3e50; letter-spacing: 4px; text-indent: 4px; }
    .title-block .en { font-size: 12px; color: #999; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
    .back-btn { background: #fce8ec; padding: 10px 20px; border-radius: 8px; border: 1px solid #e8c8d0; font-size: 15px; color: #b85a6a; text-decoration: none; white-space: nowrap; }
    .back-btn:hover { background: #f8d8de; }

    /* ===== 通用卡片 ===== */
    .panel { background: rgba(255,255,255,0.92); border: 1px solid #d8d0bc; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .panel-title { display: inline-block; background: #fdf6d8; color: #8a6d1f; padding: 8px 20px; border-radius: 20px; border: 1px solid #f0e0a0; font-size: 18px; font-weight: bold; letter-spacing: 3px; text-indent: 3px; margin-bottom: 16px; }

    /* ===== 板块1：房间号 + 准备 ===== */
    .room-code-big { text-align: center; font-family: monospace; font-size: 42px; font-weight: bold; color: #2c3e50; letter-spacing: 8px; margin: 10px 0 18px 0; }
    .copy-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .copy-input { flex: 1; padding: 12px 14px; border: 1px solid #d8d0bc; border-radius: 10px; background: #f9f5e8; font-size: 14px; color: #666; outline: none; }
    .copy-btn { padding: 12px 20px; border: none; border-radius: 10px; background: #5bb8e8; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; white-space: nowrap; }

    /* 准备区 */
    .ready-block { border-top: 1px solid #e8e0cc; padding-top: 18px; }
    .ready-status { text-align: center; font-size: 16px; color: #666; margin-bottom: 16px; }
    .ready-status b { color: #b85a6a; font-size: 22px; font-weight: bold; margin: 0 3px; }
    .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .btn-row:last-child { margin-bottom: 0; }
    .btn-room { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .btn-room:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-room:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-green { background: #5cb85c; color: #fff; }
    .btn-blue { background: #5bb8e8; color: #fff; }
    .btn-pink { background: #e8a0b0; color: #fff; }
    .btn-gray { background: #c8bca0; color: #fff; }

    /* ===== 板块2：玩家列表 ===== */
    .player-list { display: flex; flex-direction: column; gap: 10px; }
    .player-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #e0d8c0; border-radius: 12px; background: #fdfaf0; }
    .player-item.is-me { background: #f9f5e8; border-color: #d8c8a0; }
    .avatar-fallback { width: 48px; height: 48px; border-radius: 10px; border: 2px solid #d8d0bc; background: #d8d0bc; overflow: hidden; flex-shrink: 0; }
    .avatar-fallback img { width: 100%; height: 100%; object-fit: cover; }
    
    /* 左侧名字与标签 */
    .player-name { font-size: 16px; font-weight: bold; color: #2c3e50; display: flex; align-items: center; gap: 8px; }
    .me-suffix { color: #b85a6a; font-size: 14px; font-weight: normal; }
    .tag { font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
    .tag-owner { color: #d89050; background: #fdf0e0; border: 1px solid #f0d0b0; }
    .tag-ready { color: #5cb85c; background: #e8f5e8; border: 1px solid #b8e0b8; }
    .tag-ai { color: #8a6d1f; background: #fdf6d8; border: 1px solid #f0e0a0; }

    /* 右侧公共按钮 */
    .right-action-btn { font-family: inherit; font-size: 13px; font-weight: bold; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: none; white-space: nowrap; flex-shrink: 0; }
    .btn-kick { background: #fce8ec; color: #b85a6a; border: 1px solid #e8c8d0; }
    .btn-spectate { background: #f5a623; color: #fff; }
    .btn-spectate:disabled { background: #e0e0e0 !important; color: #aaa !important; cursor: not-allowed; }
    .btn-back { background: #5cb85c; color: #fff; }

    /* ===== Toast ===== */
    .toast { position: fixed; right: 20px; bottom: 100px; background: rgba(44,110,90,0.95); color: #fff; padding: 12px 22px; border-radius: 14px; font-size: 15px; font-weight: bold; opacity: 0; transform: translateY(20px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ===== 通用弹窗 ===== */
    .confirm-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.55); z-index: 400; justify-content: center; align-items: center; padding: 16px; }
    .confirm-modal.active { display: flex; }
    .confirm-inner { background: #fffdf5; border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; border: 4px double #f0e0a0; text-align: center; }
    .confirm-inner h3 { margin: 0 0 14px 0; color: #8a6d1f; font-size: 18px; font-weight: bold; }
    .confirm-inner .confirm-msg { font-size: 15px; color: #555; margin-bottom: 20px; }
    .confirm-btns { display: flex; gap: 10px; }
    .confirm-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block"><div class="page-name">搏卡房间</div><div class="en">Room</div></div>
      <a href="/boka" class="back-btn">返回大厅</a>
    </div>

    <!-- 板块1：房间号 + 操作按钮 -->
    <div class="panel" id="actionPanel">
      <div class="panel-title">房间号</div>
      <div class="room-code-big" id="roomCode">{{ room_code }}</div>
      <div class="copy-row">
        <input class="copy-input" id="inviteUrl" value="{{ invite_url }}" readonly>
        <button class="copy-btn" onclick="copyInvite()">复制</button>
      </div>
      <div class="ready-block">
        <div class="btn-row" id="readyBtnRow">
          <button class="btn-room btn-green" id="readyBtn" onclick="toggleReady()">
            {% if is_ready %}取消准备{% else %}准备{% endif %}
          </button>
          <button class="btn-room btn-pink" onclick="leaveRoom()">退出房间</button>
        </div>
        <div class="btn-row" id="ownerBtnRow">
          <button class="btn-room btn-blue" id="startBtn" onclick="startGame()" style="flex: 3;" {% if not is_owner %}disabled{% endif %}>开始游戏</button>
          <button class="btn-room btn-pink" id="dissolveBtn" onclick="dissolveRoom()" style="flex: 1;" {% if not is_owner %}disabled{% endif %}>解散房间</button>
        </div>
        <div class="btn-row">
          <button class="btn-room btn-gray" id="addBotBtn" onclick="addBot()" style="flex: 1;" {% if not is_owner %}disabled{% endif %}>添加机器人</button>
        </div>
      </div>
    </div>

    <!-- 板块2：玩家列表 -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div class="panel-title" style="margin-bottom:0;">玩家列表</div>
        <div style="font-size: 15px; color: #666; font-weight: bold; margin-right: 16px;">
          已准备 <b id="readyCount">{{ ready_count }}</b> / <b id="playerCount">{{ player_count }}</b>
        </div>
      </div>
      <div class="player-list" id="playerList"></div>
    </div>
  </div>

  <div class="confirm-modal" id="confirmModal">
    <div class="confirm-inner">
      <h3 id="confirmTitle">确认</h3>
      <div class="confirm-msg" id="confirmMsg"></div>
      <div class="confirm-btns" id="confirmBtns">
        <button class="confirm-btn" style="background:#fff; color:#666; border:1px solid #d8d0bc;" onclick="confirmChoose(false)">取消</button>
        <button class="confirm-btn" style="background:#5bb8e8; color:#fff;" onclick="confirmChoose(true)">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const ROOM_CODE = "{{ room_code }}";
    // ★ 核心修复：强制转成布尔值，彻底解决 JS 报错
    const IS_OWNER = "{{ 'true' if is_owner else 'false' }}" === "true";
    const MY_USERNAME = "{{ current_user.username }}";
    let lastStatus = null;
    let statePollTimer = null;
    let lastPlayersData = [];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    let confirmResolver = null;
    function showConfirm(title, message, okText, cancelText) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = message;
      const btns = document.getElementById('confirmBtns');
      btns.innerHTML = `
        <button class="confirm-btn" style="background:#fff; color:#666; border:1px solid #d8d0bc;" onclick="confirmChoose(false)">${cancelText}</button>
        <button class="confirm-btn" style="background:#5bb8e8; color:#fff;" onclick="confirmChoose(true)">${okText}</button>
      `;
      document.getElementById('confirmModal').classList.add('active');
      return new Promise(resolve => { confirmResolver = resolve; });
    }
    function confirmChoose(ok) {
      document.getElementById('confirmModal').classList.remove('active');
      if (confirmResolver) { confirmResolver(ok); confirmResolver = null; }
    }

    async function copyInvite() {
      const input = document.getElementById('inviteUrl');
      try { await navigator.clipboard.writeText(input.value); showToast('已复制'); } 
      catch (e) { input.select(); document.execCommand('copy'); showToast('已复制'); }
    }

    async function toggleReady() {
      const btn = document.getElementById('readyBtn');
      if (btn.disabled) return;
      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = '处理中...';
      try {
        const res = await fetch(`/boka/room/${ROOM_CODE}/ready`, { method: 'POST' });
        const data = await res.json();
        if (data.error) { showToast(data.error); btn.textContent = oldText; return; }
        lastStatus = data;
        document.getElementById('readyCount').textContent = data.ready_count;
        document.getElementById('playerCount').textContent = data.count;
        btn.textContent = data.is_ready ? '取消准备' : '准备';
        if (IS_OWNER) {
          const allReady = data.players.every(p => p.ready);
          document.getElementById('startBtn').disabled = !(allReady && data.count >= 2);
        }
        renderPlayers(data.players || [], data.owner);
      } catch (e) {
        showToast('网络异常'); btn.textContent = oldText;
      } finally {
        btn.disabled = false;
      }
    }

    async function startGame() {
      const res = await fetch(`/boka/room/${ROOM_CODE}/start`, { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      window.location.href = `/boka/room/${ROOM_CODE}/battle`;
    }

    async function leaveRoom() {
      const ok = await showConfirm('退出房间', '确定要退出房间吗？', '退出', '取消');
      if (!ok) return;
      const res = await fetch(`/boka/room/${ROOM_CODE}/leave_room`, { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      window.location.href = '/boka';
    }

    async function dissolveRoom() {
      const ok = await showConfirm('解散房间', '确定解散房间？所有玩家将被移出。', '解散', '取消');
      if (!ok) return;
      const res = await fetch(`/boka/room/${ROOM_CODE}/dissolve`, { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      window.location.href = '/boka';
    }

    async function addBot() {
      const btn = document.getElementById('addBotBtn');
      if (btn.disabled) return;
      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = '添加中...';
      try {
        const res = await fetch(`/boka/room/${ROOM_CODE}/add_bot`, { method: 'POST' });
        const data = await res.json();
        if (data.error) { showToast(data.error); return; }
        showToast('机器人已加入');
        fetchState();
      } catch (e) { showToast('网络异常'); } finally {
        btn.disabled = false; btn.textContent = oldText;
      }
    }

    async function kickPlayer(username, nickname) {
      const ok = await showConfirm('踢出玩家', `确定将「${nickname}」踢出房间？`, '踢出', '取消');
      if (!ok) return;
      const res = await fetch(`/boka/room/${ROOM_CODE}/kick/${username}`, { method: 'POST' });
      const data = await res.json();
      if (data.error) { showToast(data.error); return; }
      showToast('已踢出');
      fetchState();
    }

    function avatarHtml(username) {
      return `<div class="avatar-fallback"><img src="/static/avatars/${username}.jpg" onerror="this.remove()" alt=""></div>`;
    }
    function showProfile(username) {
      if (username.startsWith('ai_')) { showToast("电脑玩家无资料"); return; }
      document.getElementById('profileIframe').src = '/user/' + username;
      document.getElementById('profileModal').style.display = 'flex';
    }

    function renderPlayers(players, owner) {
      const el = document.getElementById('playerList');
      el.innerHTML = '';
      const isPlaying = lastStatus && lastStatus.status === "playing";

      players.forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-item' + (p.username === MY_USERNAME ? ' is-me' : '');
        const isOwner = p.username === owner;
        const isMe = p.username === MY_USERNAME;

        let leftHtml = `
          <div onclick="showProfile('${p.username}')" style="cursor:pointer;">
            ${avatarHtml(p.username)}
          </div>
          <div class="player-name">
            ${p.nickname}${isMe ? '<span class="me-suffix">（我）</span>' : ''}
            ${isOwner ? '<span class="tag tag-owner">房主</span>' : ''}
            ${p.is_ai ? '<span class="tag tag-ai">AI</span>' : ''}
          </div>
        `;

        let rightHtml = '';
        if (isPlaying) {
          if (isMe) rightHtml = `<button class="right-action-btn btn-back" onclick="window.location.href='/boka/room/${ROOM_CODE}/battle'">返回卡桌</button>`;
          else rightHtml = `<button class="right-action-btn btn-spectate" onclick="window.location.href='/boka/room/${ROOM_CODE}/battle'">观战</button>`;
        } else {
          if (p.ready) rightHtml = `<span class="tag tag-ready">已准备</span>`;
          else if (IS_OWNER && !isMe) rightHtml = `<button class="right-action-btn btn-kick" onclick="event.stopPropagation();kickPlayer('${p.username}','${p.nickname}')">踢人</button>`;
        }

        div.innerHTML = `${leftHtml}<div style="flex:1;"></div><div style="flex-shrink:0;">${rightHtml}</div>`;
        el.appendChild(div);
      });
    }

    async function fetchState() {
      try {
        const res = await fetch(`/boka/room/${ROOM_CODE}/state`);
        const data = await res.json();
        if (data.error) return;
        lastStatus = data;
        document.getElementById('readyCount').textContent = data.ready_count;
        document.getElementById('playerCount').textContent = data.count;
        
        const me = (data.players || []).find(p => p.username === MY_USERNAME);
        const readyBtn = document.getElementById('readyBtn');
        if (me && !readyBtn.disabled) readyBtn.textContent = me.ready ? '取消准备' : '准备';
        
        if (IS_OWNER) {
          const allReady = data.players.every(p => p.ready);
          document.getElementById('startBtn').disabled = !(allReady && data.count >= 2);
        }
        
        renderPlayers(data.players || [], data.owner);
      } catch (e) { console.error(e); }
    }

    function startPolling() {
      if (statePollTimer) clearInterval(statePollTimer);
      statePollTimer = setInterval(fetchState, 3000);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (statePollTimer) clearInterval(statePollTimer); }
      else { fetchState(); startPolling(); }
    });

    fetchState();
    startPolling();
  </script>
  
  <div id="profileModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#e8e0cc; width:95%; max-width:500px; height:85vh; border-radius:20px; border:4px double #f0e0a0; position:relative; display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fffdf5; border-bottom:1px solid #d8d0bc;">
        <h3 style="margin:0; color:#8a6d1f; font-size:22px;">玩家资料</h3>
        <button onclick="document.getElementById('profileModal').style.display='none'" style="background:#fce8ec; color:#b85a6a; border:1px solid #e8c8d0; padding:8px 24px; border-radius:8px; font-weight:bold; cursor:pointer;">关闭</button>
      </div>
      <iframe id="profileIframe" src="" style="flex:1; width:100%; border:none; background:#e8e0cc;"></iframe>
    </div>
  </div>
</body>
</html>
