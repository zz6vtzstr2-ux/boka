<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搏卡房间 · 搏卡游戏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "LXGW WenKai", "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #e8e0cc;
      color: #333;
      margin: 0;
      padding: 16px 16px 90px 16px;
      min-height: 100vh;
    }
    .container { max-width: 868px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .title-block .page-name {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 4px;
      text-indent: 4px;
    }
    .title-block .en {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .back-btn {
      background: #fce8ec;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #e8c8d0;
      font-size: 15px;
      color: #b85a6a;
      text-decoration: none;
    }
    .back-btn:hover { background: #f8d8de; }

    .panel {
      background: rgba(255,255,255,0.92);
      border: 1px solid #d8d0bc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    /* 标题行：左鹅黄胶囊 + 右小按钮 */
    .panel-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .panel-title {
      display: inline-block;
      background: #fdf6d8;
      color: #8a6d1f;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #f0e0a0;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      text-indent: 3px;
    }
    .small-danger-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 10px;
      background: #e8a8a8;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    .small-danger-btn:hover { background: #d88888; }

    .room-code {
      font-size: 36px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 8px;
      text-align: center;
      margin: 8px 0;
    }
    .invite-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }
    .invite-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #d8d0bc;
      background: #f9f5e8;
      font-size: 13px;
      color: #666;
      font-family: inherit;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .copy-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #5bb8e8;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }
    .copy-btn:hover { background: #4aa8d8; }

    .ready-progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      color: #666;
      margin-bottom: 16px;
    }
    .ready-progress b {
      color: #b85a6a;
      font-size: 22px;
      font-weight: bold;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 120px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      text-indent: 3px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s;
    }
    .btn:disabled {
      background: #ccc !important;
      color: #fff !important;
      cursor: not-allowed;
      box-shadow: none !important;
      transform: none !important;
    }
    .btn-ready {
      background: #5cb85c;
      color: #fff;
      box-shadow: 0 2px 6px rgba(92,184,92,0.3);
    }
    .btn-ready:hover:not(:disabled) { transform: translateY(-2px); background: #4ea84e; }
    .btn-cancel-ready {
      background: #e8e0d8;
      color: #666;
      box-shadow: 0 2px 6px rgba(180,170,155,0.2);
    }
    .btn-cancel-ready:hover:not(:disabled) { transform: translateY(-2px); background: #d8d0c8; }
    .btn-blue {
      background: #5bb8e8;
      color: #fff;
      box-shadow: 0 2px 6px rgba(91,184,232,0.3);
    }
    .btn-blue:hover:not(:disabled) { transform: translateY(-2px); background: #4aa8d8; }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #f9f5e8;
      border: 1px solid #e0d8c0;
      border-radius: 10px;
    }
    .player-row img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 2px solid #d8d0bc;
    }
    .player-row .info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .player-row .nickname {
      font-size: 15px;
      color: #2c3e50;
      font-weight: bold;
    }
    .player-row .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 8px;
      background: #fdf6d8;
      color: #8a6d1f;
      border: 1px solid #f0e0a0;
    }
    .player-row .tag.owner {
      background: #fce8ec;
      color: #b85a6a;
      border-color: #e8c8d0;
    }
    .player-row .tag.ready {
      background: #e8f5e8;
      color: #4ea84e;
      border-color: #c8e0c8;
    }
    .player-row .tag.away {
      background: #f0f0f0;
      color: #999;
      border-color: #ddd;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 100px;
      background: rgba(44,110,90,0.95);
      color: #fff;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="page-name">搏卡房间</div>
        <div class="en">Room</div>
      </div>
      <a href="/boka" class="back-btn">返回列表</a>
    </div>

    <div class="panel">
      <div class="panel-title">房间号</div>
      <div class="room-code">{{ room_code }}</div>
      <div class="invite-row">
        <input class="invite-input" id="inviteInput" value="{{ invite_url }}" readonly>
        <button class="copy-btn" onclick="copyLink()">复制</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title-row">
        <div class="panel-title">玩家列表</div>
        {% if is_owner %}
        <button class="small-danger-btn" onclick="dissolveRoom()">解散房间</button>
        {% endif %}
      </div>

      <div class="ready-progress">
        已准备 <b id="readyCount">{{ ready_count }}</b> / <span id="playerCount">{{ player_count }}</span>
      </div>

      <div class="btn-row" style="margin-bottom: 16px;">
        <button class="btn {% if is_ready %}btn-cancel-ready{% else %}btn-ready{% endif %}" id="readyBtn" onclick="toggleReady()">
          {% if is_ready %}取消准备{% else %}准备{% endif %}
        </button>
        {% if is_owner %}
        <button class="btn btn-blue" id="startBtn" onclick="startGame()">开始游戏</button>
        {% endif %}
      </div>

      <div class="player-list" id="playerList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const roomCode = "{{ room_code }}";
    const isOwner = {{ 'true' if is_owner else 'false' }};
    const myUsername = "{{ current_user.username }}";

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function copyLink() {
      const input = document.getElementById('inviteInput');
      input.select();
      input.setSelectionRange(0, 99999);
      try {
        navigator.clipboard.writeText(input.value);
        showToast('链接已复制');
      } catch (e) {
        document.execCommand('copy');
        showToast('链接已复制');
      }
    }

    async function toggleReady() {
      const res = await fetch('/boka/room/' + roomCode + '/ready', { method: 'POST' });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      const btn = document.getElementById('readyBtn');
      if (data.ready) {
        btn.textContent = '取消准备';
        btn.className = 'btn btn-cancel-ready';
      } else {
        btn.textContent = '准备';
        btn.className = 'btn btn-ready';
      }
      refreshState();
    }

    async function startGame() {
      try {
        const res = await fetch('/boka/room/' + roomCode + '/start', { method: 'POST' });
        const data = await res.json();
        if (data.error) { alert('开始失败：' + data.error); return; }
        window.location.href = '/boka/room/' + roomCode + '/battle';
      } catch (e) {
        alert('网络或服务器错误：' + e);
      }
    }

    async function dissolveRoom() {
      if (!confirm('确定解散房间？')) return;
      try {
        const res = await fetch('/boka/room/' + roomCode + '/dissolve', { method: 'POST' });
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        window.location.href = '/boka';
      } catch (e) {
        alert('网络错误：' + e);
      }
    }

    function renderPlayers(players) {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-row';
        let tags = '';
        if (p.is_owner) tags += '<span class="tag owner">房主</span>';
        if (p.is_away) tags += '<span class="tag away">暂离</span>';
        if (p.ready) tags += '<span class="tag ready">已准备</span>';
        div.innerHTML = `
          <img src="/static/avatars/${p.username}.jpg" alt="">
          <div class="info">
            <span class="nickname">${p.nickname}${p.username === myUsername ? '（我）' : ''}</span>
            ${tags}
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function refreshState() {
      const res = await fetch('/boka/room/' + roomCode + '/state');
      const data = await res.json();
      if (data.error) return;
      document.getElementById('readyCount').textContent = data.ready_count;
      document.getElementById('playerCount').textContent = data.player_count;
      renderPlayers(data.players);

      const me = data.players.find(p => p.username === myUsername);
      const readyBtn = document.getElementById('readyBtn');
      if (me) {
        if (me.ready) {
          readyBtn.textContent = '取消准备';
          readyBtn.className = 'btn btn-cancel-ready';
        } else {
          readyBtn.textContent = '准备';
          readyBtn.className = 'btn btn-ready';
        }
      }

      if (data.status === 'playing') {
        window.location.href = '/boka/room/' + roomCode + '/battle';
      }
    }

    const initialPlayers = {{ players | tojson }};
    renderPlayers(initialPlayers);

    setInterval(refreshState, 2000);
  </script>
</body>
</html>
